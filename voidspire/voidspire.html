<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#04080a">
<title>VOIDSPIRE</title>
<style>
/* =========================================================================
 * VOIDSPIRE — retro-futuristic vector CRT styling
 * ========================================================================= */
:root {
  --bg: #04080a;
  --panel: #0a1418;
  --panel2: #0e1c22;
  --green: #5dff88;
  --green-dim: #2a7a46;
  --cyan: #41d8ff;
  --amber: #ffb02e;
  --magenta: #c86bff;
  --red: #ff4a5e;
  --text: #b8e6c4;
  --text-dim: #5e8a6c;
  --glow-g: 0 0 6px rgba(93, 255, 136, 0.55);
  --glow-c: 0 0 6px rgba(65, 216, 255, 0.55);
  --glow-a: 0 0 6px rgba(255, 176, 46, 0.55);
}

* { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

html, body {
  height: 100%;
  overflow: hidden;
  background: var(--bg);
  font-family: ui-monospace, 'SF Mono', 'Cascadia Mono', Menlo, Consolas, monospace;
  color: var(--text);
  -webkit-user-select: none;
  user-select: none;
  -webkit-text-size-adjust: 100%;
  touch-action: manipulation;
  overscroll-behavior: none;
}

/* the game fills the whole screen and adapts to its aspect ratio; the
   portrait column is capped so it never becomes an absurdly wide strip, while
   landscape fills edge-to-edge (PC / phone-rotated). */
#game {
  position: fixed;
  inset: 0;
  max-width: min(100vw, 620px);
  margin: 0 auto;
  overflow: hidden;
}
/* portrait scale-to-fit: render at a fixed design size, then scale the whole
 * frame uniformly to fill the window (so desktop looks like a bigger, crisp
 * phone — cards/HUD stay proportional and the canvas re-renders sharp). */
#game.scaled {
  inset: auto;
  left: 50%; top: 50%;
  width: var(--design-w, 400px);
  height: var(--design-h, 868px);
  max-width: none;
  margin: 0;
  transform: translate(-50%, -50%) scale(var(--ui-scale, 1));
  transform-origin: center center;
}
/* horizontal / landscape display mode (auto-selected by aspect, or forced) */
#game.landscape {
  max-width: none;
  max-height: none;
  margin: 0;
}
/* landscape overlays use the extra width: panel lists flow into 2 columns,
   card grids get wider; titles / buttons / bars stay full-width */
#game.landscape .screen {
  flex-flow: row wrap;
  align-content: flex-start;
  justify-content: center;
  gap: 0 14px;
  padding-left: 22px; padding-right: 22px;
}
#game.landscape .screen > * { flex-basis: 100%; }
#game.landscape .screen > .panel-btn { flex: 1 1 44%; max-width: 47%; margin: 5px 0; }
#game.landscape .screen > .comm-frame { flex-basis: auto; }
#game.landscape .card-grid { max-width: 760px; }

#battlefield { position: absolute; inset: 0; width: 100%; height: 100%; }

/* ---- CRT overlay ---- */
#crt {
  position: fixed; inset: 0; pointer-events: none; z-index: 200;
  background:
    repeating-linear-gradient(0deg, rgba(0,0,0,0.16) 0px, rgba(0,0,0,0.16) 1px, transparent 1px, transparent 3px),
    radial-gradient(ellipse at center, transparent 55%, rgba(0,0,0,0.42) 100%);
}

/* ========================= HUD ========================= */
#hud {
  position: absolute; top: 0; left: 0; right: 0; z-index: 110;
  padding: calc(env(safe-area-inset-top, 0px) + 8px) 10px 8px;
  pointer-events: none;
  background: linear-gradient(180deg, rgba(4,8,10,0.92) 55%, rgba(4,8,10,0.6) 82%, rgba(4,8,10,0));
}
#hud .row { display: flex; align-items: center; gap: 8px; }
#hud .hp-wrap { flex: 1; pointer-events: auto; }
#hud .hp-bar {
  position: relative; height: 18px;
  border: 1px solid var(--green-dim);
  background: rgba(10, 30, 18, 0.6);
  clip-path: polygon(0 0, calc(100% - 8px) 0, 100% 100%, 8px 100%);
}
#hud .hp-fill {
  position: absolute; inset: 1px; transform-origin: left;
  background: linear-gradient(90deg, #1e7a3c, var(--green));
  transition: transform 0.35s ease-out;
}
#hud .hp-text {
  position: absolute; inset: 0; text-align: center; font-size: 11px; line-height: 18px;
  color: #eaffe9; text-shadow: 0 0 4px #000, 0 0 4px #000; letter-spacing: 1px;
}
#hud .shield-chip {
  font-size: 12px; color: var(--cyan); text-shadow: var(--glow-c);
  border: 1px solid rgba(65,216,255,0.5); padding: 2px 6px; min-width: 38px; text-align: center;
  background: rgba(10, 25, 35, 0.7);
}
#hud .stat { font-size: 11px; color: var(--text-dim); letter-spacing: 1px; white-space: nowrap; }
#hud .stat b { color: var(--amber); text-shadow: var(--glow-a); font-weight: normal; }
#hud .row2 { margin-top: 4px; display: flex; align-items: center; gap: 6px; }
#hud .attr { font-size: 10px; letter-spacing: 1px; color: var(--text-dim); }
#hud .attr b { color: var(--text); font-weight: normal; }
#hud .spacer { flex: 1; }
#hud .icon-btn {
  pointer-events: auto; font-size: 10px; letter-spacing: 1px;
  border: 1px solid var(--green-dim); color: var(--text);
  background: rgba(10, 30, 18, 0.65); padding: 4px 8px; cursor: pointer;
}
#hud .artifact-row {
  margin-top: 4px; display: flex; flex-wrap: wrap; gap: 4px; pointer-events: auto;
}
#hud .artifact-chip {
  width: 22px; height: 22px; font-size: 10px; line-height: 20px; text-align: center;
  border: 1px solid var(--amber); color: var(--amber); text-shadow: var(--glow-a);
  background: rgba(35, 25, 5, 0.7); cursor: pointer;
}
/* quest relic: dashed border while in progress, glowing when complete */
#hud .artifact-chip.quest { border-style: dashed; border-color: var(--text-dim); color: var(--text-dim); text-shadow: none; }
#hud .artifact-chip.quest-done { border-color: var(--green); color: var(--green); text-shadow: var(--glow-g); animation: questGlow 1.8s ease-in-out infinite; }
@keyframes questGlow { 0%, 100% { box-shadow: 0 0 0 rgba(93,255,136,0); } 50% { box-shadow: 0 0 7px rgba(93,255,136,0.55); } }
#hud .status-row { margin-top: 4px; display: flex; gap: 4px; flex-wrap: wrap; }
.status-chip {
  font-size: 9px; letter-spacing: 1px; padding: 2px 5px;
  border: 1px solid var(--text-dim); color: var(--text);
  background: rgba(8, 18, 14, 0.8);
}
.status-chip.buff { border-color: var(--green-dim); color: var(--green); }
.status-chip.debuff { border-color: #804; color: var(--red); }
.status-chip.primed { border-color: var(--amber); color: var(--amber); text-shadow: 0 0 6px rgba(255,176,46,0.5); }
/* in-combat card pickers (Scry/Tutor/Discover) */
.card-grid .card.pick-ditch { opacity: 0.4; filter: grayscale(0.7); border-color: var(--red); }
.card-grid .card.pick-ditch::after {
  content: 'DISCARD'; position: absolute; top: 50%; left: 0; right: 0; transform: translateY(-50%) rotate(-12deg);
  text-align: center; color: var(--red); font-size: 13px; letter-spacing: 2px; text-shadow: 0 0 6px #000;
}
.btn.ghost { opacity: 0.7; border-style: dashed; }

/* ========================= HAND ========================= */
#hand {
  position: absolute; left: 0; right: 0;
  bottom: calc(env(safe-area-inset-bottom, 0px) + 6px);
  height: 148px; z-index: 30;
  display: flex; justify-content: center; align-items: flex-end;
  padding: 0 50px; pointer-events: none;   /* leave corners for the draw/discard piles */
}
.card {
  pointer-events: auto;
  touch-action: none;
  position: relative;
  width: 90px; min-width: 0; height: 128px;
  margin: 0 -8px;
  display: flex; flex-direction: column;
  background: linear-gradient(160deg, var(--panel2), var(--panel));
  border: 1px solid var(--green-dim);
  transform: var(--fan, none); transform-origin: bottom center;
  transition: transform 0.16s ease-out, box-shadow 0.16s, border-color 0.16s;
  cursor: pointer;
  flex-shrink: 1;
  clip-path: polygon(0 6px, 6px 0, 100% 0, 100% calc(100% - 6px), calc(100% - 6px) 100%, 0 100%);
}
/* lift the focused card clear of its neighbours so it's fully readable */
@media (hover: hover) {
  #hand .card:not(.selected):not(.dragging):hover {
    transform: translateY(-40px) scale(1.16) rotate(0deg); z-index: 40;
    box-shadow: 0 0 16px rgba(93,255,136,0.3), 0 10px 26px rgba(0,0,0,0.8);
  }
}
.card.type-attack { border-color: #9a5a20; }
.card.type-skill { border-color: #1f7a96; }
.card.type-power { border-color: #7a3f9a; }
.card.type-curse { border-color: #7a2030; }
/* energy cost — a clean vector hexagon (line-art, matches the CRT look) */
.card .cost { position: absolute; top: 0; left: 0; width: 24px; height: 24px; z-index: 3; }
.card .cost svg { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; }
.card .cost svg polygon {
  fill: rgba(4, 12, 16, 0.5); stroke: var(--cyan); stroke-width: 1.5;
  vector-effect: non-scaling-stroke; filter: drop-shadow(0 0 2.5px rgba(65, 216, 255, 0.85));
}
.card .cost .cost-n {
  position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
  font-size: 11px; font-weight: bold; color: #eaffff; text-shadow: 0 0 4px rgba(65, 216, 255, 0.9), 0 1px 1px #000;
}
.card.unaffordable .cost svg polygon { stroke: #ff6a6a; filter: drop-shadow(0 0 2.5px rgba(255,80,80,0.7)); }
.card.unaffordable .cost .cost-n { color: #ffd0d0; }
/* faint circuit-etch watermark */
.card::after {
  content: ''; position: absolute; inset: 0; pointer-events: none;
  background:
    repeating-linear-gradient(115deg, transparent 0 6px, rgba(184, 230, 196, 0.022) 6px 7px),
    linear-gradient(to top, rgba(184, 230, 196, 0.03), transparent 35%);
}
/* central vector glyph */
.card .cart { height: 38px; display: flex; align-items: center; justify-content: center; margin: 1px 0 0; }
.card .cart svg { width: 33px; height: 33px; filter: drop-shadow(0 0 3px currentColor); }
.card.type-attack .cart { color: var(--amber); }
.card.type-skill .cart { color: var(--cyan); }
.card.type-power .cart { color: var(--magenta); }
.card.type-curse .cart { color: var(--red); }
.card .rline { position: relative; height: 2px; margin: 1px 5px 3px; background: rgba(94, 138, 108, 0.35); }
.card .rline.r2 { background: linear-gradient(90deg, rgba(65, 216, 255, 0.7), transparent); box-shadow: 0 0 4px rgba(65, 216, 255, 0.4); }
.card .rline.r3 { background: linear-gradient(90deg, rgba(255, 176, 46, 0.9), transparent); box-shadow: 0 0 5px rgba(255, 176, 46, 0.6); }
.card .rtag { position: absolute; right: 0; top: -7px; font-size: 6.5px; letter-spacing: 1px; color: var(--amber); }
.card .rline.r2 .rtag { color: var(--cyan); }
.card .cname {
  margin: 4px 6px 1px 25px; font-size: 8.5px; line-height: 1.12; letter-spacing: 0.5px;
  color: var(--text); text-transform: uppercase; min-height: 19px;
}
.card.type-attack .cname { color: var(--amber); }
.card.type-skill .cname { color: var(--cyan); }
.card.type-power .cname { color: var(--magenta); }
.card.type-curse .cname { color: var(--red); }
.card .cdesc { flex: 1; font-size: 8.5px; line-height: 1.3; color: var(--text); padding: 0 5px 3px; overflow: hidden; }
/* keyword colouring — matches the on-field status pills */
.card .cdesc .kw { font-weight: bold; }
.kw-sh { color: #6fd0ff; } .kw-vu { color: #ff9a4a; } .kw-wk { color: #c88bff; }
.kw-bn { color: #ff7a4a; } .kw-mi { color: #7dffa0; } .kw-en { color: #ffe14a; }
.kw-ex { color: #ff8090; } .kw-rt { color: #9bd6ff; } .kw-hl { color: #7dffb0; }
.kw-ec, .kw-th, .kw-rg, .kw-pa { color: #cfeede; }
/* rare cards get an animated frame glow */
.card.rare { border-color: var(--amber); }
.card.rare::before {
  content: ''; position: absolute; inset: -1px; pointer-events: none; z-index: 2;
  border: 1px solid rgba(255, 176, 46, 0.5);
  clip-path: polygon(0 6px, 6px 0, 100% 0, 100% calc(100% - 6px), calc(100% - 6px) 100%, 0 100%);
  animation: rareGlow 2.4s ease-in-out infinite;
}
@keyframes rareGlow { 0%, 100% { box-shadow: inset 0 0 6px rgba(255,176,46,0.25); } 50% { box-shadow: inset 0 0 12px rgba(255,176,46,0.5); } }
.card.unc { border-color: #3aa6c8; }
/* legendary cards — brighter gold animated frame */
.card.legendary { border-color: #ffd24a; }
.card.legendary::before {
  content: ''; position: absolute; inset: -1px; pointer-events: none; z-index: 2;
  border: 1px solid rgba(255, 210, 74, 0.7);
  clip-path: polygon(0 6px, 6px 0, 100% 0, 100% calc(100% - 6px), calc(100% - 6px) 100%, 0 100%);
  animation: legGlow 1.8s ease-in-out infinite;
}
@keyframes legGlow { 0%, 100% { box-shadow: inset 0 0 8px rgba(255,210,74,0.35); } 50% { box-shadow: inset 0 0 18px rgba(255,210,74,0.75); } }
.card .rline.r4 { background: linear-gradient(90deg, #ffd24a, transparent); box-shadow: 0 0 6px rgba(255,210,74,0.7); }
.card .rline.r4 .rtag { color: #ffe88a; }
/* void-touched (corrupted) cards — magenta, hungry */
.card.vtouched { border-color: var(--magenta); }
.card.vtouched .cart { color: var(--magenta) !important; }
.card.vtouched .cname { color: #dca6ff; }
.card.vtouched::before {
  content: ''; position: absolute; inset: -1px; pointer-events: none; z-index: 2;
  border: 1px solid rgba(200, 107, 255, 0.65);
  clip-path: polygon(0 6px, 6px 0, 100% 0, 100% calc(100% - 6px), calc(100% - 6px) 100%, 0 100%);
  animation: vtouchGlow 2s ease-in-out infinite;
}
@keyframes vtouchGlow { 0%, 100% { box-shadow: inset 0 0 8px rgba(200,107,255,0.3); } 50% { box-shadow: inset 0 0 18px rgba(200,107,255,0.6); } }
.card.unaffordable { opacity: 0.45; }
.card.selected {
  transform: translateY(-72px) scale(1.62);
  z-index: 50;
  box-shadow: 0 0 18px rgba(93, 255, 136, 0.35), 0 8px 30px rgba(0,0,0,0.8);
  border-color: var(--green);
}
.card.unplayable-curse { filter: saturate(0.5) brightness(0.8); }
.card.dragging {
  transition: none;
  z-index: 60;
  box-shadow: 0 12px 30px rgba(0, 0, 0, 0.8);
}
.card.will-play {
  border-color: var(--green);
  box-shadow: 0 0 18px rgba(93, 255, 136, 0.55), 0 12px 30px rgba(0, 0, 0, 0.8);
}

/* ========================= COMBAT CONTROLS ========================= */
#combat-controls {
  position: absolute; right: 8px;
  bottom: calc(env(safe-area-inset-bottom, 0px) + 160px);
  z-index: 25; display: flex; flex-direction: column; gap: 8px; align-items: flex-end;
}
#energy-pip {
  position: absolute; left: 8px;
  bottom: calc(env(safe-area-inset-bottom, 0px) + 160px);
  z-index: 25;
  font-size: 17px; color: var(--cyan); text-shadow: var(--glow-c);
  border: 1px solid rgba(65,216,255,0.55);
  background: rgba(5, 20, 28, 0.85); padding: 7px 12px;
}

/* ===== Cockpit rail — left-edge buttons (beside the pilot) + tactical panels ===== */
#rail {
  position: absolute; left: 4px; top: 50%; transform: translateY(-50%);
  z-index: 28; display: none; flex-direction: column; gap: 6px; pointer-events: auto;
}
/* leader line linking an open panel back to its button */
#rail-line { position: absolute; left: 0; top: 0; z-index: 28; pointer-events: none; overflow: visible; }
#rail-line polyline { filter: drop-shadow(0 0 3px currentColor); opacity: 0.85; }
.rail-btn {
  width: 38px; height: 40px; border: 1px solid var(--rc); background: rgba(6,16,22,0.85);
  color: var(--rc); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1px;
  cursor: pointer; position: relative; transition: background 0.12s, box-shadow 0.12s;
  clip-path: polygon(0 5px, 5px 0, 100% 0, 100% calc(100% - 5px), calc(100% - 5px) 100%, 0 100%);
}
.rail-btn:active { transform: scale(0.94); }
.rail-btn.active { background: var(--rc); color: #04080a; box-shadow: 0 0 11px var(--rc); }
.rail-btn .rk-ic { font-size: 13px; line-height: 1; }
.rail-btn .rk-n { font-size: 8px; opacity: 0.85; }
#rail-panel {
  position: absolute; z-index: 29; min-width: 158px; max-width: 232px;
  border: 1px solid var(--rc); background: rgba(5,13,17,0.94);
  padding: 5px 8px 6px; pointer-events: auto;
  box-shadow: 0 0 14px rgba(0,0,0,0.7), inset 0 0 18px rgba(0,0,0,0.35);
  clip-path: polygon(0 6px, 6px 0, 100% 0, 100% calc(100% - 6px), calc(100% - 6px) 100%, 0 100%);
}
.rp-title { color: var(--rc); font-size: 9px; letter-spacing: 1.5px; border-bottom: 1px solid var(--rc); margin-bottom: 5px; padding-bottom: 4px; text-shadow: 0 0 5px var(--rc); opacity: 0.95; }
.rp-scroll { max-height: 196px; overflow-y: auto; overflow-x: hidden; padding-right: 2px; }
.rp-scroll::-webkit-scrollbar { width: 5px; }
.rp-scroll::-webkit-scrollbar-thumb { background: var(--rc); opacity: 0.5; }
.rp-scroll::-webkit-scrollbar-track { background: rgba(255,255,255,0.05); }
.rp-sub { color: var(--text-dim); font-size: 7.5px; letter-spacing: 1px; margin: 5px 0 2px; }
.rp-row { display: flex; align-items: center; gap: 7px; padding: 2px 0; font-size: 10px; }
.rp-dot { color: var(--rc); font-size: 8px; opacity: 0.7; }
.rp-name { color: var(--text); flex: 1; }
.rp-val { color: var(--green); font-weight: bold; margin-left: auto; }
.rp-val.rp-bad { color: var(--red); }
.rp-exp { cursor: pointer; }
.rp-box { color: var(--rc); font-size: 11px; line-height: 1; }
.rp-text { color: var(--text-dim); font-size: 8.5px; line-height: 1.35; padding: 1px 0 4px 18px; }
.rp-relic-name.off { color: var(--text-dim); text-decoration: line-through; opacity: 0.7; }
.rp-empty { color: var(--text-dim); font-style: italic; font-size: 9px; padding: 2px 0; }
.rp-state { font-size: 7px; padding: 0 3px; margin-left: 6px; border: 1px solid; letter-spacing: 0.5px; }
.rp-state.on { color: var(--green); border-color: var(--green-dim); }
.rp-state.off { color: var(--text-dim); border-color: var(--text-dim); }
.rp-spent { font-size: 7px; color: var(--red); margin-left: 6px; }
.rp-dur { font-size: 8px; color: var(--amber); }
/* relic toggle state on the map HUD chips */
.artifact-chip { position: relative; }
.artifact-chip.relic-off { opacity: 0.32; filter: grayscale(0.75); }
.artifact-chip.relic-toggle { cursor: pointer; }
.relic-uses { position: absolute; bottom: -3px; right: -3px; font-size: 8px; font-weight: bold; color: var(--amber); background: rgba(4,8,10,0.92); border: 1px solid var(--amber); border-radius: 7px; padding: 0 2px; line-height: 1.1; }

/* ===== Crew Manifest — the Warpcaller's interactive formation panel ===== */
#manifest {
  position: absolute; left: 48px; top: 50%; transform: translateY(-54%);
  z-index: 28; display: none; flex-direction: column; gap: 4px;
  width: 52px; pointer-events: auto;
}
.mf-head { font: 8px monospace; letter-spacing: 0.5px; color: var(--green-dim); text-align: center; }
.mf-head b { color: var(--cyan); }
.mf-empty { font: 7px monospace; line-height: 1.35; color: #4a5a60; text-align: center; opacity: 0.75; }
.mf-cell {
  position: relative; width: 52px; height: 48px;
  border: 1px solid rgba(123,140,255,0.4); background: rgba(6,14,22,0.82);
  display: flex; flex-direction: column; align-items: center; justify-content: flex-end;
  cursor: pointer; transition: border-color 0.14s, box-shadow 0.14s, transform 0.1s;
  clip-path: polygon(0 4px, 4px 0, 100% 0, 100% calc(100% - 4px), calc(100% - 4px) 100%, 0 100%);
}
.mf-cell.big { height: 66px; }      /* size-2 pets fill two slots */
.mf-cell:active { transform: scale(0.95); }
.mf-cell.front { border-color: rgba(255,210,74,0.85); box-shadow: 0 0 7px rgba(255,210,74,0.28); }
.mf-cell.sel { border-color: #fff; box-shadow: 0 0 11px rgba(255,255,255,0.55); }
.mf-front {
  position: absolute; top: 0; left: 0; right: 0; text-align: center;
  font: 6px monospace; letter-spacing: 1px; color: #ffd24a;
  background: rgba(255,210,74,0.16); padding: 1px 0;
}
.mf-size { position: absolute; top: 1px; right: 2px; font: 7px monospace; color: #7b8cff; }
.mf-fig { flex: 1; width: 32px; display: flex; align-items: center; justify-content: center; }
.mf-fig svg.vec { width: 100%; height: 100%; }
.mf-hp { width: 38px; height: 3px; background: rgba(255,255,255,0.16); }
.mf-hp-fill { width: 100%; height: 100%; transform-origin: left; }
.mf-stats { display: flex; gap: 5px; font: 8px monospace; margin: 1px 0 3px; }
.mf-act { font-weight: bold; }
.mf-hpn { color: #9fb6c0; }

/* ===== draw / discard piles (tap to inspect) ===== */
#draw-pile, #discard-pile {
  position: absolute; bottom: calc(env(safe-area-inset-bottom, 0px) + 6px);
  z-index: 29; width: 44px; text-align: center; pointer-events: auto; cursor: pointer;
}
#draw-pile { left: 5px; }
#discard-pile { right: 5px; }
.pile-card {
  width: 34px; height: 46px; margin: 0 auto; position: relative;
  border: 1px solid var(--green-dim);
  background: linear-gradient(160deg, var(--panel2), var(--panel));
  clip-path: polygon(0 5px, 5px 0, 100% 0, 100% calc(100% - 5px), calc(100% - 5px) 100%, 0 100%);
}
#draw-pile .pile-card { box-shadow: 3px -3px 0 -1px rgba(20,40,30,0.75), 6px -6px 0 -2px rgba(14,28,22,0.5); }
#discard-pile .pile-card { box-shadow: -3px -3px 0 -1px rgba(28,32,30,0.6), -6px -6px 0 -2px rgba(18,22,22,0.4); }
#draw-pile:active .pile-card, #discard-pile:active .pile-card { filter: brightness(1.3); }
.pile-ic { position: absolute; left: 50%; top: 45%; transform: translate(-50%, -50%); width: 24px; height: 30px; }
.pile-ic svg, svg.pile-ic { width: 100%; height: 100%; }
.pile-discard .pile-ic { opacity: 0.55; filter: saturate(0.55); }
.pile-n {
  position: absolute; right: -3px; bottom: -3px; min-width: 15px; padding: 0 2px;
  font-size: 10px; font-weight: bold; line-height: 14px; color: var(--text);
  background: rgba(4, 10, 12, 0.95); border: 1px solid var(--green-dim);
}
.pile-lbl { font-size: 7px; letter-spacing: 1px; color: var(--text-dim); margin-top: 3px; }
.pile-card.blink { animation: pileBlink 0.46s ease-out; }
@keyframes pileBlink {
  0%, 100% { box-shadow: 0 0 0 var(--blink); border-color: var(--green-dim); }
  35% { box-shadow: 0 0 15px 3px var(--blink); border-color: var(--blink); }
}

/* card dematerialisation — the clone (keeps the .card face) breaks into rising
   scan-lines and beams upward, transporter / Gauss-flayer style */
.card-ghost { position: fixed; z-index: 70; pointer-events: none; }

/* Technomancer — transporter beam-up: rising scan-lines (cyan) */
.card-ghost.beam-tech {
  box-shadow: 0 0 16px 1px var(--beam, #9fe);
  -webkit-mask-image: repeating-linear-gradient(0deg, #000 0 2px, rgba(0,0,0,0.08) 2px 5px);
          mask-image: repeating-linear-gradient(0deg, #000 0 2px, rgba(0,0,0,0.08) 2px 5px);
  -webkit-mask-size: 100% 220%; mask-size: 100% 220%;
  animation: beamTech 0.38s ease-out forwards;
}
@keyframes beamTech {
  0%   { opacity: 1; filter: brightness(1) saturate(1);
         transform: translateY(0) scaleY(1); -webkit-mask-position: 0 0; mask-position: 0 0; }
  16%  { opacity: 1; filter: brightness(2.7) saturate(1.7); }
  100% { opacity: 0; filter: brightness(3) saturate(2);
         transform: translateY(-30px) scaleY(1.06); -webkit-mask-position: 0 -48px; mask-position: 0 -48px; }
}

/* Vanguard — kinetic shatter: flashes and blasts apart along diagonal shards (amber) */
.card-ghost.beam-van {
  box-shadow: 0 0 18px 2px var(--beam, #fa3);
  -webkit-mask-image: repeating-linear-gradient(108deg, #000 0 5px, rgba(0,0,0,0.04) 5px 9px);
          mask-image: repeating-linear-gradient(108deg, #000 0 5px, rgba(0,0,0,0.04) 5px 9px);
  animation: shatterVan 0.26s cubic-bezier(0.2, 0.7, 0.3, 1) forwards;
}
@keyframes shatterVan {
  0%   { opacity: 1; filter: brightness(1); transform: scale(1); }
  22%  { opacity: 1; filter: brightness(3) saturate(1.7); transform: scale(1.05); }
  100% { opacity: 0; filter: brightness(2.6); transform: scale(1.22) skewX(-8deg) translateY(8px); }
}

/* Void Adept — collapses in on itself into the void (magenta), no spin */
.card-ghost.beam-void {
  box-shadow: 0 0 22px 2px var(--beam, #c6f);
  animation: collapseVoid 0.3s cubic-bezier(0.6, 0, 0.9, 1) forwards;
}
@keyframes collapseVoid {
  0%   { opacity: 1; filter: brightness(1) saturate(1); transform: scale(1, 1); }
  35%  { opacity: 1; filter: brightness(2) saturate(1.8); transform: scale(1.03, 1.03); }
  72%  { opacity: 1; filter: brightness(1.8); transform: scale(0.1, 1.02); }   /* crushed inward to a sliver */
  100% { opacity: 0; filter: brightness(2.4); transform: scale(0.02, 0.04); }  /* sliver collapses to nothing */
}

.btn {
  font-family: inherit;
  font-size: 13px; letter-spacing: 2px; text-transform: uppercase;
  color: var(--green); text-shadow: var(--glow-g);
  background: rgba(10, 30, 18, 0.85);
  border: 1px solid var(--green);
  padding: 12px 18px;
  cursor: pointer;
  transition: background 0.12s, transform 0.06s;
  clip-path: polygon(0 8px, 8px 0, 100% 0, 100% calc(100% - 8px), calc(100% - 8px) 100%, 0 100%);
}
.btn:active { background: rgba(40, 90, 55, 0.9); transform: scale(0.97); }
.btn.dim { color: var(--text-dim); border-color: var(--green-dim); text-shadow: none; }
.btn.amber { color: var(--amber); border-color: var(--amber); text-shadow: var(--glow-a); background: rgba(35,25,5,0.85); }
.btn.cyan { color: var(--cyan); border-color: var(--cyan); text-shadow: var(--glow-c); background: rgba(5,20,28,0.85); }
.btn.magenta { color: var(--magenta); border-color: var(--magenta); text-shadow: 0 0 6px rgba(200,107,255,0.55); background: rgba(22,8,30,0.85); }
.btn.red { color: var(--red); border-color: var(--red); background: rgba(30,8,12,0.85); }
.btn.small { font-size: 11px; padding: 8px 12px; }
.btn:disabled { opacity: 0.35; pointer-events: none; }

#deck-counts {
  position: absolute; left: 8px;
  bottom: calc(env(safe-area-inset-bottom, 0px) + 8px);
  z-index: 31; font-size: 9px; color: var(--text-dim); letter-spacing: 1px;
  pointer-events: none;
}
#deck-counts span { margin-right: 8px; }

/* ========================= FLOATERS ========================= */
#floaters { position: absolute; inset: 0; z-index: 60; pointer-events: none; overflow: hidden; }
.floater {
  position: absolute; transform: translate(-50%, -50%);
  font-size: 20px; color: var(--red); text-shadow: 0 0 8px rgba(255,74,94,0.7), 0 1px 2px #000;
  animation: floatUp 0.9s ease-out forwards;
  white-space: nowrap;
}
.floater.heal { color: var(--green); text-shadow: 0 0 8px rgba(93,255,136,0.7); }
.floater.block { color: var(--cyan); text-shadow: 0 0 8px rgba(65,216,255,0.7); }
.floater.crit { font-size: 28px; color: var(--amber); text-shadow: 0 0 12px rgba(255,176,46,0.9); }
.floater.status { font-size: 13px; color: var(--magenta); }
.floater.roll { font-size: 12px; color: var(--text-dim); }
@keyframes floatUp {
  0% { opacity: 0; transform: translate(-50%, -30%) scale(0.6); }
  15% { opacity: 1; transform: translate(-50%, -50%) scale(1.1); }
  100% { opacity: 0; transform: translate(-50%, -160%) scale(1); }
}

/* ========================= OVERLAY SCREENS ========================= */
#overlay { position: absolute; inset: 0; z-index: 100; display: none; }
#overlay.active { display: block; }
.screen {
  position: absolute; inset: 0;
  background: rgba(3, 7, 9, 0.93);
  display: flex; flex-direction: column; align-items: center;
  padding: calc(env(safe-area-inset-top, 0px) + 26px) 18px calc(env(safe-area-inset-bottom, 0px) + 20px);
  overflow-y: auto;
  animation: screenIn 0.34s cubic-bezier(0.2, 0.8, 0.3, 1);
}
.screen.clear { background: rgba(3, 7, 9, 0.78); }
@keyframes screenIn {
  0% { opacity: 0; transform: translateY(16px) scale(0.985); filter: brightness(2) saturate(1.5); }
  100% { opacity: 1; transform: none; filter: none; }
}
/* CRT power-on sweep across each new screen */
.screen::before {
  content: ''; position: absolute; left: 0; right: 0; height: 26px; top: -10%;
  background: linear-gradient(rgba(93, 255, 136, 0), rgba(93, 255, 136, 0.10), rgba(93, 255, 136, 0));
  pointer-events: none;
  animation: screenSweep 0.55s ease-out forwards;
}
@keyframes screenSweep { 0% { top: -10%; opacity: 1; } 100% { top: 105%; opacity: 0; } }
/* cascade-in for menu panels & card grids (delay set per element via --d) */
.screen .panel-btn, .screen .card-grid .card {
  animation: riseIn 0.34s cubic-bezier(0.2, 0.8, 0.3, 1) backwards;
  animation-delay: var(--d, 0ms);
}
@keyframes riseIn { from { opacity: 0; transform: translateY(16px); } }

.title-logo {
  font-size: 38px; letter-spacing: 8px; color: var(--green);
  text-shadow: 0 0 18px rgba(93,255,136,0.6); margin: 36px 0 4px; text-align: center;
  animation: flickerOn 1.1s backwards;
}
@keyframes flickerOn {
  0% { opacity: 0; } 8% { opacity: 0.7; } 12% { opacity: 0.15; }
  20% { opacity: 1; } 26% { opacity: 0.4; } 34% { opacity: 1; }
  44% { opacity: 0.8; } 52% { opacity: 1; }
}
.subtitle { font-size: 10px; letter-spacing: 4px; color: var(--text-dim); margin-bottom: 28px; text-align: center; }

h2.screen-title {
  font-size: 17px; letter-spacing: 4px; color: var(--green);
  text-shadow: var(--glow-g); margin-bottom: 4px; text-align: center; font-weight: normal;
  text-transform: uppercase;
}
.screen-sub { font-size: 10px; letter-spacing: 2px; color: var(--text-dim); margin-bottom: 18px; text-align: center; }

.panel-btn {
  width: 100%; max-width: 420px;
  background: linear-gradient(160deg, var(--panel2), var(--panel));
  border: 1px solid var(--green-dim);
  padding: 14px; margin-bottom: 12px; cursor: pointer;
  transition: border-color 0.12s, transform 0.08s;
  text-align: left;
  clip-path: polygon(0 8px, 8px 0, 100% 0, 100% calc(100% - 8px), calc(100% - 8px) 100%, 0 100%);
}
.panel-btn:active { transform: scale(0.985); border-color: var(--green); }
.panel-btn .pb-title { font-size: 13px; letter-spacing: 2px; color: var(--green); text-shadow: var(--glow-g); text-transform: uppercase; }
.panel-btn .pb-sub { font-size: 10px; color: var(--text-dim); margin-top: 4px; letter-spacing: 0.5px; }
.panel-btn .pb-desc { font-size: 10.5px; color: var(--text); margin-top: 6px; line-height: 1.45; }
.panel-btn.amber .pb-title { color: var(--amber); text-shadow: var(--glow-a); }
.panel-btn.cyan .pb-title { color: var(--cyan); text-shadow: var(--glow-c); }
.panel-btn.magenta .pb-title { color: var(--magenta); }
.panel-btn.disabled { opacity: 0.4; pointer-events: none; }
.panel-btn.pact { border-color: var(--red); }
/* ---- Codex ---- */
.codex-nav { display: flex; flex-wrap: wrap; gap: 6px; justify-content: center; width: 100%; max-width: 560px; margin: 2px 0 14px; }
.codex-chip { font-size: 9.5px; letter-spacing: 1px; text-transform: uppercase; padding: 4px 8px; border: 1px solid var(--green-dim); border-radius: 3px; color: var(--text-dim); cursor: pointer; white-space: nowrap; }
.codex-chip.active { color: var(--cyan); border-color: var(--cyan); text-shadow: var(--glow-c); }
.codex-body { width: 100%; max-width: 560px; }
.codex-intro { font-size: 11px; color: var(--text-dim); line-height: 1.55; margin-bottom: 14px; font-style: italic; }
.codex-entry { margin-bottom: 12px; line-height: 1.5; }
.codex-term { display: block; font-size: 11.5px; letter-spacing: 1.2px; color: var(--cyan); text-shadow: var(--glow-c); text-transform: uppercase; margin-bottom: 2px; }
.codex-term.off { color: var(--amber); text-shadow: var(--glow-a); }
.codex-term.def { color: var(--cyan); text-shadow: var(--glow-c); }
.codex-term.sp { color: var(--magenta); text-shadow: none; }
.codex-term.bad { color: var(--red); text-shadow: none; }
.codex-def { font-size: 11.5px; color: var(--text); }
.vol-slider {
  -webkit-appearance: none; appearance: none;
  width: 100%; height: 4px; margin-top: 10px; cursor: pointer;
  background: linear-gradient(90deg, var(--cyan), rgba(65,216,255,0.18));
  border-radius: 2px; outline: none; accent-color: var(--cyan);
}
.vol-slider::-webkit-slider-thumb {
  -webkit-appearance: none; appearance: none;
  width: 14px; height: 14px; border-radius: 50%;
  background: var(--cyan); box-shadow: var(--glow-c); border: 0;
}
.vol-slider::-moz-range-thumb {
  width: 14px; height: 14px; border-radius: 50%;
  background: var(--cyan); box-shadow: var(--glow-c); border: 0;
}
.panel-btn.pact .pb-title { color: var(--red); text-shadow: 0 0 6px rgba(255,74,94,0.4); }
.aug-tag {
  font-size: 8px; letter-spacing: 1px; vertical-align: middle;
  border: 1px solid currentColor; border-radius: 2px; padding: 1px 4px; margin-left: 6px; opacity: 0.8;
}

.event-text {
  max-width: 420px; font-size: 12.5px; line-height: 1.7; color: var(--text);
  margin-bottom: 20px; border-left: 2px solid var(--green-dim); padding-left: 12px;
}

/* resource readout shown on overlay screens (events hide the HUD) */
.res-line {
  display: flex; gap: 14px; justify-content: center; margin-bottom: 14px;
  font-size: 12px; letter-spacing: 1px;
}
.res-line .res-cr { color: var(--amber); text-shadow: var(--glow-a); }
.res-line .res-hp { color: var(--green); text-shadow: var(--glow-g); }

/* per-choice reward/cost preview */
.panel-btn .pv { margin-top: 7px; display: flex; flex-wrap: wrap; gap: 4px; align-items: center; }
.panel-btn .pv-row { display: inline-flex; flex-wrap: wrap; gap: 4px; align-items: center; width: 100%; font-size: 9px; color: var(--text-dim); letter-spacing: 0.5px; }
.fx-chip {
  font-size: 9px; letter-spacing: 0.5px; padding: 1px 5px; border-radius: 2px;
  border: 1px solid currentColor; white-space: nowrap;
}
.fx-chip.good { color: var(--green); }
.fx-chip.bad { color: var(--red); }
.fx-chip.check { color: var(--cyan); }
.event-result-text { color: var(--cyan); }

.dice-box {
  font-size: 40px; color: var(--amber); text-shadow: 0 0 14px rgba(255,176,46,0.7);
  margin: 14px 0; letter-spacing: 2px; min-height: 52px; text-align: center;
}
.dice-box .dc { font-size: 12px; color: var(--text-dim); display: block; letter-spacing: 2px; }
.dice-box.pass { color: var(--green); text-shadow: 0 0 14px rgba(93,255,136,0.7); }
.dice-box.fail { color: var(--red); text-shadow: 0 0 14px rgba(255,74,94,0.7); }

.gain-list { margin: 10px 0 18px; text-align: center; }
.gain-list div { font-size: 12px; color: var(--amber); margin: 4px 0; letter-spacing: 1px; }

/* card grid for rewards / deck view */
.card-grid {
  display: flex; flex-wrap: wrap; justify-content: center; gap: 10px;
  max-width: 440px; margin-bottom: 16px;
}
.card-grid .card { margin: 0; pointer-events: auto; }
.card-grid .card.picked { border-color: var(--green); box-shadow: 0 0 14px rgba(93,255,136,0.4); }
.card-grid .card .price {
  position: absolute; bottom: 3px; right: 5px; font-size: 10px;
  color: var(--amber); text-shadow: var(--glow-a);
}
.card-grid .card.sold { opacity: 0.3; pointer-events: none; }

.shop-row { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; max-width: 440px; margin-bottom: 14px; }

.big-score { font-size: 34px; color: var(--amber); text-shadow: var(--glow-a); margin: 10px 0; letter-spacing: 3px; }

.sector-banner {
  font-size: 22px; letter-spacing: 6px; color: var(--green); text-shadow: 0 0 16px rgba(93,255,136,0.65);
  margin: 40px 0 8px; text-align: center;
  animation: bannerIn 0.85s cubic-bezier(0.2, 0.9, 0.25, 1) backwards;
}
@keyframes bannerIn {
  0% { opacity: 0; letter-spacing: 28px; filter: blur(5px); }
  100% { opacity: 1; letter-spacing: 6px; filter: none; }
}
.faction-tag { font-size: 11px; letter-spacing: 3px; margin-bottom: 30px; }

.footer-note { margin-top: auto; padding-top: 14px; font-size: 9px; letter-spacing: 2px; color: var(--text-dim); text-align: center; }

/* ========================= VECTOR SVG ART ========================= */
svg.vec { display: block; }
svg.vec polyline {
  fill: none; stroke: currentColor; stroke-width: 1.4;
  stroke-linejoin: round; stroke-linecap: round;
  vector-effect: non-scaling-stroke;
}
svg.vec circle.eye { fill: #f2fff5; stroke: none; animation: blink 4.6s infinite; }
@keyframes blink { 0%, 90% { opacity: 1; } 93%, 96% { opacity: 0.1; } 100% { opacity: 1; } }

.art-icon { width: 15px; height: 15px; color: var(--amber); }
.artifact-chip { display: flex; align-items: center; justify-content: center; }
.pb-icon { display: inline-block; width: 17px; height: 17px; vertical-align: -4px; margin-right: 7px; color: var(--amber); }
.pb-icon svg { width: 100%; height: 100%; }

/* ---- event comm-frame: the picture that talks ---- */
.comm-frame {
  position: relative; width: 132px; height: 132px; margin: 0 auto 14px;
  border: 1px solid var(--green-dim);
  background: rgba(5, 14, 11, 0.85);
  clip-path: polygon(0 10px, 10px 0, 100% 0, 100% calc(100% - 10px), calc(100% - 10px) 100%, 0 100%);
  flex-shrink: 0;
  animation: commOn 0.5s ease-out backwards;
}
@keyframes commOn {
  0% { opacity: 0; transform: scaleY(0.05); filter: brightness(3); }
  45% { opacity: 1; transform: scaleY(1.04); }
  100% { transform: none; filter: none; }
}
.comm-frame svg.portrait {
  position: absolute; inset: 8px; width: calc(100% - 16px); height: calc(100% - 16px);
  filter: drop-shadow(0 0 5px currentColor);
  animation: portraitBob 3.4s ease-in-out infinite;
}
@keyframes portraitBob { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(2px); } }
.comm-scan {
  position: absolute; inset: 0; pointer-events: none;
  background: repeating-linear-gradient(0deg, rgba(0, 0, 0, 0.22) 0 1px, transparent 1px 3px);
}
.comm-frame::after {
  content: ''; position: absolute; left: 0; right: 0; height: 16px; top: -15%;
  background: linear-gradient(rgba(184, 230, 196, 0), rgba(184, 230, 196, 0.12), rgba(184, 230, 196, 0));
  animation: scanSweep 3s linear infinite;
  pointer-events: none;
}
@keyframes scanSweep { 0% { top: -15%; } 100% { top: 110%; } }
.comm-frame .mouth { transform-box: fill-box; transform-origin: center; }
.comm-frame.talking .mouth { animation: talk 0.18s infinite alternate; }
@keyframes talk {
  from { transform: translateY(-0.3px) scaleX(0.55) scaleY(0.4); stroke-width: 1.9; }
  to { transform: translateY(0.4px) scaleX(1) scaleY(1.5); stroke-width: 1; }
}
.comm-frame.mini { width: 74px; height: 74px; margin-bottom: 10px; }

/* hand deal-in */
#hand .card.deal {
  animation: dealIn 0.36s cubic-bezier(0.2, 0.8, 0.3, 1) backwards;
  animation-delay: var(--d, 0ms);
}
@keyframes dealIn { from { opacity: 0; transform: translateY(80px) rotate(5deg); } }

/* ========================= STAR-CHART MAP ========================= */
/* the map screen is translucent so the live space backdrop shows through */
.screen.map-screen {
  background:
    radial-gradient(ellipse at 50% 38%, rgba(3, 7, 9, 0.42), rgba(3, 7, 9, 0.8) 78%);
  overflow: hidden;   /* the chart flexes to fit — the screen never scrolls */
}
.map-wrap {
  width: 100%; max-width: 460px; flex: 1 1 auto; min-height: 340px;
  overflow-y: auto; overflow-x: hidden;
  -webkit-overflow-scrolling: touch;
  margin: 6px 0 6px;
  background: transparent;
  -webkit-mask-image: linear-gradient(transparent, #000 22px, #000 calc(100% - 22px), transparent);
  mask-image: linear-gradient(transparent, #000 22px, #000 calc(100% - 22px), transparent);
}
/* landscape: the chart flows left->right and fits the box, so no scrolling */
.map-wrap.land {
  max-width: none; min-height: 0; flex: 0 1 auto; height: 70%; overflow: hidden;
  display: flex; align-items: center; justify-content: center;
  margin: 2px 0;
  -webkit-mask-image: none; mask-image: none;
}
/* the wrap has a definite height, so the chart fills it and preserveAspectRatio
 * "meet" contains it — leaving the title & legends room, no scroll. */
.map-wrap.land .starchart { width: 100%; height: 100%; max-width: 100%; max-height: 100%; }
.starchart { display: block; width: 100%; height: auto; overflow: visible; }

/* ---- routes ---- */
.starchart .edge { fill: none; stroke-linecap: round; }
.starchart .edge.dim { stroke: rgba(150, 190, 170, 0.22); stroke-width: 1.2; stroke-dasharray: 1.5 7; }
.starchart .edge.trav { stroke: rgba(184, 230, 196, 0.6); stroke-width: 2; filter: drop-shadow(0 0 3px rgba(184, 230, 196, 0.4)); }
.starchart .edge.live {
  stroke: var(--green); stroke-width: 2.4;
  stroke-dasharray: 5 6; animation: dashFlow 0.6s linear infinite;
  filter: drop-shadow(0 0 4px rgba(93, 255, 136, 0.8));
}
@keyframes dashFlow { to { stroke-dashoffset: -11; } }
.starchart .waypt { fill: rgba(184, 230, 196, 0.55); }
.starchart .waypt.live { fill: var(--green); filter: drop-shadow(0 0 3px var(--green)); }

/* ---- node hex frames ---- */
.starchart .hexfill { fill: rgba(6, 12, 14, 0.82); stroke: none; }
.starchart .hex { fill: none; stroke: var(--nc); stroke-width: 1.4; stroke-linejoin: round; opacity: 0.85; }
.starchart .hex2 { fill: none; stroke: var(--nc); stroke-width: 1; opacity: 0.4; }
.starchart .glyph { color: var(--nc); }
.starchart .hazring { fill: none; stroke: #ff4a5e; stroke-width: 1.4; stroke-dasharray: 2.5 3; opacity: 0.85; }
.starchart .mapnode.fogged { opacity: 0.5; }
.starchart .mapnode.fogged .hex { stroke-dasharray: 3 3; }
.starchart .fogq { fill: var(--nc); font: 700 15px monospace; text-anchor: middle; opacity: 0.8; }
.starchart .boss-label { fill: #ff8a8a; font: 700 11px monospace; text-anchor: middle; letter-spacing: 1px; filter: drop-shadow(0 0 4px rgba(255,74,94,0.6)); }
.map-lanes { display: flex; flex-wrap: wrap; justify-content: center; gap: 6px 16px; margin-top: 6px; font-size: 9px; letter-spacing: 1px; }
.lane-key { color: var(--lc); display: inline-flex; align-items: center; gap: 5px; }
.lane-key .lane-dash { width: 16px; height: 0; border-top: 2px solid var(--lc); box-shadow: 0 0 4px var(--lc); }
.starchart .glyph polyline { fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linejoin: round; stroke-linecap: round; vector-effect: non-scaling-stroke; }
.starchart .glyph .gdot { fill: currentColor; stroke: none; }
.starchart .ticks { stroke: var(--green); stroke-width: 1.6; fill: none; stroke-linecap: round; stroke-linejoin: round; }
.starchart .hit { fill: transparent; }

/* ---- node states ---- */
.starchart .mapnode.locked { opacity: 0.42; }
.starchart .mapnode.visited { opacity: 0.55; }
.starchart .mapnode.visited .hexfill { fill: rgba(28, 40, 34, 0.7); }
.starchart .mapnode.reachable .hex { stroke: var(--green); stroke-width: 2; opacity: 1; filter: drop-shadow(0 0 5px rgba(93, 255, 136, 0.55)); }
.starchart .mapnode.reachable .glyph { filter: drop-shadow(0 0 4px currentColor); }
.starchart .mapnode.reachable .hexfill { fill: rgba(10, 30, 18, 0.8); }
.starchart .mapnode.reachable .hit { cursor: pointer; }
.starchart .mapnode.reachable .ticks { animation: tickPulse 1.6s ease-in-out infinite; filter: drop-shadow(0 0 3px rgba(93, 255, 136, 0.7)); }
@keyframes tickPulse { 0%, 100% { opacity: 0.5; } 50% { opacity: 1; } }
.starchart .mapnode.current .hexfill { fill: rgba(93, 255, 136, 0.16); }
.starchart .mapnode.current .hex { stroke: #eaffe9; stroke-width: 2.2; opacity: 1; filter: drop-shadow(0 0 6px rgba(234, 255, 233, 0.7)); }
.starchart .mapnode.nt-boss .hex, .starchart .mapnode.nt-boss .hex2 { filter: drop-shadow(0 0 7px rgba(255, 74, 94, 0.6)); }

/* sonar-ping rings on reachable nodes */
.starchart .pulse {
  fill: none; stroke: var(--green); stroke-width: 1.4;
  transform-box: fill-box; transform-origin: center;
  animation: ringPing 2s ease-out infinite;
}
.starchart .pulse.p2 { animation-delay: 1s; }
@keyframes ringPing {
  0% { transform: scale(0.85); opacity: 0.8; }
  100% { transform: scale(1.9); opacity: 0; }
}

.map-legend {
  width: 100%; max-width: 460px; display: flex; flex-wrap: wrap; gap: 3px 10px;
  justify-content: center; padding: 2px 2px 0; flex: 0 0 auto;
}
.map-legend .leg { display: inline-flex; align-items: center; gap: 4px; font-size: 8.5px; letter-spacing: 0.5px; color: var(--text-dim); text-transform: uppercase; }
.map-legend .leg-ic { width: 15px; height: 15px; display: inline-block; }
.map-legend .leg-ic svg { width: 100%; height: 100%; overflow: visible; }
.map-legend .leg-ic polyline { fill: none; stroke: currentColor; stroke-width: 2.2; stroke-linejoin: round; stroke-linecap: round; }
.map-legend .leg-ic .gdot { fill: currentColor; }

.screen .map-wrap { align-self: stretch; }

/* ========================= CONFIRM BAR (tap → preview → confirm) ========================= */
.confirm-bar {
  position: sticky; bottom: 0; z-index: 8;
  display: none; flex-direction: column; gap: 8px; align-items: stretch;
  width: 100%; max-width: 460px; align-self: center;
  margin-top: 10px;
  padding: 11px 12px calc(env(safe-area-inset-bottom, 0px) + 11px);
  background: linear-gradient(rgba(4, 10, 12, 0.2), rgba(4, 10, 12, 0.97) 45%);
  border-top: 1px solid var(--green-dim);
  backdrop-filter: blur(2px);
  animation: cbIn 0.18s ease-out;
}
.confirm-bar.show { display: flex; }
@keyframes cbIn { from { opacity: 0; transform: translateY(10px); } }
.confirm-bar .cb-msg { font-size: 12px; color: var(--text); text-align: center; line-height: 1.5; }
.confirm-bar .cb-msg b { color: var(--green); font-weight: normal; }
.confirm-bar .cb-note { display: block; font-size: 10px; color: var(--text-dim); margin-top: 4px; letter-spacing: 0.5px; }
.confirm-bar .cb-actions { display: flex; gap: 10px; justify-content: center; }
.confirm-bar .cb-actions .btn { flex: 1; max-width: 170px; }

/* selection highlight for cards / panels under the confirm flow */
.card-grid .card.picked {
  transform: scale(1.16) translateY(-4px);
  z-index: 6; border-color: var(--green);
  box-shadow: 0 0 16px rgba(93, 255, 136, 0.45), 0 6px 20px rgba(0, 0, 0, 0.75);
}
.card-grid .card.picked.preview-up { border-color: var(--amber); box-shadow: 0 0 16px rgba(255, 176, 46, 0.5), 0 6px 20px rgba(0, 0, 0, 0.75); }
.panel-btn.sel { border-color: var(--green); box-shadow: 0 0 14px rgba(93, 255, 136, 0.4); transform: translateY(-1px); }
.panel-btn.amber.sel { border-color: var(--amber); box-shadow: 0 0 14px rgba(255, 176, 46, 0.45); }
.btn.sel { background: rgba(40, 90, 55, 0.85); box-shadow: 0 0 12px rgba(93, 255, 136, 0.4); }

/* aimed (selected) map node */
.starchart .mapnode.aim .hex { stroke: #eaffe9; stroke-width: 2.4; opacity: 1; filter: drop-shadow(0 0 8px rgba(255, 255, 255, 0.85)); }
.starchart .mapnode.aim .ticks { opacity: 1; }
.starchart .mapnode.aim .glyph { filter: drop-shadow(0 0 5px currentColor); }

/* ========================= TOAST ========================= */
#toast {
  position: absolute; left: 50%; bottom: calc(env(safe-area-inset-bottom, 0px) + 170px);
  transform: translateX(-50%);
  z-index: 150; pointer-events: none;
  font-size: 11px; letter-spacing: 1px; color: var(--text);
  background: rgba(8, 18, 14, 0.95); border: 1px solid var(--green-dim);
  padding: 8px 14px; opacity: 0; transition: opacity 0.25s;
  max-width: 86%; text-align: center;
}
#toast.show { opacity: 1; }

/* targeting hint */
#target-hint {
  position: absolute; top: 38%; left: 50%; transform: translateX(-50%);
  z-index: 26; font-size: 12px; letter-spacing: 3px; color: var(--amber);
  text-shadow: var(--glow-a); pointer-events: none;
  animation: pulse 1s ease-in-out infinite;
}
@keyframes pulse { 0%, 100% { opacity: 0.5; } 50% { opacity: 1; } }

/* ========================= POTION BELT ========================= */
#potion-belt {
  position: absolute; right: 8px;
  bottom: calc(env(safe-area-inset-bottom, 0px) + 218px);
  z-index: 26; display: none; flex-direction: column; gap: 6px;
}
.potion-chip {
  width: 40px; height: 40px; display: flex; align-items: center; justify-content: center;
  border: 1px solid rgba(93,255,136,0.4); background: rgba(5, 20, 18, 0.85);
  cursor: grab; touch-action: none; transition: border-color 0.1s, box-shadow 0.1s;
}
.potion-chip.empty {
  border-style: dashed; border-color: rgba(94,138,108,0.35); background: rgba(5,14,11,0.5);
  cursor: default;
}
.potion-chip.dragging { cursor: grabbing; z-index: 70; }
.potion-chip.will-play { border-color: var(--amber); box-shadow: var(--glow-a); }
.potion-chip .pot-icon { width: 27px; height: 27px; }
.potion-chip .pot-icon svg, .potion-chip svg.vec { width: 100%; height: 100%; }

/* hover / press tooltip */
#potion-tip {
  position: absolute; z-index: 80; display: none; width: 188px; padding: 8px 10px;
  border: 1px solid var(--green-dim); background: rgba(6, 16, 13, 0.97);
  box-shadow: 0 0 18px rgba(0,0,0,0.6); pointer-events: none;
  clip-path: polygon(0 8px, 8px 0, 100% 0, 100% calc(100% - 8px), calc(100% - 8px) 100%, 0 100%);
}
#potion-tip .pt-name { font-size: 12px; letter-spacing: 1px; color: var(--text); margin-bottom: 4px; }
#potion-tip .pt-tag { font-size: 8px; letter-spacing: 1px; color: var(--text-dim); }
#potion-tip .pt-desc { font-size: 11px; line-height: 1.4; color: var(--text); }

.victory-banner { color: var(--amber); text-shadow: 0 0 18px rgba(255,176,46,0.7); }

/* ========================= THE RECURRENCE (NG+) ========================= */
.recurrence-screen { justify-content: center; }
.recurrence-loop {
  font-size: 13px; letter-spacing: 6px; color: #b8ecff;
  text-shadow: 0 0 14px rgba(184,236,255,0.6); margin-bottom: 22px;
}
.recurrence-text {
  max-width: 340px; min-height: 96px; font-size: 15px; line-height: 1.6;
  color: #d6f4ff; text-align: center; margin-bottom: 26px;
}
.echo-ic { color: #b8ecff !important; }
.echo-flavor { font-style: italic; opacity: 0.7; }
.echo-list { display: flex; flex-direction: column; gap: 10px; width: 100%; }
.panel-btn.echo-card.equipped {
  border-color: #b8ecff; box-shadow: 0 0 16px rgba(184,236,255,0.35);
  background: rgba(40, 70, 86, 0.5);
}
.echo-on {
  font-size: 9px; letter-spacing: 1px; color: #b8ecff;
  border: 1px solid rgba(184,236,255,0.5); padding: 1px 5px; margin-left: 4px;
}
.echo-begin { margin-top: 14px; }

@media (max-height: 640px) {
  #hand { height: 128px; }
  .card { height: 110px; }
  #combat-controls { bottom: calc(env(safe-area-inset-bottom, 0px) + 140px); }
  #energy-pip { bottom: calc(env(safe-area-inset-bottom, 0px) + 140px); }
  #potion-belt { bottom: calc(env(safe-area-inset-bottom, 0px) + 196px); }
}

</style>

    <canvas id="battlefield"></canvas>
    <div id="hud"></div>
    <div id="hand"></div>
    <div id="combat-controls"></div>
    <div id="overlay"></div>
    <div id="floaters"></div>
    <div id="toast"></div>
  </div>
  <div id="crt"></div>

/* =========================================================================
 * VOIDSPIRE — balance.js
 * Every tunable number in the game lives here. Tweak freely.
 * ========================================================================= */
(function (ns) {
  'use strict';

  ns.BALANCE = {

    /* ---- Player ----------------------------------------------------- */
    player: {
      baseEnergy: 3,            // energy gained at the start of each turn
      drawPerTurn: 5,           // cards drawn at the start of each turn
      maxHand: 10,              // cards beyond this are not drawn
      startCredits: 30,
    },

    /* ---- Classes ---------------------------------------------------- */
    classes: {
      vanguard:  { hp: 80, might: 2, tech: 0, psi: 0 },
      technomancer: { hp: 68, might: 0, tech: 2, psi: 0 },
      voidadept: { hp: 78, might: 0, tech: 0, psi: 2 },
      warpcaller: { hp: 55, might: 0, tech: 0, psi: 0, bond: 2 },  // glass-cannon pet master
    },

    /* ---- Attribute scaling ------------------------------------------ */
    attrs: {
      mightDmgPerPoint: 1.8,    // bonus damage per MIGHT on might-scaling attacks
      techBlockPerPoint: 1,     // bonus block per TECH on tech-scaling skills
      mightBlockPerPoint: 1,    // bonus block per MIGHT on primary-scaling skills
      psiBlockPerPoint: 1,      // bonus block per PSI on primary-scaling skills
      bondBlockPerPoint: 1,     // bonus block per BOND on primary-scaling skills
      psiDmgPerPoint: 1.4,      // bonus damage per PSI on psi-scaling attacks
      bondPetPerPoint: 0.2,     // bonus to a pet's action per point of BOND (the Warpcaller's scaling)
      eventCheckBonusDiv: 1,    // event check bonus = attr / this (rounded down)
    },

    /* ---- d20 / crits ------------------------------------------------ */
    dice: {
      critThreshold: 20,        // natural roll >= (threshold - critBonus) crits
      critMult: 2.0,            // crit damage multiplier
    },

    /* ---- Status effects ---------------------------------------------- */
    status: {
      vulnMult: 1.5,            // damage taken multiplier while Vulnerable
      weakMult: 0.75,           // damage dealt multiplier while Weakened
      burnTick: 1,              // burn stacks lost per turn (damage = stacks)
    },

    /* ---- Enemy scaling per sector (s = sector, 1-based) -------------- */
    scaling: {
      hpMul:  function (s) { return 1 + 0.30 * (s - 1) + 0.034 * (s - 1) * (s - 1); },
      dmgMul: function (s) { return 1 + 0.165 * (s - 1) + 0.017 * (s - 1) * (s - 1); },
      // extra flat strength enemies gain every N sectors (late-game pressure)
      strEverySectors: 3,
      // within-sector ramp: enemies at the top of a (now 12-row) sector hit this
      // much harder than at the entry, to match the deck you've assembled.
      depthBonus: 0.18,
    },

    /* ---- Sector / encounters ---------------------------------------- */
    sector: {
      eliteChance2Enemies: 0.35, // chance an elite brings a minion (sector 3+)
    },

    /* ---- Branching map (Slay-the-Spire-style star chart) ------------- */
    map: {
      rows: 12,            // content rows per sector (the boss sits above them)
      cols: 5,             // max horizontal lanes
      paths: 7,            // random-walk paths used to weave the chart
      // a sector reads as three acts: a safe Approach, the dangerous Push, and
      // a Final Approach that ends on a guaranteed rest before the boss.
      act1End: 3,          // rows 1..act1End  = Approach (fights/events only)
      act2End: 8,          // rows act1End+1..act2End = The Push (elites/shops/forges...)
      actWeights: {
        approach: { fight: 54, event: 28, rift: 6, treasure: 6 },
        push:     { fight: 24, event: 11, random: 6, elite: 15, beacon: 8, shop: 9, market: 5, rest: 8, forge: 7, rift: 4, treasure: 4 },
        final:    { fight: 34, event: 13, random: 6, shop: 8, market: 4, rest: 11, elite: 6, forge: 7, rift: 3, treasure: 6 },
      },
      restBeforeBoss: true, // the top content row is always a rest (catch your breath)
    },

    /* ---- Rewards ------------------------------------------------------ */
    rewards: {
      creditsFight: [18, 30],   // [min, max] credits from a normal fight
      creditsElite: [40, 60],
      creditsBoss:  [70, 95],
      creditsPerSectorMul: 0.10, // +10% credits per sector beyond the first
      cardChoices: 3,            // cards offered after a fight
      rareChance: 0.08,          // chance an offered card is rare
      uncommonChance: 0.32,      // chance an offered card is uncommon (else common)
      eliteRareChance: 0.25,     // rarity boost for elite rewards
      bossHealPct: 0.28,         // heal option after beating a boss
      restHealPct: 0.30,         // heal at a rest node
    },

    /* ---- Level up: Augment Protocol draft (after each boss) ----------- */
    levelUp: {
      // how often each augment rarity shows up in the 3-card draft
      rarityWeights: { 1: 100, 2: 52, 3: 20 },
    },

    /* ---- Shop ---------------------------------------------------------- */
    shop: {
      cardCost:     { 1: 35, 2: 55, 3: 90 },  // by rarity
      artifactCost: 80,
      removeCost: 40,            // remove a card from the deck
      removeCostInc: 15,         // increase per purchase this run
      healCost: 30,
      healAmount: 18,
    },

    /* ---- Combat feel (UI timings, ms) ---------------------------------- */
    feel: {
      enemyActDelay: 520,        // stagger between enemy actions
      cardPlayDelay: 260,        // pause after playing a card
      floaterLife: 900,
      shakeMag: 7,
      swipeThreshold: 64,        // px of upward drag needed to play a card
    },

    /* ---- Score ---------------------------------------------------------- */
    score: {
      perSector: 100,
      perNode: 12,
      perKill: 4,
      perLoop: 600,   // bonus per completed Recurrence loop
    },

    /* ---- Run arc / win condition ---------------------------------------- */
    run: {
      finale: 4,   // the boss of this sector is THE UNMAKER (the win condition).
                   // Beat it to win; you may then enter the Recurrence (NG+ loop).
      loopPower: 0.12, // each Recurrence loop multiplies enemy HP & damage by
                       // (1 + loopPower*(loop-1)) on top of normal sector scaling.
      heartLoop: 6,    // NG+5 (loop 6): the secret Heart gauntlet — a single
                       // Heart node then a build-countering tribute boss.

    /* ---- Void Echoes (Recurrence / NG+ special relics) ------------------ */
    echoes: {

    },

    /* ---- Potions & consumables ------------------------------------------ */
    potions: {

      dropChance: 0.40,    // chance a normal/elite fight also drops a potion
      bossDropChance: 1.0, // a sector boss always offers a potion
      shopChance: 0.7,     // chance a shop stocks a potion
      shopCost: { 1: 35, 2: 55, 3: 85 },  // shop price by rarity
      rarityWeights: { 1: 100, 2: 46, 3: 15 },
    },
  };

      if (g.k === 'dmg' || g.k === 'block' || g.k === 'heal') g.v = Math.ceil(g.v * 1.5);
      else if (g.k === 'status' || g.k === 'draw' || g.k === 'energy') g.v = g.v + 1;
      return g;
    });
  }

    var r = E.run;

  }
  E.nodeComplete = nodeComplete;

  /* ---------------- Level up: Augment Protocol draft ------------------- */
  var CLASS_STAT = { vanguard: 'might', technomancer: 'tech', voidadept: 'psi', warpcaller: 'bond' };
  E.classStat = function () { return CLASS_STAT[E.run.cls] || 'might'; };

  // Draft 3 random augments, rarity-weighted and class-flavored, no repeats
  // of augments already owned (so variety builds over a run).
  E.augmentChoices = function () {
    var r = E.run;
    if (r.augmentOffer) return r.augmentOffer; // stable across re-renders
    var W = B.levelUp.rarityWeights || { 1: 100, 2: 52, 3: 20 };
    var pool = Object.keys(ns.AUGMENTS).filter(function (id) {
      var g = ns.AUGMENTS[id];
      if (g.cls !== 'any' && g.cls !== r.cls) return false;
      // owned single-use passives shouldn't re-offer; stat/heal/deckop can repeat
      if ((g.kind === 'hook' || g.kind === 'pact') && r.augments.indexOf(id) >= 0) return false;
      return true;
    });
    function rollOne() {
      var bag = [];
      pool.forEach(function (id) { var w = W[ns.AUGMENTS[id].rarity] || 1; for (var i = 0; i < w; i++) bag.push(id); });
      return pick(bag);
    }
    var picks = [], guard = 0;
    while (picks.length < 3 && guard++ < 300 && pool.length) {
      var id = rollOne();
      if (picks.indexOf(id) < 0) picks.push(id);
      if (picks.length >= pool.length) break;
    }
    r.augmentOffer = picks;
    E.save();
    return picks;
  };

  // Human-readable label/sub for an augment (resolves 'class' to the real stat).
  E.augmentInfo = function (id) {
    var g = ns.AUGMENTS[id];
    var stat = E.classStat().toUpperCase();
    var desc = g.desc.replace('core attribute', stat);
    var tag = g.kind === 'pact' ? 'PACT' : g.kind === 'deckop' ? 'DECK' : g.kind === 'stat' ? 'STAT' : g.kind === 'heal' ? 'REPAIR' : 'MODULE';
    return { name: g.name, desc: desc, rarity: g.rarity, tag: tag, kind: g.kind };
  };

  E.chooseAugment = function (id) {
    var r = E.run, g = ns.AUGMENTS[id];
    if (!g) return;
    function applyStat(stat, v) {
      if (stat === 'maxhp') { r.maxHp += v; heal(v); }
      else { var a = (stat === 'class') ? E.classStat() : stat; r.attrs[a] += v; }
    }
    if (g.kind === 'stat') applyStat(g.stat, g.v);
    else if (g.kind === 'heal') heal(Math.round(r.maxHp * g.healPct));
    else if (g.kind === 'hook') r.augments.push(id);
    else if (g.kind === 'pact') {
      if (g.maxhpPct) { var lose = Math.round(r.maxHp * g.maxhpPct); r.maxHp -= lose; r.hp = Math.min(r.hp, r.maxHp); }
      if (g.stat) applyStat(g.stat, g.v);
      if (g.hook || g.hooks) r.augments.push(id);
    } else if (g.kind === 'deckop') {
      r.augmentDeckop = g.deckop;
      r.augmentOffer = null;
      if (g.deckop === 'remove') r.pendingPick = 'remove';
      else if (g.deckop === 'upgrade2') r.pendingPick = 'upgrade';
      E.save();
      return; // UI resolves the deck op, then calls finishAugment()
    }
    r.augmentOffer = null;
    setupBossArtifacts();
  };

  E.finishAugment = function () {
    E.run.augmentDeckop = null;
    setupBossArtifacts();
  };

  // Requisition deck-op: offer 3 class cards to add
  E.augmentAddOptions = function () {
    var pool = ns.augmentAddPool(E.run.cls);
    shuffle(pool);
    return pool.slice(0, Math.min(3, pool.length));
  };
  E.augmentAddCard = function (cid) { E.run.deck.push(mkCard(cid, false)); };

  function setupBossArtifacts() {
    var r = E.run;
    var pool = Object.keys(ns.ARTIFACTS).filter(function (k) {
      return ns.ARTIFACTS[k].tier === 2 && r.artifacts.indexOf(k) < 0;
    });
    if (pool.length === 0) pool = Object.keys(ns.ARTIFACTS).filter(function (k) { return ns.ARTIFACTS[k].tier === 1 && r.artifacts.indexOf(k) < 0; });
    shuffle(pool);
    r.bossArtifacts = pool.slice(0, Math.min(3, pool.length));
    r.phase = 'boss-artifact';
    E.save();
  }

  E.takeBossArtifact = function (i) {
    var r = E.run;
    if (r.bossArtifacts[i]) addArtifact(r.bossArtifacts[i]);
    r.bossArtifacts = null;
    newSector();
  };

  function newSector() {
    var r = E.run;
    r.sector++;
    var factions = Object.keys(ns.FACTIONS).filter(function (f) { return f !== r.faction; });
    r.faction = pick(factions);
    r.map = generateMap(r.sector);
    r.mapRow = -1; r.mapCol = 0;
    var sh = art('sectorHeal');
    if (sh > 0) heal(Math.round(r.maxHp * sh));
    r.phase = 'sector-intro';
    E.save();
  }
  E.beginSector = function () { E.run.phase = 'map'; E.save(); };

  /* ---------------- Combat: setup --------------------------------------- */
  // Extra enemy power from the Recurrence loop and the Unmaker's Tithe echo,
  // applied on top of normal per-sector scaling.
  function worldPowerMult() {
    return (1 + B.run.loopPower * ((E.run.loop || 1) - 1)) * (1 + art('worldPower'));
  }
  E.worldPowerMult = worldPowerMult;

  /* ---- The Heart gauntlet (NG+ easter egg) ---------------------------------
   * Score the run into 4 build axes and face the tribute that hard-counters
   * the dominant one. */
  var COUNTER_BOSS = { aggro: 'tribute_silent', bulwark: 'tribute_ironclad', affliction: 'tribute_watcher', engine: 'tribute_defect' };
  function counterAxis(r) {
    r = r || E.run;
    var sc = { aggro: 0, bulwark: 0, affliction: 0, engine: 0 };
    sc.aggro += (r.attrs.might || 0) * 2;
    sc.bulwark += (r.attrs.tech || 0) * 1.5;
    sc.affliction += (r.attrs.psi || 0) * 1.5;
    sc.engine += (r.attrs.bond || 0) * 1.5;     // pet/board builds read as 'engine'
    (r.deck || []).forEach(function (card) {
      var def = ns.CARDS[card.id]; if (!def) return;
      if (def.type === 'power') sc.engine += 2;
      (def.fx || []).forEach(function (f) {
        if (f.k === 'pet') sc.engine += 2;
        if (f.k === 'block') sc.bulwark += 1.2;
        if (f.k === 'draw') sc.engine += 0.5;
        if (f.k === 'dmg' && !f.all) sc.aggro += (f.v >= 10 ? 1.5 : 0.5);
        if (f.k === 'status') {
          if (f.s === 'str' || f.s === 'strPerTurn') sc.aggro += 2;
          else if (f.s === 'burn' || f.s === 'plague' || f.s === 'entropy') sc.affliction += 2;
          else if (f.s === 'vuln' || f.s === 'weak') sc.affliction += 1;
          else if (f.s === 'plate' || f.s === 'platedArmor' || f.s === 'barricade' || f.s === 'afterImage' || f.s === 'feelNoPain' || f.s === 'thorns') sc.bulwark += 2;
          else if (f.s === 'turret' || f.s === 'echo' || f.s === 'reactor' || f.s === 'thousandCuts') sc.engine += 2;
        }
        if (f.k === 'special') {
          if (f.id === 'shieldSlam' || f.id === 'shieldSlam15' || f.id === 'doubleBlock') sc.bulwark += 2;
          else if (f.id === 'limitBreak') sc.aggro += 2;
          else if (f.id === 'catalyst' || f.id === 'catalyst3') sc.affliction += 2;
          else if (f.id === 'reap' || f.id === 'overdrive') sc.engine += 1;
        }
      });
    });
    var best = 'aggro', bv = -1;
    ['aggro', 'bulwark', 'affliction', 'engine'].forEach(function (a) { if (sc[a] > bv) { bv = sc[a]; best = a; } });
    return best;
  }
  E.counterAxis = counterAxis;
  E.counterBossId = function (r) { return COUNTER_BOSS[counterAxis(r)]; };
  E.isHeartLoop = function () { return (E.run.loop || 1) === B.run.heartLoop; };

  // The Heart gauntlet's tiny map: one Heart node, then the tribute boss.
  function heartMap() {
    var heart = { row: 0, col: 0, type: 'rest', heart: true, edges: ['boss'], parents: [], visited: false };
    var boss = { row: 1, col: 0, type: 'boss', edges: [], parents: [0], visited: false };
    return { rows: [[heart]], boss: boss, ROWS: 1, COLS: 1 };
  }
  // deeper into a sector = tougher, to keep pace with the deck you've been
  // building across its (now longer) rows.
  function depthMult() {
    var r = E.run; if (!r || r.mapRow == null) return 1;
    var prog = Math.min(1, Math.max(0, r.mapRow) / Math.max(1, B.map.rows - 1));
    return 1 + prog * (B.scaling.depthBonus || 0);
  }
  function scaledHp(base, s) { return Math.round(base * B.scaling.hpMul(s) * worldPowerMult() * depthMult()); }
  function scaledDmg(base, s) { return Math.round(base * B.scaling.dmgMul(s) * worldPowerMult() * depthMult()); }

  function mkEnemy(id) {
    var def = ns.ENEMIES[id];
    var s = E.run.sector;
    var hp = scaledHp(def.hp, s);
    var en = {
      id: id, def: def, hp: hp, maxHp: hp, block: 0,
      statuses: {}, moveIdx: 0, lastMove: -1, intent: null, alive: true,
    };
    var bonusStr = Math.floor((s - 1) / B.scaling.strEverySectors);
    if (bonusStr > 0) en.statuses.str = bonusStr;
    return en;
  }

  function startCombat(kind) {
    var r = E.run;
    var ids, isFinal = false;
    if (kind === 'boss') {
      if ((r.loop || 1) === B.run.heartLoop) { ids = [E.counterBossId(r)]; isFinal = true; }
      else if (r.sector === B.run.finale) { ids = [ns.FINAL_BOSS]; isFinal = true; }
      else ids = [ns.BOSSES[r.faction]];
    } else if (kind === 'elite' || kind === 'beacon') {
      ids = [ns.ELITES[r.faction]];
      if (r.sector >= 3 && rnd() < B.sector.eliteChance2Enemies) ids.push(ns.ELITE_MINIONS[r.faction]);
    } else {
      var packs = ns.PACKS[r.faction];
      // earlier rows in a sector lean toward easier packs; the harder packs
      // (the new-mechanic enemies, slots 4+) are held back until sector 2+ so
      // sector 1 stays a gentle on-ramp.
      var prog = Math.min(1, r.mapRow / Math.max(1, B.map.rows - 1));
      var hi = (r.sector <= 1) ? 4 : packs.length;
      var lo = Math.min(Math.floor(prog * (packs.length - 3)), hi - 1);
      ids = pick(packs.slice(Math.max(0, lo), Math.min(hi, lo + 4))).slice();
      // Sector 1 only: add a fodder minion so hallway fights bite even with
      // perfect blocking (more simultaneous telegraph than one block can cover).
      // The very first fight stays gentle as a tutorial; no bleed into sector 2+.
      if (r.sector === 1 && (r.nodesCleared || 0) >= 1) {
        var fodder = ns.ELITE_MINIONS[r.faction];
        if (ids.length < 2) ids.push(fodder);
        else if (ids.length < 3 && rnd() < 0.4) ids.push(fodder);
      }
    }
    var c = E.combat = {
      kind: kind,
      enemies: ids.map(mkEnemy),
      allies: [],          // the Warpcaller's summoned pets (targetable units)
      turn: 0,
      energy: 0,
      hand: [], drawPile: shuffle(r.deck.slice()), discard: [], exhaust: [], consumed: [],
      player: { block: 0, statuses: {} },
      pending: null,       // an in-combat choice awaiting a pick (Scry/Tutor/Discover)
      primed: [],          // armed delayed detonations (Primed)
      echoReady: false,
      playedShield: false,
      startHp: r.hp,
      cardsThisTurn: 0,
      reactiveUsed: false,
      over: false,
      isFinal: isFinal,
    };
    var ps = art('strStart');
    if (ps > 0) c.player.statuses.str = ps;
    var es = art('echoStart');
    if (es > 0) c.player.statuses.echo = es;
    var vstart = art('vulnStart');
    if (vstart > 0) c.player.statuses.vuln = vstart;
    var pa = art('platedArmorStart');
    if (pa > 0) c.player.statuses.platedArmor = pa;
    var bs = art('blockStart');
    if (bs > 0) { c.player.block = bs; } // relic Shield is passive, not "played"
    var ws = art('weakStart');
    if (ws > 0) c.enemies.forEach(function (en, i) { addStatus(en, 'weak', ws); });
    var sd = art('combatStartDamage');
    if (sd > 0) hurtPlayer(sd, { pure: true });
    r.phase = 'combat';
    c.enemies.forEach(chooseIntent);
    startPlayerTurn();
  }

  // All player Shield gains route through here so relics that react to gaining
  // Shield (and the "no Shield" quest) see every source.
  // played = the Shield came from a card the player chose to play (so passive
  // relic/plate/trigger Shield does NOT count against the "no Shield" quest).
  function gainBlock(n, played) {
    var c = E.combat, p = c.player;
    if (n <= 0) return;
    p.block += n;
    if (played) c.playedShield = true;
    emit('block', { who: 'player', amount: n, blockAfter: p.block });
    var st = art('shieldThorns');
    if (st > 0 && !c.over) {
      var pool = aliveEnemies();
      if (pool.length) { var en = pick(pool); dealToEnemy(en, c.enemies.indexOf(en), st, { noCrit: true, noWeak: true }); }
    }
    var rt = statN(p, 'retaliate');   // Riposte Protocol: gaining Shield strikes back
    if (rt > 0 && !c.over) {
      var rpool = aliveEnemies();
      if (rpool.length) { var ren = pick(rpool); dealToEnemy(ren, c.enemies.indexOf(ren), rt, { noCrit: true, noWeak: true }); }
    }
    var sw = art('shieldWeak');   // Disruptor Field: Shield gains apply Weak
    if (sw > 0 && !c.over) {
      var poolW = aliveEnemies();
      if (poolW.length) { var enW = pick(poolW); addStatus(enW, 'weak', sw); emit('status', { who: 'enemy', idx: c.enemies.indexOf(enW), s: 'weak', v: sw }); }
    }
  }

  /* ---------------- Combat: turn structure ------------------------------ */
  function maxEnergy() { return B.player.baseEnergy + art('energyEveryTurn') + (statN(E.combat.player, 'reactor')); }

  function statN(ent, s) { return ent.statuses[s] || 0; }
  function addStatus(ent, s, v) {
    ent.statuses[s] = (ent.statuses[s] || 0) + v;
    if (ent.statuses[s] <= 0) delete ent.statuses[s];
  }

  function startPlayerTurn() {
    var c = E.combat, p = c.player;
    var leftover = c.energy;
    c.turn++;
    c.cardsThisTurn = 0;
    c.momentum = 0;   // Momentum Engine resets each turn
    if (p.statuses.momentum) p.statuses.momentum = 0;   // Fusillade: Momentum is a per-turn combo
    // Cursed Inheritance: a curse is lodged in hand at the start of combat
    if (c.turn === 1 && E.hasEcho('cursed_inheritance')) c.hand.push(mkCard('recurring_curse', false));
    // block expiry (Retain / Barricade keep your Shield)
    if (!statN(p, 'retain') && !statN(p, 'barricade')) p.block = 0;
    if (p.statuses.parry) p.statuses.parry = 0;   // Parry is a per-turn stance (like block)
    // energy (with optional carry-over from Overflow Reactor)
    c.energy = maxEnergy() + (art('energyCarry') > 0 ? leftover : 0);
    if (c.turn === 1) c.energy += art('energyTurn1');
    // per-turn passives
    var plate = statN(p, 'plate') + art('plate');
    if (plate > 0) gainBlock(plate);
    var padv = statN(p, 'platedArmor');
    if (padv > 0) { gainBlock(padv); addStatus(p, 'platedArmor', -1); } // Plated Armor: shield = stacks, then decays
    var spt = statN(p, 'strPerTurn');
    if (spt > 0) addStatus(p, 'str', spt);
    var rstk = statN(p, 'restock');    // Quartermaster: rack spent shells back each turn (Bandolier reload loop)
    if (rstk > 0) for (var rk = 0; rk < rstk; rk++) reloadShell();
    if (c.primed.length) {             // Primed: tick down armed detonations; fire at zero
      c.primed = c.primed.filter(function (pr) {
        pr.turns -= 1;
        if (pr.turns <= 0) {
          c.enemies.forEach(function (e, i) { if (e.alive) dealToEnemy(e, i, pr.dmg, { noCrit: true, noWeak: true }); });
          emit('primedBlast', { dmg: pr.dmg });
          return false;
        }
        return true;
      });
    }
    var brood = statN(p, 'brood');     // Overgrowth: birth a disposable Spawnling each turn
    if (brood > 0 && c.turn > 1) summonPet('spawnling', brood);
    var bw = statN(p, 'bulwark');      // Entrench: the front pet digs in (gains block) each turn
    if (bw > 0) { var fa = frontAlly(); if (fa) fa.block += bw; }
    var ht = art('healTurn');
    if (ht > 0) heal(ht);
    var bg = art('burnGrow');
    if (bg > 0) c.enemies.forEach(function (en, i) { if (en.alive && statN(en, 'burn') > 0) { addStatus(en, 'burn', bg); emit('status', { who: 'enemy', idx: i, s: 'burn', v: bg }); } });
    var aoe = art('aoeTurnStart');

    var draws = baseDraw + art('drawTurn') + (c.turn === 1 ? art('drawStart') : 0);

      if (c.drawPile.length === 0) {
        if (c.discard.length === 0) return;
        c.drawPile = shuffle(c.discard);
        c.discard = [];

      c.hand.push(c.drawPile.pop());
    }

  function chooseIntent(en) {

  /* Scaled intent values for display */

    var m = en.intent, s = E.run.sector;

    if (m.t === 'attack') {

    if (m.t === 'heal') return { icon: 'heal', label: '' + scaledDmg(m.v, s) };
    if (m.t === 'summon') return { icon: 'summon', label: m.n ? '×' + m.n : '' };
    if (m.t === 'debuff') return { icon: 'debuff', label: '' };
    if (m.t === 'curse') return { icon: 'curse', label: '' };

  };

  /* ---------------- Combat: playing cards ------------------------------- */
  E.cardInfo = function (card) {
    var def = ns.CARDS[card.id];

      name: def.name + (card.up ? '+' : ''),
      cost: effCost(def, card.up),
      xcost: !!def.xcost,

  // Effective energy cost: X-cost cards read as 0; under Corruption, Skills cost

  function effCost(def, up) {
    if (def.xcost) return 0;
    var c = ns.cardCost(def, up);
    if (E.combat && def.type === 'skill' && statN(E.combat.player, 'corruption') > 0) return 0;
    if (E.combat && E.combat.cardsThisTurn === 0) {

    }

  }
  E.effCost = effCost;

  function liveCtx() {
    return {
      attrs: { might: attr('might'), tech: attr('tech'), psi: attr('psi'), bond: attr('bond') },
      pri: priAttr(),            // primary attribute name (for 'pri'-scaled cards)
      statuses: E.combat ? E.combat.player.statuses : null,
      flatDmg: art('flatDmg'),   // so cards show damage incl. relic/augment buffs
    };
  }

  // primary attribute of the active class — lets shared/defensive cards scale

  var PRI_ATTR = { vanguard: 'might', technomancer: 'tech', voidadept: 'psi', warpcaller: 'bond' };
  function priAttr() { return PRI_ATTR[E.run && E.run.cls] || 'might'; }
  function resolveScale(s) { return s === 'pri' ? priAttr() : s; }

  function attackBonus(f) {
    var p = E.combat.player;
    var mul = f.scaleMul || 1;
    var sc = resolveScale(f.scale);
    var v = statN(p, 'str') + statN(p, 'momentum') + art('flatDmg') + (E.combat.momentum || 0); // Strength + Momentum (Fusillade)
    if (sc === 'might') v += attr('might') * B.attrs.mightDmgPerPoint * mul;
    if (sc === 'tech') v += attr('tech') * mul;
    if (sc === 'psi') v += attr('psi') * B.attrs.psiDmgPerPoint * mul + statN(p, 'psiPow');
    if (sc === 'bond') v += attr('bond') * B.attrs.bondPetPerPoint * mul;
    return Math.round(v);   // damage is always a whole number (no decimals)
  }

  function dealToEnemy(en, idx, amount, opts) {
    opts = opts || {};
    var c = E.combat;
    var dm = art('dmgMult');
    if (dm > 0) amount = Math.round(amount * (1 + dm));

    en.block -= blocked;
    var hpDmg = amount - blocked;

    emit('dmg', { who: 'enemy', idx: idx, amount: amount, hpDmg: hpDmg, crit: !!opts.crit, roll: opts.roll, hpAfter: Math.max(0, en.hp), blockAfter: en.block });

  function aliveEnemies() { return E.combat.enemies.filter(function (e) { return e.alive; }); }

  function petsAct() {

  function handHasCurse() {
    var c = E.combat;

  }

  function checkWin() {
    var c = E.combat;

  E.canPlay = function (handIdx) {

    return !info.unplayable && info.cost <= c.energy;
  };

  // Push a card to the exhaust pile, triggering Exhaust-synergy powers.
  function exhaustCard(card) {
    var c = E.combat, p = c.player;
    c.exhaust.push(card);
    var fnp = statN(p, 'feelNoPain');
    if (fnp > 0) gainBlock(fnp);
    var de = statN(p, 'darkEmbrace');

    if (sv > 0 && !c.over) { var spool = aliveEnemies(); if (spool.length) { var sen = pick(spool); dealToEnemy(sen, c.enemies.indexOf(sen), sv, { noCrit: true, noWeak: true }); } }
  }

  // BANDOLIER: rack a spent shell (a random exhausted Attack) back into the chamber.
  function reloadShell() {
    var c = E.combat;
    if (!c || c.hand.length >= B.player.maxHand) return false;
    var spent = c.exhaust.filter(function (cc) { return ns.CARDS[cc.id].type === 'attack'; });
    if (!spent.length) return false;
    var shell = spent[Math.floor(rnd() * spent.length)];
    c.exhaust.splice(c.exhaust.indexOf(shell), 1);
    c.hand.push(shell);
    return true;
  }

  // Burn applied to an enemy by the player (for the Burn quest).
  function trackBurn(n) { questProgress('burnTotal', n); }

  /* ---- Colorless tech: in-combat choices (Scry / Tutor / Discover) ----------
   * These set c.pending and wait for a UI pick. Headless (E.interactive false,
   * the sim/tests) auto-resolves immediately with a sensible heuristic. */
  function startScry(n, drawAfter) {
    var c = E.combat, avail = Math.min(n, c.drawPile.length);
    if (avail === 0) { if (drawAfter) drawCards(drawAfter); return; }
    // drawPile.pop() draws from the END, so the "top" is the last `avail` cards.
    c.pending = { kind: 'scry', cards: c.drawPile.slice(c.drawPile.length - avail).reverse(), draw: drawAfter || 0 };
    emit('choice', { kind: 'scry' });
    if (!E.interactive) E.resolveScry(c.pending.cards.filter(function (cd) {
      var def = ns.CARDS[cd.id]; return def.type === 'curse' || def.unplayable;   // bot: ditch junk
    }).map(function (cd) { return cd.uid; }));
  }
  E.resolveScry = function (discardUids) {
    var c = E.combat; if (!c.pending || c.pending.kind !== 'scry') return;
    (discardUids || []).forEach(function (uid) {
      var card = c.pending.cards.filter(function (cd) { return cd.uid === uid; })[0];

  function startTutor() {
    var c = E.combat;
    var legal = c.drawPile.filter(function (cd) { return ns.CARDS[cd.id].type !== 'curse'; });
    if (!legal.length) return;
    c.pending = { kind: 'tutor', cards: c.drawPile.slice().reverse() };
    emit('choice', { kind: 'tutor' });
    if (!E.interactive) {   // bot: grab the highest-rarity non-curse card
      var best = legal[0];
      legal.forEach(function (cd) { if (ns.CARDS[cd.id].rarity > ns.CARDS[best.id].rarity) best = cd; });
      E.resolveTutor(best.uid);
    }
  }
  E.resolveTutor = function (uid) {
    var c = E.combat; if (!c.pending || c.pending.kind !== 'tutor') return;
    var ix = -1; for (var i = 0; i < c.drawPile.length; i++) if (c.drawPile[i].uid === uid) ix = i;
    if (ix >= 0 && c.hand.length < B.player.maxHand) c.hand.push(c.drawPile.splice(ix, 1)[0]);

  function discoverOptions(n) {
    var keys = Object.keys(ns.CARDS).filter(function (k) {

    emit('choice', { kind: 'discover' });

  // Resolve a card's effects once. Echo can call this twice. ctx carries the

        case 'draw': drawCards(f.v); break;
        case 'energy': c.energy += f.v; break;
        case 'pet': summonPet(f.id, f.n || 1); break;   // Warpcaller: summon a pet
        case 'status': {

            });

            var burnt = c.hand.splice(0, c.hand.length);
            burnt.forEach(function (hc) { exhaustCard(hc); });
            var per = f.v + statN(p, 'str') + art('flatDmg');

  E.playCard = function (handIdx, targetIdx) {
    var c = E.combat, r = E.run, p = c.player;
    if (!E.canPlay(handIdx)) return false;
    var card = c.hand[handIdx];
    var def = ns.CARDS[card.id];
    var fx = ns.cardFx(def, card.up, card.vtouch);
    var cost = effCost(def, card.up);

    // resolve target (default: first living enemy)

    if (!tgt || !tgt.alive) {
