    if (def.type === 'attack') {

    }

    var totalDealt = 0;
    for (var rep = 0; rep < times; rep++) {
      if (c.over) break;
      totalDealt += applyCardFx(fx, ctx);
    }
    // VENGEANCE: a connecting Attack, after you took a hit or parried, heals you.
    if (def.type === 'attack' && totalDealt > 0 && c.avengeArmed && statN(p, 'vengeance') > 0) {
      heal(statN(p, 'vengeance'));
      c.avengeArmed = false;
    }
    // Void-Touched drawback: pay HP each time the corrupted card is played

    if (!c.over) {
      var tc = statN(p, 'thousandCuts');
      if (tc > 0) c.enemies.forEach(function (e, i) { if (e.alive) dealToEnemy(e, i, tc, { noCrit: true, noWeak: true }); });
      var ai = statN(p, 'afterImage');
      if (ai > 0) gainBlock(ai);

      }

        var stV = (tgt && tgt.alive) ? tgt : aliveEnemies()[0];

  /* ---------------- Combat: enemy turn ----------------------------------- */

            }
          }
        }

          emit('heal', { who: 'enemy', idx: idx, amount: dmg, hpAfter: en.hp });
        }

        if (m.all) c.enemies.forEach(function (e, i) { if (e.alive) { e.block += bb; emit('block', { who: 'enemy', idx: i, amount: e.block, blockAfter: e.block }); } });
        else { en.block += bb; emit('block', { who: 'enemy', idx: idx, amount: en.block, blockAfter: en.block }); }
      } else if (m.t === 'buff') {
        if (m.all) c.enemies.forEach(function (e, i) { if (e.alive) { addStatus(e, m.s, m.v); emit('status', { who: 'enemy', idx: i, s: m.s, v: m.v }); } });
        else { addStatus(en, m.s, m.v); emit('status', { who: 'enemy', idx: idx, s: m.s, v: m.v }); }
      } else if (m.t === 'heal') {
        var hv = scaledDmg(m.v, s);
        if (m.all) c.enemies.forEach(function (e, i) { if (e.alive) { e.hp = Math.min(e.maxHp, e.hp + hv); emit('heal', { who: 'enemy', idx: i, amount: hv, hpAfter: e.hp }); } });
        else { en.hp = Math.min(en.maxHp, en.hp + hv); emit('heal', { who: 'enemy', idx: idx, amount: hv, hpAfter: en.hp }); }

      if (statN(en, 'weak')) addStatus(en, 'weak', -1);

    if (checkWin()) return;

    c.enemies.forEach(function (en) { if (en.alive) chooseIntent(en); });
    startPlayerTurn();
  };

  /* ---------------- Combat: victory & rewards ---------------------------- */
  function creditRange(kind) {
    var r = (kind === 'boss') ? B.rewards.creditsBoss : (kind === 'elite') ? B.rewards.creditsElite : B.rewards.creditsFight;
    var v = ri(r[0], r[1]);
    v = Math.round(v * (1 + (E.run.sector - 1) * B.rewards.creditsPerSectorMul));
    v = Math.round(v * (1 + art('creditsMul')));
    return v;
  }

  // Normal reward/shop pool: rarity 1-3, class-legal, and NOT a special pool
  // (event-only / boss-only cards never roll here).
  function rollRewardCard(rareBoost) {
    var roll = rnd();
    var rar = 1;
    if (roll < B.rewards.rareChance + (rareBoost || 0)) rar = 3;
    else if (roll < B.rewards.rareChance + (rareBoost || 0) + B.rewards.uncommonChance) rar = 2;
    var pool = Object.keys(ns.CARDS).filter(function (k) {
      var c = ns.CARDS[k];
      return c.rarity === rar && !c.pool && (c.cls === E.run.cls || c.cls === 'any');
    });
    if (pool.length === 0) pool = Object.keys(ns.CARDS).filter(function (k) {
      var c = ns.CARDS[k];
      return c.rarity === 1 && !c.pool && (c.cls === E.run.cls || c.cls === 'any');
    });
    return pick(pool);
  }
  E.rollRewardCard = rollRewardCard;

  // Legendary (rarity 4, boss pool) for boss/elite rewards.
  function rollLegendary() {
    var pool = Object.keys(ns.CARDS).filter(function (k) {
      var c = ns.CARDS[k];
      return c.rarity === 4 && c.pool === 'boss' && (c.cls === E.run.cls || c.cls === 'any');
    });
    return pool.length ? pick(pool) : null;
  }
  E.rollLegendary = rollLegendary;

  function randomArtifact(tier) {

      return ns.ARTIFACTS[k].tier === tier && E.run.artifacts.indexOf(k) < 0;
    });

  // Flip a relic on/off — only allowed between fights, on the star chart.

    if (r.relicUses && r.relicUses[id] != null && r.relicUses[id] <= 0) return false; // spent: can't re-enable
    r.relicOff = r.relicOff || {};

  E.relicUsesLeft = function (id) { return E.run && E.run.relicUses ? E.run.relicUses[id] : undefined; };
  // After a fight, active relics with durability burn a charge.
  function tickRelicDurability() {
    var r = E.run; if (!r || !r.relicUses) return;
    r.artifacts.forEach(function (id) {
      if (r.relicUses[id] != null && r.relicUses[id] > 0 && E.relicActive(id)) {

  function addArtifact(id) {
    var r = E.run;

    r.artifacts.push(id);
    var a = ns.ARTIFACTS[id];

    if (a.k === 'maxHp') { r.maxHp += a.v; r.hp += a.v; }
    if (a.special === 'glassCannon') { var lose = Math.round(r.maxHp * 0.25); r.maxHp -= lose; r.hp = Math.min(r.hp, r.maxHp); }
    if (a.quest && !r.questDone[id]) r.quests[id] = r.quests[id] || 0;
    emit('artifact', { id: id });
  }
  E.addArtifact = addArtifact;

  function winCombat() {
    var r = E.run, kind = E.combat.kind, cc = E.combat;
    tickRelicDurability();   // active durability relics burn a charge per fight
    // quest credit: combats won without ever gaining Shield / without losing HP
    if (!cc.playedShield) questProgress('noShieldWin', 1);
    if (r.hp >= cc.startHp) questProgress('flawlessWin', 1);

    // The finale: beating THE UNMAKER wins the run.
    if (cc.isFinal) {
      r.won = true;
      E.recordBest();
      r.phase = 'victory';
      emit('win', { kind: 'final', credits: 0 });
      E.save();
      return;
    }

    var credits = creditRange(kind);
    r.credits += credits;
    questProgress('creditsAtOnce', r.credits);
    var hb = art('healAfterCombat');
    if (hb > 0) heal(hb);
    var eliteTier = (kind === 'elite' || kind === 'boss' || kind === 'beacon');
    var rareBoost = eliteTier ? B.rewards.eliteRareChance : 0;
    var cards = [], seen = {};
    // Salvage Doctrine forgoes card rewards (the deck grows from kills instead)
    if (!E.hasEcho('salvage_doctrine')) {
      for (var i = 0; i < B.rewards.cardChoices; i++) {
        var cid = rollRewardCard(rareBoost), guard = 0;
        while (seen[cid] && guard++ < 20) cid = rollRewardCard(rareBoost);
        seen[cid] = true;
        cards.push(cid);
      }
      // bosses always offer a legendary; elites sometimes do
      if (cards.length && (kind === 'boss' || (kind === 'elite' && rnd() < 0.4))) {
        var leg = rollLegendary();
        if (leg) cards[0] = leg;
      }
      // Distress Beacon: its risk pays in salvage-tech (a guaranteed colorless card)
      if (kind === 'beacon' && cards.length) { var col = rollColorlessCard(); if (col) cards[cards.length - 1] = col; }
    }
    var artifactDrop = (kind === 'elite' || kind === 'beacon') ? randomArtifact(1) : null;
    if (artifactDrop) addArtifact(artifactDrop);
    // The Unmaker's Tithe: an extra relic from every elite & boss
    var bonusArtifact = null;
    if (E.hasEcho('unmaker_tithe') && (kind === 'elite' || kind === 'boss')) {
      bonusArtifact = randomArtifact(1);
      if (bonusArtifact) addArtifact(bonusArtifact);
    }
    var dropP = (kind === 'boss') ? B.potions.bossDropChance : B.potions.dropChance;
    var potionDrop = (rnd() < dropP) ? rollPotion() : null;
    r.reward = { credits: credits, cards: cards, artifact: artifactDrop, bonusArtifact: bonusArtifact, potion: potionDrop, potionTaken: false, cardTaken: false, kind: kind };
    r.phase = 'reward';
    emit('win', { kind: kind, credits: credits });
    E.save();
  }

  E.takeRewardCard = function (i) {
    var r = E.run;
    if (!r.reward || r.reward.cardTaken) return;
    var id = r.reward.cards[i];
    if (!id) return;
    r.deck.push(mkCard(id, false));
    r.reward.cardTaken = true;
  };

  E.finishReward = function () {
    var r = E.run;
    if (r.reward && !r.reward.cardTaken) questProgress('rewardSkip', 1);
    r.reward = null;
    E.combat = null;
    nodeComplete();
  };

  /* ---------------- Potions & consumables -------------------------------- */
  function rollPotion() {
    var W = B.potions.rarityWeights, bag = [];
    Object.keys(ns.POTIONS).forEach(function (id) {
      var w = W[ns.POTIONS[id].rarity] || 1;
      for (var i = 0; i < w; i++) bag.push(id);
    });
    return pick(bag);
  }
  E.rollPotion = rollPotion;

  E.potionSlots = function () { return B.potions.slots; };
  E.potionFull = function () { return (E.run.potions || []).length >= B.potions.slots; };

  E.addPotion = function (pid) {
    var r = E.run;
    if (!r.potions) r.potions = [];
    if (r.potions.length >= B.potions.slots) return false;
    r.potions.push(pid);
    E.save();
    return true;
  };

  // Grab the potion offered on a reward screen (no-op if belt is full).
  E.takeRewardPotion = function () {
    var r = E.run;
    if (!r.reward || !r.reward.potion || r.reward.potionTaken) return false;
    if (!E.addPotion(r.reward.potion)) return false;
    r.reward.potionTaken = true;
    return true;
  };

  E.discardPotion = function (slot) {
    var r = E.run;
    if (!r.potions || slot < 0 || slot >= r.potions.length) return false;
    r.potions.splice(slot, 1);
    E.save();
    return true;
  };

  // Does this potion need the player to pick a target? (only when >1 enemy left)
  E.potionNeedsTarget = function (pid) {
    var pot = ns.POTIONS[pid];
    return !!(pot && pot.target) && E.combat && aliveEnemies().length > 1;
  };

  function applyPotion(pot, targetIdx) {
    var c = E.combat, r = E.run, p = c.player;
    var tgt = c.enemies[targetIdx];
    if (!tgt || !tgt.alive) {
      targetIdx = c.enemies.findIndex(function (e) { return e.alive; });
      tgt = c.enemies[targetIdx];
    }
    pot.fx.forEach(function (f) {
      if (c.over && f.k === 'dmg') return;
      switch (f.k) {
        case 'dmg':
          if (f.all) c.enemies.forEach(function (e, i) { if (e.alive) dealToEnemy(e, i, f.v, { noCrit: true }); });
          else if (tgt && tgt.alive) dealToEnemy(tgt, targetIdx, f.v, { noCrit: true });
          break;
        case 'block': gainBlock(f.v); break;          // passive Shield (not a played card)
        case 'energy': c.energy += f.v; break;
        case 'draw': drawCards(f.v); break;
        case 'heal': heal(f.v); break;
        case 'healPct': heal(Math.round(r.maxHp * f.v)); break;
        case 'status':
          if (f.who === 'self') {
            addStatus(p, f.s, f.v);
            emit('status', { who: 'player', s: f.s, v: f.v });
          } else if (f.who === 'allEnemies') {
            var hit = 0;
            c.enemies.forEach(function (e, i) {
              if (e.alive) { addStatus(e, f.s, f.v); emit('status', { who: 'enemy', idx: i, s: f.s, v: f.v }); hit++; }
            });
            if (f.s === 'burn') trackBurn(f.v * hit);
          } else {
            var st = (tgt && tgt.alive) ? tgt : aliveEnemies()[0];
            if (st) {
              addStatus(st, f.s, f.v);
              emit('status', { who: 'enemy', idx: c.enemies.indexOf(st), s: f.s, v: f.v });
              if (f.s === 'burn') trackBurn(f.v);
            }
          }
          break;
      }
    });
  }

  E.usePotion = function (slot, targetIdx) {
    var c = E.combat, r = E.run;
    if (!c || c.over) return false;
    if (!r.potions || slot < 0 || slot >= r.potions.length) return false;
    var pid = r.potions[slot];
    var pot = ns.POTIONS[pid];
    if (!pot) return false;
    r.potions.splice(slot, 1);
    applyPotion(pot, targetIdx);
    emit('potion', { id: pid });
    checkWin();
    return true;
  };

  /* ---------------- Victory & the Recurrence (NG+ loop) ------------------ */
  // Enter the next loop: bump the loop counter, then run the narrative ->
  // echo-draft -> loadout flow before a fresh (reset) descent begins.
  E.enterRecurrence = function () {
    var r = E.run;
    E.combat = null;
    r.loop = (r.loop || 1) + 1;
    r.echoOffer = null;
    r.phase = 'recurrence-intro';
    E.save();
  };

  // From the narrative screen: offer a new Echo (or straight to loadout if
  // every Echo is already collected).
  E.recurrenceContinue = function () {
    var off = E.echoOffer();
    if (off.length) E.run.phase = 'echo-draft';
    else { prepLoadout(); E.run.phase = 'echo-loadout'; }
    E.save();
  };

  // 3 not-yet-owned Echoes to choose from (stable across re-renders).
  E.echoOffer = function () {
    var r = E.run;
    if (r.echoOffer) return r.echoOffer;
    var pool = Object.keys(ns.ECHOES).filter(function (id) { return r.echoes.indexOf(id) < 0; });
    shuffle(pool);
    r.echoOffer = pool.slice(0, Math.min(3, pool.length));
    return r.echoOffer;
  };

  E.chooseEcho = function (id) {
    var r = E.run;
    if (ns.ECHOES[id] && r.echoes.indexOf(id) < 0) r.echoes.push(id);
    r.echoOffer = null;
    prepLoadout();
    r.phase = 'echo-loadout';
    E.save();
  };

  // Default the loadout: keep the previous valid picks, else auto-fill.
  function prepLoadout() {
    var r = E.run, slots = B.echoes.loadoutSlots, owned = r.echoes.slice();
    if (owned.length <= slots) r.loadout = owned.slice();
    else {
      var keep = (r.loadout || []).filter(function (id) { return owned.indexOf(id) >= 0; });
      while (keep.length < slots) { var nx = owned.find(function (id) { return keep.indexOf(id) < 0; }); if (!nx) break; keep.push(nx); }
      r.loadout = keep.slice(0, slots);
    }
  }
  E.prepLoadout = prepLoadout;
  E.echoLoadout = function () { return (E.run.loadout || []).slice(); };
  E.echoLoadoutFull = function () { return (E.run.loadout || []).length >= B.echoes.loadoutSlots; };

  // Toggle an owned Echo in/out of the equipped loadout (respecting the cap).
  E.echoToggle = function (id) {
    var r = E.run, L = r.loadout || (r.loadout = []);
    var i = L.indexOf(id);
    if (i >= 0) { L.splice(i, 1); E.save(); return true; }
    if (r.echoes.indexOf(id) < 0 || L.length >= B.echoes.loadoutSlots) return false;
    L.push(id); E.save(); return true;
  };

  // Commit the loadout and start the fresh (reset) loop.
  E.beginLoop = function () { resetForLoop(E.run); E.save(); };

  // Full reset for a new loop: keep class, loop count, Echoes, loadout, and the
  // cumulative kills/nodes/records ("powers have faded; surroundings stronger").
  function resetForLoop(r) {
    var clsId = r.cls, c = B.classes[clsId];
    // The Heart gauntlet (NG+5) is the climax — you bring your BUILT deck,
    // relics, attributes and potions into it (full-healed), not a fresh start.
    var heart = (r.loop === B.run.heartLoop);
    if (heart) {
      r.hp = r.maxHp;
    } else {
      r.hp = c.hp; r.maxHp = c.hp;
      r.attrs = { might: c.might, tech: c.tech, psi: c.psi, bond: c.bond || 0 };
      if (E.hasEcho('ascendant_core')) r.attrs[CLASS_STAT[clsId]] += 2; // legacy stat
      r.credits = B.player.startCredits;
      r.deck = ns.STARTER_DECKS[clsId].map(function (id) { return mkCard(id, false); });
      r.artifacts = [];
      r.potions = [];
    }
    r.sector = 1;
    r.faction = pick(Object.keys(ns.FACTIONS));
    r.map = generateMap(1);
    r.mapRow = -1; r.mapCol = 0;
    r.usedEvents = [];
    r.removeCost = B.shop.removeCost;
    r.quests = {}; r.questDone = {};
    r.augmentDeckop = null; r.augmentOffer = null;
    if (!heart) { r.augments = []; r.potions = []; }   // keep your augments/belt for the climax
    r.phylacteryUsed = false; r.salvageKills = 0;
    r.reward = null; r.shop = null; r.bossArtifacts = null; r.treasure = null;
    r.pendingPick = null; r.pendingAddCard = null; r.echoOffer = null;
    r.phase = 'sector-intro';
    E.combat = null;
  }

  // End the run a victor: record it and clear the save.
  E.claimVictory = function () {
    E.recordBest();
    E.clearSave();
    E.run = null;
    E.combat = null;
  };

  /* ---------------- Events ------------------------------------------------ */
  function startEvent() {
    var r = E.run;
    var pool = ns.EVENTS.filter(function (ev) { return r.usedEvents.indexOf(ev.id) < 0; });
    if (pool.length === 0) { r.usedEvents = []; pool = ns.EVENTS.slice(); }
    var ev = pick(pool);
    r.usedEvents.push(ev.id);
    r.currentEvent = ev.id;
    r.eventResult = null;
    r.phase = 'event';
  }

  E.getEvent = function () {
    var r = E.run;
    for (var i = 0; i < ns.EVENTS.length; i++) if (ns.EVENTS[i].id === r.currentEvent) return ns.EVENTS[i];
    return null;
  };

  // Is a choice available? `cond` gates "blue option" style choices.
  E.eventChoiceAvailable = function (ch) {
    var r = E.run, c = ch.cond;
    if (!c) return true;
    if (c.credits && r.credits < c.credits) return false;
    if (c.attr) { for (var k in c.attr) if (attr(k) < c.attr[k]) return false; }
    if (c.hasArtifact && r.artifacts.indexOf(c.hasArtifact) < 0) return false;
    if (c.hasCurse && !r.deck.some(function (cd) { return ns.CARDS[cd.id].type === 'curse'; })) return false;
    return true;
  };

  // Odds + modifier for a skill check (for the choice preview).
  E.checkOdds = function (check) {
    var bonus = Math.floor(attr(check.attr) / B.attrs.eventCheckBonusDiv) + art('checkBonus');
    var passCount = 0;
    for (var roll = 1; roll <= 20; roll++) {
      var pass = (roll + bonus >= check.dc) || roll === 20;
      if (roll === 1) pass = false;
      if (pass) passCount++;
    }
    return { bonus: bonus, pct: Math.round(passCount / 20 * 100) };
  };

  E.eventChoose = function (ci) {
    var r = E.run;
    var ev = E.getEvent();
    var ch = ev.choices[ci];
    if (!ch) return null;
    if (!E.eventChoiceAvailable(ch)) return null;
    if (ch.cost && r.credits < ch.cost) return null;
    if (ch.cost) r.credits = Math.max(0, r.credits - ch.cost); // pay the price up front

    var res = { roll: null, pass: null, dc: null, bonus: 0 };
    var out;
    if (ch.check) {
      var roll = d20();
      var bonus = Math.floor(attr(ch.check.attr) / B.attrs.eventCheckBonusDiv) + art('checkBonus');
      var pass = (roll + bonus >= ch.check.dc) || roll === 20;
      if (roll === 1) pass = false;
      res.roll = roll; res.bonus = bonus; res.dc = ch.check.dc; res.pass = pass;
      res.attr = ch.check.attr;
      out = pass ? ch.success : ch.fail;
    } else if (ch.gamble) {
      var bag = [];
      ch.gamble.forEach(function (g, i) { for (var w = 0; w < (g.w || 1); w++) bag.push(i); });
      out = ch.gamble[bag[Math.floor(rnd() * bag.length)]];
      res.gamble = true;
    } else {
      out = ch.outcome;
    }
    res.text = out.text;
    res.gained = applyOutcome(out.fx || {});
    r.eventResult = res;
    if (r.phase !== 'dead') r.phase = 'event-result';
    E.save();
    return res;
  };

  function applyOutcome(fx) {
    var r = E.run, gained = [];
    if (fx.credits) {
      r.credits = Math.max(0, r.credits + fx.credits);
      if (fx.credits > 0) questProgress('creditsAtOnce', r.credits);
      gained.push((fx.credits > 0 ? '+' : '') + fx.credits + ' credits');
    }
    if (fx.maxhp) {
      r.maxHp += fx.maxhp; r.hp += fx.maxhp;
      gained.push('+' + fx.maxhp + ' Max HP');
    }
    if (fx.healPct) {
      var h = Math.round(r.maxHp * fx.healPct);
      heal(h);
      gained.push('+' + h + ' HP');
    }
    if (fx.hp) {
      if (fx.hp < 0) {
        r.hp += fx.hp;
        gained.push(fx.hp + ' HP');
        if (r.hp <= 0) { playerDied(); return gained; }
      } else { heal(fx.hp); gained.push('+' + fx.hp + ' HP'); }
    }
    if (fx.attr) {
      var a = fx.attr === 'random' ? pick(['might', 'tech', 'psi']) : fx.attr;
      r.attrs[a] += 1;
      gained.push('+1 ' + a.toUpperCase());
    }
    if (fx.card) {
      var cid;
      if (fx.card === 'random') cid = rollRewardCard(0);
      else if (fx.card === 'colorless') cid = rollColorlessCard() || rollRewardCard(0);
      else if (fx.card === 'rare') {
        var rares = Object.keys(ns.CARDS).filter(function (k) {
          var c = ns.CARDS[k];
          return c.rarity === 3 && !c.pool && (c.cls === r.cls || c.cls === 'any');
        });
        cid = rares.length ? pick(rares) : rollRewardCard(0);
      } else cid = fx.card;
      r.deck.push(mkCard(cid, false));
      gained.push('Card: ' + ns.CARDS[cid].name);
    }
    if (fx.artifact) {
      var aid = randomArtifact(1);
      // offer it as a take/skip choice instead of auto-granting
      if (aid) { r.pendingRelic = aid; gained.push('Relic found: ' + ns.ARTIFACTS[aid].name); }
      else { r.credits += 40; gained.push('+40 credits'); }
    }
    if (fx.curse) {
      r.deck.push(mkCard(fx.curse, false));
      gained.push('CURSE: ' + ns.CARDS[fx.curse].name);
    }
    if (fx.removeCurse) {
      var want = fx.removeCurse === true ? 99 : fx.removeCurse, removed = 0;
      for (var ci2 = r.deck.length - 1; ci2 >= 0 && removed < want; ci2--) {
        if (ns.CARDS[r.deck[ci2].id].type === 'curse') { r.deck.splice(ci2, 1); removed++; }
      }
      gained.push(removed ? 'Purged ' + removed + ' curse' + (removed > 1 ? 's' : '') : 'No curses to purge');
    }
    if (fx.addCardChoice) {
      r.pendingAddCard = E.augmentAddOptions();
      gained.push('Choose a card to add');
    }
    if (fx.pick) {
      r.pendingPick = fx.pick;
      gained.push(fx.pick === 'remove' ? 'Choose a card to remove' : fx.pick === 'upgrade' ? 'Choose a card to upgrade' :
        fx.pick === 'vtouch' ? 'Choose a card to Void-Touch' : 'Choose a card to duplicate');
    }
    return gained;
  }

  E.eventAddCard = function (cid) { E.run.deck.push(mkCard(cid, false)); E.run.pendingAddCard = null; };

  // A relic offered by an event: take it into the arsenal, or leave it behind.
  E.takeEventRelic = function () {
    var r = E.run;
    if (r.pendingRelic) { addArtifact(r.pendingRelic); r.pendingRelic = null; E.save(); }
  };
  E.skipEventRelic = function () { E.run.pendingRelic = null; E.save(); };

  E.finishEvent = function () {
    var r = E.run;
    if (r.pendingPick || r.pendingAddCard || r.pendingRelic) return; // resolve pending choices first
    r.eventResult = null;
    r.currentEvent = null;
    nodeComplete();
  };

  /* Resolve a pending deck pick (remove / upgrade / dupe). deckIdx into run.deck */
  E.applyPick = function (deckIdx) {
    var r = E.run;
    var t = r.pendingPick;
    if (!t) return false;
    var card = r.deck[deckIdx];
    if (!card) return false;
    if (t === 'remove') r.deck.splice(deckIdx, 1);
    else if (t === 'upgrade') card.up = true;
    else if (t === 'dupe') r.deck.push(mkCard(card.id, card.up));
    else if (t === 'vtouch') card.vtouch = true;
    r.pendingPick = null;
    E.save();
    return true;
  };

  E.cancelPick = function () { E.run.pendingPick = null; };

  /* ---------------- Shop --------------------------------------------------- */
  // market=true -> Black Market: salvage-tech heavy + cheap card removal.
  function buildShop(market) {
    var r = E.run;
    var cards = [], seen = {};
    var nNormal = market ? 2 : 3, nColorless = market ? 2 : 1;
    for (var i = 0; i < nNormal; i++) {
      var cid = rollRewardCard(0.06), guard = 0;
      while (seen[cid] && guard++ < 20) cid = rollRewardCard(0.06);
      seen[cid] = true;
      cards.push({ id: cid, cost: B.shop.cardCost[ns.CARDS[cid].rarity] || 35, sold: false });
    }
    for (var k = 0; k < nColorless; k++) {
      var col = rollColorlessCard();
      if (col && !seen[col]) { seen[col] = true; cards.push({ id: col, cost: (B.shop.cardCost[ns.CARDS[col].rarity] || 35) + (market ? -5 : 10), sold: false }); }
    }
    var aid = randomArtifact(1);
    var pid = (rnd() < B.potions.shopChance) ? rollPotion() : null;
    r.shop = {
      market: !!market,
      cards: cards,
      artifact: aid ? { id: aid, cost: B.shop.artifactCost - (market ? 15 : 0), sold: false } : null,
      potion: pid ? { id: pid, cost: B.potions.shopCost[ns.POTIONS[pid].rarity] || 40, sold: false } : null,
      healUsed: false,
      removeUsed: false,
      removeDiscount: market ? 15 : 0,
    };
  }

  E.shopBuyCard = function (i) {
    var r = E.run, it = r.shop.cards[i];
    if (!it || it.sold || r.credits < it.cost) return false;
    r.credits -= it.cost; it.sold = true;
    r.deck.push(mkCard(it.id, false));
    E.save();
    return true;
  };
  E.shopBuyArtifact = function () {
    var r = E.run, it = r.shop.artifact;
    if (!it || it.sold || r.credits < it.cost) return false;
    r.credits -= it.cost; it.sold = true;
    addArtifact(it.id);
    E.save();
    return true;
  };
  E.shopBuyPotion = function () {
    var r = E.run, it = r.shop.potion;
    if (!it || it.sold || r.credits < it.cost) return false;
    if (E.potionFull()) return false;
    r.credits -= it.cost; it.sold = true;
    E.addPotion(it.id);
    E.save();
    return true;
  };
  E.shopBuyHeal = function () {
    var r = E.run;
    if (r.shop.healUsed || r.credits < B.shop.healCost || r.hp >= r.maxHp) return false;
    r.credits -= B.shop.healCost;
    r.shop.healUsed = true;
    heal(B.shop.healAmount);
    E.save();
    return true;
  };
  E.shopBuyRemove = function () {
    var r = E.run;
    if (r.shop.removeUsed || r.credits < r.removeCost) return false;
    r.credits -= r.removeCost;
    r.removeCost += B.shop.removeCostInc;
    r.shop.removeUsed = true;
    r.pendingPick = 'remove';
    return true;
  };
  E.leaveShop = function () {
    E.run.shop = null;
    nodeComplete();
  };

  /* ---------------- Rest --------------------------------------------------- */
  E.restHeal = function () {
    heal(Math.round(E.run.maxHp * B.rewards.restHealPct));
    nodeComplete();
  };
  E.restUpgrade = function () {
    E.run.pendingPick = 'upgrade';
  };
  E.restFinishUpgrade = function (deckIdx) {

  };
  // Technomancer: hexagonal energy field — two counter-rotating hexes shimmer.
  R.shieldTech = function (x, y, col) {
    R.polyRing(x, y, col, 22, 46, 6, 0.5, 3, 2);
    R.polyRing(x, y, '#bff6ff', 18, 40, 6, 0.46, -4, 1.5);
    for (var i = 0; i < 8; i++) { var a = i / 8 * Math.PI * 2; particles.push({ x: x + Math.cos(a) * 44, y: y + Math.sin(a) * 44, vx: 0, vy: 0, life: 0.42, age: 0, color: col, size: 1.6 }); }
  };
  // Void Adept: warding sigil ward — spinning glyphs of containment.
  R.shieldVoid = function (x, y, col) {
    R.sigil(x, y, col, 40);
    R.polyRing(x, y, '#f0d6ff', 48, 30, 3, 0.4, 6, 1.5);
  };

  function factionColor(def) {
    if (def.color) return def.color;   // faction-less bosses (the finale) carry their own colour
    var f = ns.FACTIONS[def.faction];
    return f ? f.color : '#5dff88';
  }

  /* ---- main frame --------------------------------------------------------- */
  R.frame = function (dt) {
    if (!ctx) return;
    t += dt;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.fillStyle = '#04080a';
    ctx.fillRect(0, 0, W, H);

    var shx = 0, shy = 0;
    if (screenShake > 0.01) {
      var m = ns.BALANCE.feel.shakeMag * screenShake;
      shx = (Math.random() - 0.5) * m; shy = (Math.random() - 0.5) * m;
      screenShake *= Math.pow(0.0008, dt);
    }
    ctx.translate(shx, shy);

    drawBackground(dt);

    if (R.combatVisible) {
      drawPlayer();
      drawAllies();
      for (var i = 0; i < R.views.length; i++) drawEnemy(R.views[i], i);
    }

    drawParticles(dt);

    if (flashAlpha > 0.01) {
      ctx.fillStyle = 'rgba(255,255,255,' + flashAlpha.toFixed(3) + ')';
      ctx.fillRect(-20, -20, W + 40, H + 40);
      flashAlpha *= Math.pow(0.001, dt);
    }

    if (R.combatVisible) drawPowerGauge();   // augmentation meter sits on top
  };

  /* ---- background scenes -------------------------------------------------- */
  // One scene per faction territory (plus a neutral menu scene). Static
  // elements are generated once per faction so nothing flickers.
  var scene = null, sceneKey = null;

  var THEME = {
    menu:      { rgb: '93,255,136',  grid: 'rgba(93, 255, 136, 0.10)' },
    hierarchy: { rgb: '200,107,255', grid: 'rgba(200, 107, 255, 0.09)' },
    rust:      { rgb: '255,150,40',  grid: 'rgba(255, 150, 40, 0.09)' },
    voidspawn: { rgb: '93,255,136',  grid: 'rgba(93, 255, 136, 0.10)' },
  };

  function ensureScene() {
    var k = (ns.engine.run && ns.engine.run.faction) ? ns.engine.run.faction : 'menu';
    if (k === sceneKey && scene) return;
    sceneKey = k;
    scene = buildScene(k);
  }

  function buildScene(k) {
    var s = { kind: k, theme: THEME[k] || THEME.menu, nebula: [], ships: [], towers: [], lights: [], spores: [], tendrils: [] };
    var i;
    for (i = 0; i < 4; i++) {
      s.nebula.push({ x: Math.random(), y: Math.random() * 0.45, r: 0.22 + Math.random() * 0.3, a: 0.05 + Math.random() * 0.06 });
    }
    if (k === 'hierarchy' || k === 'menu') {
      for (i = 0; i < 3; i++) {
        s.ships.push({ x: Math.random(), y: 0.08 + Math.random() * 0.22, v: 0.002 + Math.random() * 0.004, s: 0.5 + Math.random() * 0.8, dir: Math.random() < 0.5 ? -1 : 1 });
      }
    }
    if (k === 'rust') {
      var x = 0;
      while (x < 1.05) {
        var w = 0.04 + Math.random() * 0.08;
        var h = 0.03 + Math.random() * 0.10;
        var chimney = Math.random() < 0.45;
        s.towers.push({ x: x, w: w, h: h, c: chimney });
        if (Math.random() < 0.6) s.lights.push({ x: x + w * Math.random(), y: h * (0.3 + Math.random() * 0.6), ph: Math.random() * 6, sp: 1 + Math.random() * 2 });
        x += w + 0.01 + Math.random() * 0.04;
      }
    }
    if (k === 'voidspawn') {
      for (i = 0; i < 14; i++) {
        s.spores.push({ x: Math.random(), y: Math.random(), v: 0.004 + Math.random() * 0.008, ph: Math.random() * 6, r: 1 + Math.random() * 2 });
      }
      for (i = 0; i < 4; i++) {
        s.tendrils.push({ x: 0.06 + Math.random() * 0.88, len: 0.10 + Math.random() * 0.14, ph: Math.random() * 6, seg: 4 + Math.floor(Math.random() * 3) });
      }
      s.rift = { x: 0.62 + Math.random() * 0.2, pts: [] };
      var rx = 0;
      for (i = 0; i <= 6; i++) s.rift.pts.push([(Math.random() - 0.5) * 0.10, 0.06 + i * 0.045]);
    }
    return s;
  }

  function drawBackground(dt) {
    ensureScene();
    var th = scene.theme;

    // nebula blobs
    scene.nebula.forEach(function (n) {
      var nx = n.x * W, ny = n.y * H, nr = n.r * Math.min(W, H) * 1.3;
      var g = ctx.createRadialGradient(nx, ny, 0, nx, ny, nr);
      g.addColorStop(0, 'rgba(' + th.rgb + ',' + n.a.toFixed(3) + ')');
      g.addColorStop(1, 'rgba(' + th.rgb + ',0)');
      ctx.fillStyle = g;
      ctx.fillRect(nx - nr, ny - nr, nr * 2, nr * 2);
    });

    if (scene.kind === 'hierarchy' || scene.kind === 'menu') drawHierarchySky(dt);
    if (scene.kind === 'rust') drawRustSky();
    if (scene.kind === 'voidspawn') drawVoidSky();

    // stars
    for (var i = 0; i < stars.length; i++) {
      var s = stars[i];
      s.y += dt * 0.006 * s.z;
      if (s.y > 1) { s.y -= 1; s.x = Math.random(); }
      var a = 0.25 + 0.5 * s.z * (0.6 + 0.4 * Math.sin(t * 2 + s.tw));
      ctx.fillStyle = 'rgba(150, 210, 190, ' + a.toFixed(3) + ')';
      var sz = s.z > 0.75 ? 1.6 : 1;
      ctx.fillRect(s.x * W, s.y * H, sz, sz);
    }

    if (scene.kind === 'rust') drawRustSkyline();

    // perspective grid floor under the battlefield
    var gy = baseY() + Math.min(W, H) * 0.13;
    ctx.strokeStyle = th.grid;
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.moveTo(0, gy); ctx.lineTo(W, gy);
    for (var g2 = 1; g2 <= 4; g2++) {
      var yy = gy + g2 * g2 * 9;
      if (yy > H) break;
      ctx.moveTo(0, yy); ctx.lineTo(W, yy);
    }
    var cx = W * 0.5;
    for (var vx = -6; vx <= 6; vx++) {
      ctx.moveTo(cx + vx * W * 0.09, gy);
      ctx.lineTo(cx + vx * W * 0.30, Math.min(H, gy + 160));
    }
    ctx.stroke();
  }

  /* Hierarchy / menu: ringed gas giant, a vast orbital ring, drifting warships */
  function drawHierarchySky(dt) {
    var th = scene.theme;
    var px = W * 0.80, py = H * 0.15, pr = W * 0.26;
    // planet disc
    var g = ctx.createRadialGradient(px - pr * 0.3, py - pr * 0.3, pr * 0.1, px, py, pr);
    g.addColorStop(0, 'rgba(' + th.rgb + ',0.16)');
    g.addColorStop(1, 'rgba(' + th.rgb + ',0.02)');
    ctx.fillStyle = g;
    ctx.beginPath(); ctx.arc(px, py, pr, 0, 7); ctx.fill();
    ctx.strokeStyle = 'rgba(' + th.rgb + ',0.35)';
    ctx.lineWidth = 1;
    ctx.beginPath(); ctx.arc(px, py, pr, 0, 7); ctx.stroke();
    // cloud bands
    ctx.strokeStyle = 'rgba(' + th.rgb + ',0.18)';
    ctx.beginPath();
    ctx.arc(px, py, pr * 0.72, 2.5, 3.9);
    ctx.moveTo(px + pr * 0.5, py + pr * 0.35);
    ctx.arc(px, py, pr * 0.6, 0.5, 1.3);
    ctx.stroke();
    // planet ring
    ctx.strokeStyle = 'rgba(' + th.rgb + ',0.30)';
    ctx.beginPath(); ctx.ellipse(px, py, pr * 1.5, pr * 0.34, -0.28, 3.0, 6.55); ctx.stroke();
    // the great orbital ring spanning the sky (our Halo)
    ctx.strokeStyle = 'rgba(' + th.rgb + ',0.22)';
    ctx.lineWidth = 1.2;
    ctx.beginPath(); ctx.arc(W / 2, H * 2.7, H * 2.52, -Math.PI / 2 - 0.4, -Math.PI / 2 + 0.4); ctx.stroke();
    ctx.beginPath(); ctx.arc(W / 2, H * 2.7, H * 2.52 + 7, -Math.PI / 2 - 0.4, -Math.PI / 2 + 0.4); ctx.stroke();
    // ring struts
    ctx.strokeStyle = 'rgba(' + th.rgb + ',0.14)';
    for (var k = -3; k <= 3; k++) {
      var a = -Math.PI / 2 + k * 0.11;
      var x1 = W / 2 + Math.cos(a) * H * 2.52, y1 = H * 2.7 + Math.sin(a) * H * 2.52;
      var x2 = W / 2 + Math.cos(a) * (H * 2.52 + 7), y2 = H * 2.7 + Math.sin(a) * (H * 2.52 + 7);
      ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); ctx.stroke();
    }
    // drifting warships (angular silhouettes)
    ctx.strokeStyle = 'rgba(' + th.rgb + ',0.40)';
    ctx.lineWidth = 1;
    scene.ships.forEach(function (sh) {
      sh.x += sh.v * sh.dir * dt;
      if (sh.x > 1.15) sh.x = -0.15;
      if (sh.x < -0.15) sh.x = 1.15;
      var sx = sh.x * W, sy = sh.y * H, sc = 14 * sh.s, d = sh.dir;
      ctx.beginPath();
      ctx.moveTo(sx - sc * d, sy);
      ctx.lineTo(sx + sc * 0.4 * d, sy - sc * 0.28);
      ctx.lineTo(sx + sc * d, sy - sc * 0.05);
      ctx.lineTo(sx + sc * 0.5 * d, sy + sc * 0.22);
      ctx.closePath();
      ctx.stroke();
    });
  }

  /* Rust: dim red sun with occlusion slats, smog bands, industrial skyline */
  function drawRustSky() {
    var sx = W * 0.24, sy = H * 0.17, sr = W * 0.13;
    var g = ctx.createRadialGradient(sx, sy, 0, sx, sy, sr * 2.4);
    g.addColorStop(0, 'rgba(255, 90, 40, 0.30)');
    g.addColorStop(0.45, 'rgba(255, 120, 40, 0.10)');
    g.addColorStop(1, 'rgba(255, 120, 40, 0)');
    ctx.fillStyle = g;
    ctx.fillRect(sx - sr * 2.4, sy - sr * 2.4, sr * 4.8, sr * 4.8);
    ctx.fillStyle = 'rgba(255, 96, 40, 0.32)';
    ctx.beginPath(); ctx.arc(sx, sy, sr, 0, 7); ctx.fill();
    // retro occlusion slats
    ctx.fillStyle = '#04080a';
    for (var i = 0; i < 4; i++) {
      var yy = sy + sr * (0.1 + i * 0.24);
      ctx.fillRect(sx - sr - 4, yy, sr * 2 + 8, 2 + i * 1.5);
    }
    // smog bands
    ctx.fillStyle = 'rgba(255, 140, 60, 0.045)';
    ctx.fillRect(0, H * 0.25, W, H * 0.035);
    ctx.fillRect(0, H * 0.33, W, H * 0.02);
  }

  function drawRustSkyline() {
    var gy = baseY() + Math.min(W, H) * 0.13;
    ctx.fillStyle = 'rgba(4, 8, 10, 0.9)';
    ctx.strokeStyle = 'rgba(255, 150, 40, 0.30)';
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.moveTo(0, gy);
    scene.towers.forEach(function (tw) {
      var x0 = tw.x * W, x1 = (tw.x + tw.w) * W, hh = tw.h * H;
      ctx.lineTo(x0, gy);
      ctx.lineTo(x0, gy - hh);
      if (tw.c) {
        var cx0 = x0 + (x1 - x0) * 0.3, cx1 = x0 + (x1 - x0) * 0.55;
        ctx.lineTo(cx0, gy - hh); ctx.lineTo(cx0, gy - hh - 10);
        ctx.lineTo(cx1, gy - hh - 10); ctx.lineTo(cx1, gy - hh);
      }
      ctx.lineTo(x1, gy - hh);
      ctx.lineTo(x1, gy);
    });
    ctx.lineTo(W, gy);
    ctx.fill();
    ctx.stroke();
    // blinking hazard lights
    scene.lights.forEach(function (l) {
      var a = 0.25 + 0.5 * (0.5 + 0.5 * Math.sin(t * l.sp + l.ph));
      ctx.fillStyle = 'rgba(255, 150, 40, ' + a.toFixed(3) + ')';
      ctx.fillRect(l.x * W - 1, gy - l.y * H - 1, 2, 2);
    });
  }

  /* Voidspawn: a torn rift in space, hanging tendrils, drifting spores */
  function drawVoidSky() {
    var gy = baseY();
    // the rift
    var rx = scene.rift.x * W;
    var pulse = 0.5 + 0.35 * Math.sin(t * 1.3);
    ctx.save();
    ctx.strokeStyle = 'rgba(93, 255, 136, ' + (0.30 + 0.25 * pulse).toFixed(3) + ')';
    ctx.shadowColor = '#5dff88';
    ctx.shadowBlur = 12 * pulse + 4;
    ctx.lineWidth = 1.6;
    ctx.beginPath();
    scene.rift.pts.forEach(function (p, i) {
      var x = rx + p[0] * W, y = p[1] * H;
      if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
    });
    ctx.stroke();
    ctx.lineWidth = 0.8;
    ctx.strokeStyle = 'rgba(230, 255, 240, ' + (0.25 + 0.3 * pulse).toFixed(3) + ')';
    ctx.stroke();
    ctx.restore();

    // hanging tendrils, swaying
    ctx.strokeStyle = 'rgba(93, 255, 136, 0.22)';
    ctx.lineWidth = 1.2;
    scene.tendrils.forEach(function (td) {
      var x = td.x * W;
      ctx.beginPath();
      ctx.moveTo(x, 0);
      for (var i = 1; i <= td.seg; i++) {
        var p = i / td.seg;
        ctx.lineTo(x + Math.sin(t * 0.8 + td.ph + p * 3) * 8 * p, td.len * H * p);
      }
      ctx.stroke();
    });

    // drifting spores
    scene.spores.forEach(function (sp) {
      sp.y -= sp.v * 0.016;
      if (sp.y < -0.02) { sp.y = 1.02; sp.x = Math.random(); }
      var a = 0.10 + 0.14 * (0.5 + 0.5 * Math.sin(t * 1.5 + sp.ph));
      ctx.fillStyle = 'rgba(93, 255, 136, ' + a.toFixed(3) + ')';
      ctx.beginPath();
      ctx.arc(sp.x * W + Math.sin(t + sp.ph) * 6, sp.y * Math.min(gy + 60, H), sp.r, 0, 7);
      ctx.fill();
    });
  }

  /* ---- entity drawing -------------------------------------------------------- */
  function strokePaths(paths, x, y, scale, color, glow, alpha) {
    ctx.save();
    ctx.translate(x, y);
    ctx.scale(scale, scale);
    ctx.globalAlpha = alpha;
    ctx.strokeStyle = color;
    ctx.lineWidth = 1.6 / scale;
    ctx.lineJoin = 'round';
    ctx.shadowColor = color;
    ctx.shadowBlur = glow;
    paths.forEach(function (p) {
      ctx.beginPath();
      ctx.moveTo(p[0], p[1]);
      for (var i = 2; i < p.length; i += 2) ctx.lineTo(p[i], p[i + 1]);
      ctx.stroke();
    });
    ctx.restore();
  }

  // ---- readable status / shield rendering (Slay-the-Spire-ish) ----
  var STATUS_COLORS = {
    vuln: '#ff8a3a', weak: '#c86bff', burn: '#ff5a2a', str: '#5dff88',
    regen: '#56ff9c', plate: '#41d8ff', platedArmor: '#41d8ff', thorns: '#9bb0a6',
  };
  var STATUS_ABBR = { vuln: 'VULN', weak: 'WEAK', burn: 'BURN', str: 'STR' };

  function roundRect(x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath();
  }

  function drawBlockBadge(cx, cy, val) {
    var r = 11;
    ctx.save();
    ctx.beginPath();
    ctx.moveTo(cx - r, cy - r * 0.85);
    ctx.lineTo(cx + r, cy - r * 0.85);
    ctx.lineTo(cx + r, cy + r * 0.15);
    ctx.quadraticCurveTo(cx + r, cy + r * 0.9, cx, cy + r * 1.15);
    ctx.quadraticCurveTo(cx - r, cy + r * 0.9, cx - r, cy + r * 0.15);
    ctx.closePath();
    ctx.fillStyle = 'rgba(5, 22, 30, 0.96)';
    ctx.fill();
    ctx.lineWidth = 1.5; ctx.strokeStyle = '#41d8ff';
    ctx.shadowColor = '#41d8ff'; ctx.shadowBlur = 6; ctx.stroke();
    ctx.shadowBlur = 0;
    ctx.fillStyle = '#cdeeff';
    ctx.font = 'bold 11px ui-monospace, monospace';
    ctx.textAlign = 'center';
    ctx.fillText('' + val, cx, cy + 4);
    ctx.restore();
  }

  function drawEnemyStatuses(v, by) {
    var st = v.en.statuses;
    var keys = Object.keys(st).filter(function (k) { return st[k] > 0; });
    if (!keys.length) return;
    ctx.save();
    ctx.font = 'bold 9px ui-monospace, monospace';
    var gap = 4, pills = keys.map(function (k) {
      var abbr = STATUS_ABBR[k] || (ns.STATUS_NAMES[k] || k).slice(0, 4).toUpperCase();
      var txt = abbr + ' ' + st[k];
      return { txt: txt, w: ctx.measureText(txt).width + 11, color: STATUS_COLORS[k] || '#9bb0a6' };
    });
    var total = pills.reduce(function (a, p) { return a + p.w + gap; }, -gap);
    var x = v.x - total / 2, y = by + 22, h = 14;
    pills.forEach(function (p) {
      roundRect(x, y, p.w, h, 3);
      ctx.fillStyle = 'rgba(6, 14, 12, 0.94)'; ctx.fill();
      ctx.lineWidth = 1; ctx.strokeStyle = p.color; ctx.stroke();
      ctx.fillStyle = p.color; ctx.textAlign = 'center';
      ctx.fillText(p.txt, x + p.w / 2, y + 10);
      x += p.w + gap;
    });
    ctx.restore();
  }

  function drawEnemy(v, idx) {
    var dying = !v.alive;
    var dieDur = 0.45;
    if (dying && (v.deathT < 0 || t - v.deathT > dieDur)) return;

    var grounded = !!v.def.grounded;
    // grounded enemies stand still (a faint sway); floating ones bob
    var bob = grounded ? Math.sin(t * 1.2 + idx) * 0.8 : Math.sin(t * 1.8 + idx * 1.7) * 3;
    var sx = 0;
    if (t - v.shakeT < 0.22) sx = (Math.random() - 0.5) * 8;
    // lunge toward the player when attacking
    var lu = (t - v.lungeT) / 0.3;
    if (lu >= 0 && lu < 1) sx -= Math.sin(lu * Math.PI) * v.r * 0.35;

    var alpha = 1, scale = v.r;
    if (dying) {
      var dp = (t - v.deathT) / dieDur;
      alpha = 1 - dp;
      scale = v.r * (1 - dp * 0.5);
    }
    // warp-in on combat start
    var su = (t - v.spawnT) / 0.5;
    if (su >= 0 && su < 1) {
      var eo = 1 - Math.pow(1 - su, 3);
      scale *= eo + Math.sin(su * Math.PI) * 0.08;
      alpha *= Math.min(1, su * 2);
      if (!v.spawned && su > 0.12) {
        v.spawned = true;
        burst(v.x, v.y, factionColor(v.def), 14);
      }
    }

    var color = factionColor(v.def);
    var flash = (t - v.flashT < 0.13);
    var x = v.x + sx, y = v.y + bob;

    strokePaths(v.def.art.p, x, y, scale, flash ? '#ffffff' : color, flash ? 16 : 9, alpha);

    // eyes
    if (!dying || alpha > 0.4) {
      ctx.save();
      ctx.globalAlpha = alpha;
      ctx.fillStyle = flash ? '#ffffff' : '#ffe9f0';
      ctx.shadowColor = color;
      ctx.shadowBlur = 7;
      (v.def.art.e || []).forEach(function (e) {
        var px = x + e[0] * scale, py = y + e[1] * scale;
        var es = Math.max(1.5, scale * 0.05);
        ctx.fillRect(px - es / 2, py - es / 2, es, es);
      });
      ctx.restore();
    }

    if (dying) return;

    // hp bar
    v.dispHp += (v.hp - v.dispHp) * 0.18;
    if (Math.abs(v.dispHp - v.hp) < 0.4) v.dispHp = v.hp;
    var bw = Math.max(46, Math.min(96, v.r * 2.1));
    var bx = v.x - bw / 2, by = v.y + v.r + 14;
    ctx.fillStyle = 'rgba(6, 14, 10, 0.85)';
    ctx.fillRect(bx, by, bw, 6);
    ctx.fillStyle = color;
    ctx.globalAlpha = 0.9;
    ctx.fillRect(bx + 1, by + 1, (bw - 2) * Math.max(0, v.dispHp / v.maxHp), 4);
    ctx.globalAlpha = 1;
    ctx.strokeStyle = 'rgba(184, 230, 196, 0.35)';
    ctx.lineWidth = 1;
    ctx.strokeRect(bx + 0.5, by + 0.5, bw - 1, 5);
    ctx.fillStyle = 'rgba(184, 230, 196, 0.9)';
    ctx.font = '9px ui-monospace, monospace';
    ctx.textAlign = 'center';
    ctx.fillText(Math.max(0, Math.round(v.dispHp)) + '/' + v.maxHp, v.x, by + 16);

    // block (shield) — clear cyan badge at the HP bar's left edge
    if (v.block > 0) drawBlockBadge(bx - 13, by + 2, v.block);

    // statuses — colour-coded pills under the HP bar
    drawEnemyStatuses(v, by);

    // intent
    drawIntent(v);

    // target reticle
    if (R.targeting) {
      var rr = v.r + 12 + Math.sin(t * 6) * 3;
      ctx.strokeStyle = '#ffb02e';
      ctx.lineWidth = 1.5;
      ctx.shadowColor = '#ffb02e';
      ctx.shadowBlur = 8;
      cornerBox(v.x, v.y, rr);
      ctx.shadowBlur = 0;
    }
  }

  function cornerBox(x, y, r) {
    var c = r * 0.4;
    ctx.beginPath();
    ctx.moveTo(x - r, y - r + c); ctx.lineTo(x - r, y - r); ctx.lineTo(x - r + c, y - r);
    ctx.moveTo(x + r - c, y - r); ctx.lineTo(x + r, y - r); ctx.lineTo(x + r, y - r + c);
    ctx.moveTo(x + r, y + r - c); ctx.lineTo(x + r, y + r); ctx.lineTo(x + r - c, y + r);
    ctx.moveTo(x - r + c, y + r); ctx.lineTo(x - r, y + r); ctx.lineTo(x - r, y + r - c);
    ctx.stroke();
  }

  function drawHex(x, y, r) {
    ctx.beginPath();
    for (var i = 0; i < 6; i++) {

  // small auto-turret drone (Technomancer identity)
  function drawTurret(x, y, r, col) {
    ctx.save();
    ctx.strokeStyle = col; ctx.lineWidth = 1.3; ctx.lineJoin = 'round';
    ctx.shadowColor = col; ctx.shadowBlur = 5; ctx.globalAlpha = 0.85;
    ctx.beginPath();
    for (var i = 0; i < 6; i++) {
      var a = Math.PI / 6 + i * Math.PI / 3;
      var bx = x + Math.cos(a) * r, by = y + Math.sin(a) * r;
      if (i === 0) ctx.moveTo(bx, by); else ctx.lineTo(bx, by);
    }
    ctx.closePath(); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(x + r * 0.6, y); ctx.lineTo(x + r * 1.6, y); ctx.stroke(); // barrel toward enemies
    ctx.fillStyle = col; ctx.beginPath(); ctx.arc(x, y, r * 0.26, 0, 7); ctx.fill();        // eye
    ctx.restore();
  }

  // Subtle, state-driven identity flourishes per class.
  function drawPlayerFx(r, px, py, scale, col) {
    var c = ns.engine.combat;
    var st = c ? c.player.statuses : {};

    if (r.cls === 'vanguard') {
      // muzzle glow at the blaster, brief flash when firing
      var mz = (CLASS_ART.vanguard.muzzle) || [0.84, 0.12];
      var mx = px + mz[0] * scale, my = py + mz[1] * scale;
      var fl = (t - (R.player.lungeT || -9)) / 0.28;
      var firing = fl >= 0 && fl < 0.5;
      ctx.save();
      ctx.fillStyle = firing ? '#ffe9c0' : col;
      ctx.shadowColor = firing ? '#ffd27a' : col;
      ctx.shadowBlur = firing ? 14 : 5;
      ctx.globalAlpha = firing ? 0.9 : 0.28 + 0.12 * Math.sin(t * 7);
      ctx.beginPath(); ctx.arc(mx, my, scale * (firing ? 0.16 : 0.05), 0, 7); ctx.fill();
      if (firing) {
        ctx.strokeStyle = '#ffe9c0'; ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.moveTo(mx, my); ctx.lineTo(mx + scale * 0.32, my - scale * 0.05);
        ctx.moveTo(mx, my); ctx.lineTo(mx + scale * 0.3, my + scale * 0.07);
        ctx.stroke();
      }
      ctx.restore();
    } else if (r.cls === 'technomancer') {
      // deployed turret drones hover beside you when the Turret power is up
      var tv = st.turret || 0;
      if (tv > 0) {
        var n = Math.max(1, Math.min(3, Math.ceil(tv / 5)));
        for (var i = 0; i < n; i++) {
          var ox = px + (-0.5 - i * 0.16) * scale;
          var oy = py + (-0.45 + i * 0.55) * scale + Math.sin(t * 2 + i) * 2.5;
          drawTurret(ox, oy, scale * 0.26, col);
        }
      }
      // idle spark at the staff tip
      ctx.save();
      ctx.fillStyle = col; ctx.shadowColor = col; ctx.shadowBlur = 6;
      ctx.globalAlpha = 0.35 + 0.25 * Math.sin(t * 4);
      ctx.beginPath(); ctx.arc(px + 0.64 * scale, py - 1.06 * scale, scale * 0.045, 0, 7); ctx.fill();
      ctx.restore();
    } else if (r.cls === 'voidadept') {
      // psionic motes orbiting the adept; more with Psi Focus
      var motes = 3 + Math.min(4, st.psiPow || 0);
      ctx.save();
      ctx.fillStyle = col; ctx.shadowColor = col; ctx.shadowBlur = 6;
      for (var m = 0; m < motes; m++) {
        var a = t * 1.1 + m * (6.283 / motes);
        var rad = scale * (0.55 + 0.12 * Math.sin(t * 1.7 + m));
        var ex = px + Math.cos(a) * rad;
        var ey = py - 0.35 * scale + Math.sin(a) * rad * 0.66;
        ctx.globalAlpha = 0.25 + 0.25 * (0.5 + 0.5 * Math.sin(t * 3 + m));
        ctx.beginPath(); ctx.arc(ex, ey, scale * (0.028 + (m % 2) * 0.014), 0, 7); ctx.fill();
      }
      ctx.restore();
    }
  }

  function shieldPoly(cx, cy, rad, sides, rot) {
    ctx.beginPath();
    for (var s = 0; s <= sides; s++) {
      var a = rot + s / sides * Math.PI * 2, x = cx + Math.cos(a) * rad, y = cy + Math.sin(a) * rad * 0.92;
      if (s === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
    }
    ctx.stroke();
  }
  // The Shield you're holding, drawn as your archetype's ward (scales with it).
  function drawPlayerShield(r, cx, cy, scale, blk) {
    var rad = scale * 1.5, pulse = 0.5 + Math.sin(t * 3) * 0.12, i, col;
    ctx.save();
    ctx.shadowBlur = 8;
    if (r.cls === 'technomancer') {            // hexagonal energy field
      col = '#41d8ff'; ctx.strokeStyle = col; ctx.shadowColor = col; ctx.lineWidth = 2;
      ctx.globalAlpha = pulse; shieldPoly(cx, cy, rad, 6, t * 0.4);
      ctx.globalAlpha = pulse * 0.6; shieldPoly(cx, cy, rad * 0.82, 6, -t * 0.3 + 0.5);
    } else if (r.cls === 'voidadept') {        // warding ring of orbiting glyphs
      col = '#c86bff'; ctx.strokeStyle = col; ctx.shadowColor = col; ctx.lineWidth = 1.4;
      ctx.globalAlpha = pulse * 0.7; ctx.beginPath(); ctx.arc(cx, cy, rad, 0, 7); ctx.stroke();
      var runes = Math.max(3, Math.min(9, Math.ceil(blk / 4)));
      ctx.globalAlpha = pulse;
      for (i = 0; i < runes; i++) {
        var a = t * 0.6 + i * (6.283 / runes), x = cx + Math.cos(a) * rad, y = cy + Math.sin(a) * rad * 0.92;
        ctx.beginPath(); ctx.moveTo(x, y - 3); ctx.lineTo(x - 2.6, y + 2.2); ctx.lineTo(x + 2.6, y + 2.2); ctx.closePath(); ctx.stroke();
      }
    } else {                                    // vanguard: stacked plated barrier
      col = '#ffb02e'; ctx.strokeStyle = col; ctx.shadowColor = col;
      var plates = Math.max(1, Math.min(4, Math.ceil(blk / 9)));
      for (i = 0; i < plates; i++) { ctx.lineWidth = 3 - i * 0.4; ctx.globalAlpha = pulse * (1 - i * 0.18); shieldPoly(cx, cy, rad - i * 5, 4, Math.PI / 4); }
    }
    ctx.restore();
  }

  // A summoned pet's silhouette, keyed by what it does.
  function drawPetGlyph(t, x, y, sz, col) {
    ctx.save();
    ctx.strokeStyle = col; ctx.lineWidth = 1.4; ctx.shadowColor = col; ctx.shadowBlur = 5;
    ctx.beginPath();
    if (t === 'attack') {                 // fanged maw
      ctx.moveTo(x - sz, y - sz * 0.5); ctx.lineTo(x + sz, y - sz * 0.5);
      ctx.lineTo(x + sz * 0.7, y + sz * 0.6); ctx.lineTo(x, y + sz * 0.15); ctx.lineTo(x - sz * 0.7, y + sz * 0.6); ctx.closePath(); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(x - sz * 0.45, y - sz * 0.5); ctx.lineTo(x - sz * 0.28, y - sz * 0.08);
      ctx.moveTo(x, y - sz * 0.5); ctx.lineTo(x, y - sz * 0.02); ctx.moveTo(x + sz * 0.45, y - sz * 0.5); ctx.lineTo(x + sz * 0.28, y - sz * 0.08); ctx.stroke();
    } else if (t === 'burn') {             // spiky stinger
      ctx.arc(x, y, sz * 0.5, 0, 7); ctx.stroke();
      ctx.beginPath(); for (var i = 0; i < 6; i++) { var a = i / 6 * 6.283; ctx.moveTo(x + Math.cos(a) * sz * 0.5, y + Math.sin(a) * sz * 0.5); ctx.lineTo(x + Math.cos(a) * sz, y + Math.sin(a) * sz); } ctx.stroke();
    } else if (t === 'block') {            // shield-beast
      ctx.moveTo(x, y - sz); ctx.lineTo(x + sz * 0.8, y - sz * 0.4); ctx.lineTo(x + sz * 0.6, y + sz * 0.7);
      ctx.lineTo(x, y + sz); ctx.lineTo(x - sz * 0.6, y + sz * 0.7); ctx.lineTo(x - sz * 0.8, y - sz * 0.4); ctx.closePath(); ctx.stroke();
    } else {                              // heal / leech blob
      ctx.arc(x, y, sz * 0.6, 0, 7); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(x, y + sz * 0.6); ctx.lineTo(x, y + sz * 1.15); ctx.stroke();
    }
    ctx.restore();
  }

  var ACT_COL = { atk: '#ff6a6a', burn: '#ff8a3d', block: '#6bd8ff', heal: '#6bff9d', support: '#ffd24a' };
  // A pet's action readout: a small icon + the (BOND-scaled) value it will do.

    else if (info.icon === 'block') { for (var k = 0; k <= 6; k++) { var a = k / 6 * 6.283, xx = ix + Math.cos(a) * s, yy = y + Math.sin(a) * s; if (k === 0) ctx.moveTo(xx, yy); else ctx.lineTo(xx, yy); } ctx.stroke(); }

  // The Warpcaller's pack: drawn live from combat state, below the master, each

  /* ====================== COCKPIT RAIL ====================== */
  function railDebuffs() {
    var c = E.combat; if (!c) return [];
    var st = c.player.statuses, out = [];
    ['vuln', 'weak', 'burn'].forEach(function (k) { if (st[k] > 0) out.push({ name: ns.STATUS_NAMES[k] || k, val: st[k] }); });
    return out;
  }
  // universal combat stats: always shown on top as buffs, never folded into a
  // power's row (so Might from Combat Stims still reads as "Might" up top).
  var CORE_BUFF = { str: 1, regen: 1, plate: 1, platedArmor: 1, thorns: 1, barricade: 1 };
  var BUFF_PRIORITY = ['str', 'block', 'regen', 'plate', 'platedArmor', 'thorns', 'barricade'];
  // the self-status a power maintains (its "value"), if any
  function powerSelfStatus(cc) {
    var d = ns.CARDS[cc.id]; if (!d) return null;
    var fx = (cc.up && d.up && d.up.fx) ? d.up.fx : d.fx;
    if (!fx) return null;
    for (var i = 0; i < fx.length; i++) { var f = fx[i]; if (f.k === 'status' && (f.who === 'self' || f.who == null)) return f.s; }
    return null;
  }
  function railPowers() {
    var c = E.combat; if (!c) return [];
    var seen = {}, out = [];
    c.consumed.forEach(function (cc) { var d = ns.CARDS[cc.id]; if (d && d.type === 'power' && !seen[cc.id]) { seen[cc.id] = true; out.push(cc); } });
    return out;
  }
  function railBuffs() {
    var c = E.combat; if (!c) return [];
    var st = c.player.statuses;
    // non-core statuses that a played power owns -> shown on the power, not here
    var owned = {};
    railPowers().forEach(function (cc) { var s = powerSelfStatus(cc); if (s && !CORE_BUFF[s]) owned[s] = 1; });
    var out = [];
    if (c.player.block > 0) out.push({ key: 'block', name: 'Shield', val: Math.round(c.player.block) });
    Object.keys(st).forEach(function (k) {
      if (st[k] <= 0 || k === 'vuln' || k === 'weak' || k === 'burn' || owned[k]) return;
      out.push({ key: k, name: ns.STATUS_NAMES[k] || k, val: st[k] });
    });
    out.sort(function (a, b) {
      var ap = BUFF_PRIORITY.indexOf(a.key), bp = BUFF_PRIORITY.indexOf(b.key);
      if (ap < 0) ap = 99; if (bp < 0) bp = 99;
      return ap !== bp ? ap - bp : (a.name < b.name ? -1 : 1);
    });
    return out;
  }

  // The callout floats just off the rail (battlefield side) and a leader line
  // links it to the button it sprang from — vector HUD, not a free-floating box.
  function positionRailPanel(btn) {
    if (!btn || !$railPanel || !$game) return;
    var gr = $game.getBoundingClientRect(), br = btn.getBoundingClientRect();
    var gameW = $game.clientWidth, gameH = $game.clientHeight;
    var scale = gr.width / gameW || 1;   // true on-screen scale (uiScale may be stale)
    var btnCX = (br.left + br.width / 2 - gr.left) / scale;
    var btnCY = (br.top + br.height / 2 - gr.top) / scale;
    var railRight = (br.right - gr.left) / scale;
    var pw = $railPanel.offsetWidth, ph = $railPanel.offsetHeight;
    // rail lives on the left edge -> panel opens to the right of it
    var left = railRight + 16;
    if (left + pw > gameW - 8) left = Math.max(8, gameW - 8 - pw);
    var top = Math.max(8, Math.min(gameH - ph - 8, btnCY - ph / 2));
    $railPanel.style.left = left + 'px';
    $railPanel.style.right = 'auto';
    $railPanel.style.top = top + 'px';

    var midX = (railRight + panelLeft) / 2;
    var pts = (railRight) + ',' + btnCY + ' ' + midX + ',' + btnCY + ' ' + midX + ',' + anchorY + ' ' + panelLeft + ',' + anchorY;

    });
    return out;
  }

  // pointy-top hexagon frame
  function hexPts(cx, cy, r) {
    var pts = [];
    for (var i = 0; i < 6; i++) {
      var a = Math.PI / 6 + i * Math.PI / 3;
      pts.push((cx + Math.cos(a) * r).toFixed(1) + ',' + (cy + Math.sin(a) * r).toFixed(1));
    }
    return pts.join(' ');
  }

  // four corner brackets (a targeting reticle) around a node
  function cornerTicks(cx, cy, r) {
    var c = r * 0.42;
    var segs = [
      [[cx - r, cy - r + c], [cx - r, cy - r], [cx - r + c, cy - r]],
      [[cx + r - c, cy - r], [cx + r, cy - r], [cx + r, cy - r + c]],
      [[cx + r, cy + r - c], [cx + r, cy + r], [cx + r - c, cy + r]],
      [[cx - r + c, cy + r], [cx - r, cy + r], [cx - r, cy + r - c]],
    ];
    return '<g class="ticks">' + segs.map(function (seg) {
      return '<polyline points="' + seg.map(function (p) { return p[0].toFixed(1) + ',' + p[1].toFixed(1); }).join(' ') + '"/>';
    }).join('') + '</g>';
  }

  function showMap() {
    updateHUD();
    var r = E.run, m = r.map;
    var s = overlayScreen(true);
    s.classList.add('map-screen');
    s.appendChild(el('h2', 'screen-title', 'Sector ' + r.sector + ' · Star Chart'));
    var started = r.mapRow >= 0;
    s.appendChild(el('div', 'screen-sub', esc(ns.FACTIONS[r.faction].name.toUpperCase()) + ' TERRITORY · ' + (started ? 'CHOOSE THE NEXT JUMP' : 'CHOOSE YOUR ENTRY POINT')));

    var COLS = m.COLS, ROWS = m.ROWS;
    var land = isLandscape();
    var lane = 100, step = 106;        // lane = perpendicular spacing, step = progress spacing
    var W = land ? (ROWS + 1) * step : COLS * lane;
    var H = land ? COLS * lane : (ROWS + 1) * step;
    var reach = E.mapReachable(), cur = E.currentNode();
    // fog of war: you scout ~3 rows ahead; further nodes show only their lane,
    // not the encounter, and resolve as you advance.
    var revealRow = (r.mapRow < 0 ? -1 : r.mapRow) + 3;

    // portrait flows bottom->top; landscape flows left->right (boss at the far end)
    function xy(node) {
      var jx = mapJit(node.row, node.col, 0), jy = mapJit(node.row, node.col, 1);
      if (land) return { x: (node.row + 0.5) * step + jx, y: (node.col + 0.5) * lane + jy };
      return { x: (node.col + 0.5) * lane + jx, y: H - (node.row + 0.5) * step + jy };
    }
    function targetOf(node, tc) {
      if (tc === 'boss') return m.boss;
      var nr = m.rows[node.row + 1];
      for (var i = 0; i < nr.length; i++) if (nr[i].col === tc) return nr[i];
      return null;
    }

    var par = land ? 'xMinYMid meet' : 'xMidYMin meet';
    var svg = '<svg class="starchart" viewBox="0 0 ' + W + ' ' + H + '" preserveAspectRatio="' + par + '">';
    // edges (drawn as glowing flight paths with a midpoint waypoint tick)
    for (var ri = 0; ri < ROWS; ri++) {
      m.rows[ri].forEach(function (node) {
        node.edges.forEach(function (tc) {
          var t = targetOf(node, tc); if (!t) return;
          var a = xy(node), b = xy(t);
          var cls = (node === cur && reach.indexOf(t) >= 0) ? 'live' : (node.visited && t.visited) ? 'trav' : 'dim';
          var lc = LANE_COLOR[node.lane] || '#9fb6c0', op = cls === 'dim' ? 0.32 : cls === 'trav' ? 0.7 : 1;
          svg += '<line class="edge ' + cls + '" style="stroke:' + lc + ';opacity:' + op + '" x1="' + a.x.toFixed(1) + '" y1="' + a.y.toFixed(1) + '" x2="' + b.x.toFixed(1) + '" y2="' + b.y.toFixed(1) + '"/>';
          if (cls !== 'dim') {
            var mx = ((a.x + b.x) / 2).toFixed(1), my = ((a.y + b.y) / 2).toFixed(1);
            svg += '<circle class="waypt ' + cls + '" cx="' + mx + '" cy="' + my + '" r="1.8"/>';
          }
        });
      });
    }
    // nodes (glowing hex frames with reticle brackets on reachable ones)
    function nodeMarkup(node) {
      var isBoss = node.type === 'boss';
      var fogged = !isBoss && !node.visited && node.row > revealRow;
      var p = xy(node), icon = ns.MAP_ICONS[node.type] || ns.MAP_ICONS.fight;
      var nc = fogged ? (LANE_COLOR[node.lane] || '#5e8a6c') : icon.color;   // fogged: show only the lane
      var hexR = isBoss ? 29 : 20, size = isBoss ? 24 : 15;
      var reachable = reach.indexOf(node) >= 0;
      var state = node === cur ? 'current' : node.visited ? 'visited' : reachable ? 'reachable' : 'locked';
      var g = '<g class="mapnode ' + state + (fogged ? ' fogged' : '') + ' nt-' + node.type + '" data-row="' + node.row + '" data-col="' + node.col + '" style="--nc:' + nc + '">';
      if (reachable) {
        g += '<circle class="pulse" cx="' + p.x.toFixed(1) + '" cy="' + p.y.toFixed(1) + '" r="' + hexR + '"/>';
        g += '<circle class="pulse p2" cx="' + p.x.toFixed(1) + '" cy="' + p.y.toFixed(1) + '" r="' + hexR + '"/>';
      }
      g += '<polygon class="hexfill" points="' + hexPts(p.x, p.y, hexR) + '"/>';
      if (node.hazard) g += '<circle class="hazring" cx="' + p.x.toFixed(1) + '" cy="' + p.y.toFixed(1) + '" r="' + (hexR + 4) + '"/>';
      g += '<polygon class="hex" points="' + hexPts(p.x, p.y, hexR) + '"/>';
      if (isBoss) g += '<polygon class="hex2" points="' + hexPts(p.x, p.y, hexR + 5) + '"/>';
      if (fogged) g += '<text class="fogq" x="' + p.x.toFixed(1) + '" y="' + (p.y + size * 0.42).toFixed(1) + '">?</text>';
      else g += '<g class="glyph">' + mapIconPaths(icon, p.x, p.y, size) + '</g>';
      if (reachable) g += cornerTicks(p.x, p.y, hexR + 5);
      g += '<circle class="hit" cx="' + p.x.toFixed(1) + '" cy="' + p.y.toFixed(1) + '" r="' + (hexR + 10) + '"/>';
      return g + '</g>';
    }
    m.rows.forEach(function (row) { row.forEach(function (n) { svg += nodeMarkup(n); }); });
    svg += nodeMarkup(m.boss);
    // boss telegraph: name the sector boss looming at the end of the chart
    var bxy = xy(m.boss);
    svg += '<text class="boss-label" x="' + bxy.x.toFixed(1) + '" y="' + (bxy.y + (land ? 50 : 46)).toFixed(1) + '">' + esc(E.sectorBossName()) + '</text>';
    svg += '</svg>';

    var wrap = el('div', 'map-wrap' + (land ? ' land' : ''));
    wrap.innerHTML = svg;
    s.appendChild(wrap);

    var legend = el('div', 'map-legend');
    ['fight', 'elite', 'beacon', 'event', 'rift', 'shop', 'market', 'forge', 'rest', 'treasure', 'boss'].forEach(function (t) {
      var ic = ns.MAP_ICONS[t];
      legend.innerHTML += '<span class="leg"><span class="leg-ic" style="color:' + ic.color + '">' +
        '<svg viewBox="0 0 48 48">' + mapIconPaths(ic, 24, 24, 17) + '</svg></span>' + esc(NODE_LABEL[t]) + '</span>';
    });
    s.appendChild(legend);

    // lane key — which highway is which this sector
    var lanebar = el('div', 'map-lanes');
    (m.lanes || []).forEach(function (ln) {
      lanebar.innerHTML += '<span class="lane-key" style="--lc:' + LANE_COLOR[ln] + '"><span class="lane-dash"></span>' + esc(LANE_LABEL[ln]) + '</span>';
    });
    s.appendChild(lanebar);

    wrap.addEventListener('pointerdown', function (ev) {
      var g = ev.target.closest ? ev.target.closest('.mapnode') : null;
      if (!g || !g.classList.contains('reachable')) return;
      var row = +g.getAttribute('data-row'), col = +g.getAttribute('data-col');
      var node = (row >= m.ROWS) ? m.boss : null;
      if (!node) { m.rows[row].forEach(function (n) { if (n.col === col) node = n; }); }
      if (node && E.enterNode(node)) { SFX.play(); U.refresh(); }
    });

    // portrait scrolls vertically to keep the active frontier in view; the
    // landscape chart is sized to fit, so it needs no scrolling
    if (!land) setTimeout(function () {
      var svgEl = wrap.querySelector('svg');
      if (!svgEl) return;
      var rect = svgEl.getBoundingClientRect();
      var scale = rect.height / H;
      var focusY = cur ? xy(cur).y * scale : H * scale;
      wrap.scrollTop = Math.max(0, focusY - wrap.clientHeight * 0.62);
    }, 0);
  }

  /* ====================== TREASURE ====================== */
  function showTreasure() {
    updateHUD();
    var r = E.run;
    var s = overlayScreen(true);
    s.appendChild(el('h2', 'screen-title', 'Supply Cache'));
    s.appendChild(el('div', 'screen-sub', 'A SEALED CACHE, LONG FORGOTTEN'));
    if (r.treasure) {
      var a = ns.ARTIFACTS[r.treasure];
      var fr = el('div', 'comm-frame');
      fr.innerHTML = artSVG(a.art, 'portrait', '#ffb02e');
      s.appendChild(fr);
      s.appendChild(el('div', 'gain-list', '<div>◆ ' + esc(a.name) + ' — ' + esc(a.desc) + '</div>'));
    } else {
      s.appendChild(el('div', 'gain-list', '<div>Relic vault already full — salvaged for +40 credits.</div>'));
    }
    var btn = el('button', 'btn', 'TAKE IT');
    btn.addEventListener('pointerdown', function () { SFX.coin(); E.finishTreasure(); U.refresh(); });
    s.appendChild(btn);
  }

  /* ====================== COMBAT ====================== */
  function showCombat() {
    hideOverlay();
    combatChrome(true);
    R.syncCombat();
    updateHUD();
    renderHand(true);
    renderControls();
    updateEnergy();
    updateCounts();
    updatePotions();
  }

  /* ---- potion belt ----------------------------------------------------- */
  // Shared vial glyph, tinted per potion.
  function potionSVG(pid, cls) {
    var pot = ns.POTIONS[pid];
    return artSVG(ns.POTION_ICON, cls, pot.color);
  }

  function updatePotions() {
    var r = E.run;
    $potions.innerHTML = '';
    if (!E.combat) return;
    var slots = E.potionSlots();
    for (var i = 0; i < slots; i++) {
      var pid = (r.potions || [])[i];
      if (pid) {
        var chip = el('div', 'potion-chip', potionSVG(pid, 'pot-icon'));
        chip.setAttribute('data-slot', i);
        (function (slot, id, chipEl) {
          chipEl.addEventListener('pointerdown', function (ev) { ev.stopPropagation(); startPotionDrag(chipEl, slot, ev); });
          // desktop hover tooltip (touch shows it on press, in startPotionDrag)
          chipEl.addEventListener('mouseenter', function () { if (!potionDrag) showPotionTip(id, chipEl); });
          chipEl.addEventListener('mouseleave', function () { if (!potionDrag) hidePotionTip(); });
        })(i, pid, chip);
        $potions.appendChild(chip);
      } else {
        $potions.appendChild(el('div', 'potion-chip empty', ''));
      }
    }
  }

  /* ---- potion tooltip ---- */
  function showPotionTip(pid, chipEl) {
    var pot = ns.POTIONS[pid];
    var rarTag = pot.rarity === 3 ? 'RARE' : pot.rarity === 2 ? 'UNCOMMON' : 'COMMON';
    $potionTip.innerHTML =
      '<div class="pt-name">' + esc(pot.name) + ' <span class="pt-tag">' + rarTag + '</span></div>' +
      '<div class="pt-desc">' + esc(pot.desc) + '</div>';
    $potionTip.style.display = 'block';
    var gr = $game.getBoundingClientRect(), cr = chipEl.getBoundingClientRect();
    // sit to the LEFT of the belt (which hugs the right edge)
    $potionTip.style.left = 'auto';
    $potionTip.style.right = Math.round(gr.right - cr.left + 10) + 'px';
    var tipH = $potionTip.getBoundingClientRect().height || 56;
    $potionTip.style.top = Math.max(6, Math.round(cr.top - gr.top - (tipH - cr.height) / 2)) + 'px';
  }
  function hidePotionTip() { $potionTip.style.display = 'none'; }

  /* ---- potion drag-to-use ----
     Press a potion to see its tooltip; drag it onto an enemy (or anywhere on
     the field) to use it, or drag it back to the belt to cancel. */
  var potionDrag = null;

  function startPotionDrag(chipEl, slot, ev) {
    if (locked || drag || potionDrag || !E.combat || E.combat.over) return;
    var pid = (E.run.potions || [])[slot];
    if (!pid) return;
    potionDrag = { el: chipEl, slot: slot, pid: pid, x0: ev.clientX, y0: ev.clientY, dx: 0, dy: 0, moved: false };
    showPotionTip(pid, chipEl);
    if (chipEl.setPointerCapture && ev.pointerId !== undefined) {
      try { chipEl.setPointerCapture(ev.pointerId); } catch (e) { /* not supported */ }
    }
  }

  function overPotionArea(ev) {
    var rct = $potions.getBoundingClientRect(), pad = 28;
    return ev.clientX >= rct.left - pad && ev.clientX <= rct.right + pad &&
           ev.clientY >= rct.top - pad && ev.clientY <= rct.bottom + pad;
  }

  function onPotionMove(ev) {
    potionDrag.dx = ev.clientX - potionDrag.x0;
    potionDrag.dy = ev.clientY - potionDrag.y0;
    if (!potionDrag.moved && Math.abs(potionDrag.dx) + Math.abs(potionDrag.dy) > 9) {
      potionDrag.moved = true;
      potionDrag.el.classList.add('dragging');
    }
    if (potionDrag.moved) {
      potionDrag.el.style.transform = 'translate(' + (potionDrag.dx / uiScale) + 'px,' + (potionDrag.dy / uiScale) + 'px) scale(1.12)';
      var armed = !overPotionArea(ev);            // armed everywhere except back over the belt
      potionDrag.el.classList.toggle('will-play', armed);
      R.targeting = armed && E.aliveEnemies().length > 0;  // show reticles as drop hints
    }
  }

  function onPotionEnd(ev) {
    var pd = potionDrag;
    potionDrag = null;
    pd.el.classList.remove('dragging', 'will-play');
    pd.el.style.transform = '';
    R.targeting = false;
    hidePotionTip();
    if (!pd.moved) return;                          // a tap just previews; you must drag to use
    if (locked || !E.combat || E.combat.over) return;
    if (overPotionArea(ev)) return;                 // dragged back to the belt -> cancel
    usePotionAt(pd.slot, enemyAtClient(ev));        // enemy under pointer, or -1 (defaults to first)
  }

  function onPotionCancel() {
    if (!potionDrag) return;
    potionDrag.el.classList.remove('dragging', 'will-play');
    potionDrag.el.style.transform = '';
    potionDrag = null;
    R.targeting = false;
    hidePotionTip();
  }

  function usePotionAt(slot, targetIdx) {
    setTargeting(false);
    E.events.length = 0;
    var ok = E.usePotion(slot, targetIdx);
    if (!ok) { updatePotions(); return; }
    SFX.play();
    var evts = E.events.slice();
    E.events.length = 0;
    lock(true);
    playTimeline(evts, 70, function () {
      lock(false);
      afterAction(false);
    });
    updatePotions();
    updateEnergy();
    updateCounts();
    updateHUD();
  }

  function renderControls() {
    $controls.innerHTML = '';
    var btn = el('button', 'btn', 'END TURN');
    btn.addEventListener('pointerdown', function () {
      if (locked || !E.combat || E.combat.over) return;
      SFX.tap();
      doEndTurn();
    });
    $controls.appendChild(btn);
  }

  function updateEnergy() {
    var c = E.combat;
    if (!c) return;
    $energy.textContent = '⚡ ' + c.energy;
  }

  var CLASS_COLOR = { vanguard: '#ffb02e', technomancer: '#41d8ff', voidadept: '#c86bff' };
  function pileHTML(cls, which, n, sub) {
    var set = ns.PILE_ICONS[cls] || ns.PILE_ICONS.vanguard;
    return '<div class="pile-card pile-' + which + '">' + artSVG(set[which], 'pile-ic', CLASS_COLOR[cls] || '#5dff88') +
      '<span class="pile-n">' + n + '</span></div>' +
      '<div class="pile-lbl">' + (which === 'draw' ? 'DRAW' : 'DISC' + (sub || '')) + '</div>';
  }
  function updateCounts() {
    var c = E.combat;
    if (!c) return;
    var cls = E.run.cls;
    $drawPile.innerHTML = pileHTML(cls, 'draw', c.drawPile.length, '');
    $discardPile.innerHTML = pileHTML(cls, 'discard', c.discard.length, c.exhaust.length ? '·E' + c.exhaust.length : '');
  }

  // Look into the draw / discard pile.
  function showPileModal(which) {
    var c = E.combat;
    if (!c) return;
    var wasCombat = E.run.phase === 'combat';
    var cards = (which === 'draw' ? c.drawPile : c.discard).slice();
    var s = overlayScreen();
    s.appendChild(el('h2', 'screen-title', (which === 'draw' ? 'Draw Pile' : 'Discard Pile') + ' (' + cards.length + ')'));
    s.appendChild(el('div', 'screen-sub', which === 'draw' ? 'ORDER IS HIDDEN UNTIL DRAWN' : 'MOST RECENTLY PLAYED LAST'));
    if (!cards.length) s.appendChild(el('div', 'screen-sub', '— EMPTY —'));
    var grid = el('div', 'card-grid');
    var list = (which === 'draw') ? cards.sort(function (a, b) { return ns.CARDS[a.id].cost - ns.CARDS[b.id].cost; }) : cards;
    list.forEach(function (card) { grid.appendChild(cardEl(card.id, card.up, card.vtouch)); });
    s.appendChild(grid);
    var btn = el('button', 'btn', 'CLOSE');
    btn.addEventListener('pointerdown', function () { SFX.tap(); if (wasCombat) showCombat(); else U.refresh(); });
    s.appendChild(btn);
  }

  // In-combat card pickers for the colorless tech (Scry / Tutor / Discover).
  function showChoiceModal() {
    var c = E.combat, p = c && c.pending;
    if (!p) { afterAction(false); return; }
    var s = overlayScreen(true);
    var titles = { scry: 'SCRY', tutor: 'REQUISITION', discover: 'DISCOVER' };
    var subs = {
      scry: 'TAP CARDS TO DISCARD THEM — THE REST STAY ON TOP OF YOUR DECK',
      tutor: 'TAP A CARD TO PULL IT INTO YOUR HAND',
      discover: 'TAP A CARD TO ADD IT TO YOUR HAND',
    };
    s.appendChild(el('h2', 'screen-title', titles[p.kind]));
    s.appendChild(el('div', 'screen-sub', subs[p.kind]));
    var marked = {};
    var grid = el('div', 'card-grid');
    p.cards.forEach(function (card) {
      var ce = cardEl(card.id, card.up, card.vtouch);
      ce.addEventListener('pointerdown', function (ev) {
        ev.stopPropagation(); SFX.tap();
        if (p.kind === 'scry') {
          if (marked[card.uid]) { delete marked[card.uid]; ce.classList.remove('pick-ditch'); }
          else { marked[card.uid] = true; ce.classList.add('pick-ditch'); }
        } else if (p.kind === 'tutor') { E.resolveTutor(card.uid); finishChoice(); }
        else { E.resolveDiscover(card.uid); finishChoice(); }
      });
      grid.appendChild(ce);
    });
    s.appendChild(grid);
    if (p.kind === 'scry') {
      var done = el('button', 'btn', 'CONFIRM');
      done.addEventListener('pointerdown', function () { SFX.tap(); E.resolveScry(Object.keys(marked).map(Number)); finishChoice(); });
      s.appendChild(done);
    } else {
      var skip = el('button', 'btn ghost', p.kind === 'tutor' ? 'TAKE NOTHING' : 'SKIP');
      skip.addEventListener('pointerdown', function () { SFX.tap(); c.pending = null; finishChoice(); });
      s.appendChild(skip);
    }
  }
  function finishChoice() {
    hideOverlay();
    showCombat();
    afterAction(false);
  }

  /* ---- shared card markup ---------------------------------------------- */
  var TYPE_ICONS = {
    attack: '<svg viewBox="0 0 14 14"><path d="M2 12 L9 3 L11 7 L6 12 Z"/><path d="M9 9 L12 12"/></svg>',
    skill: '<svg viewBox="0 0 14 14"><path d="M7 1 L12 4 L12 9 L7 13 L2 9 L2 4 Z"/><path d="M7 4 L7 10"/></svg>',
    power: '<svg viewBox="0 0 14 14"><path d="M2 8 L7 3 L12 8"/><path d="M2 12 L7 7 L12 12"/></svg>',
    curse: '<svg viewBox="0 0 14 14"><circle cx="7" cy="7" r="5.5"/><path d="M4 4 L10 10 M10 4 L4 10"/></svg>',
  };

  function cardGlyphSVG(cid) {
    return artSVG(ns.cardGlyph(cid, ns.CARDS[cid]), 'cart-svg');
  }
  // Colour combat keywords in card text to match the on-field status pills.
  var KW_MAP = [
    ['Plated Armor', 'pa'], ['Vulnerable', 'vu'], ['Shield', 'sh'], ['Weak', 'wk'],
    ['Burn', 'bn'], ['Might', 'mi'], ['Energy', 'en'], ['Exhaust', 'ex'],
    ['Retain', 'rt'], ['Heal', 'hl'], ['Echo', 'ec'], ['Thorns', 'th'], ['Regen', 'rg'],
  ];
  function descHTML(desc) {
    var s = esc(desc);
    for (var i = 0; i < KW_MAP.length; i++) {
      s = s.replace(new RegExp('\\b(' + KW_MAP[i][0] + 's?)\\b', 'g'), '<span class="kw kw-' + KW_MAP[i][1] + '">$1</span>');
    }
    return s;
  }
  function rareClassOf(rarity) { return rarity === 4 ? ' legendary' : rarity === 3 ? ' rare' : rarity === 2 ? ' unc' : ''; }
  function cardInner(name, cost, type, rarity, desc, unplayable, cid) {
    var r = rarity === 4 ? 'r4' : rarity === 3 ? 'r3' : rarity === 2 ? 'r2' : 'r1';
    var tag = rarity === 4 ? 'LEGENDARY' : rarity === 3 ? 'RARE' : rarity === 2 ? 'UNC' : '';
    return '<div class="cost"><svg viewBox="0 0 24 24"><polygon points="12,0.8 21.7,6.4 21.7,17.6 12,23.2 2.3,17.6 2.3,6.4"/></svg>' +
      '<span class="cost-n">' + (unplayable ? '✕' : cost) + '</span></div>' +
      '<div class="cname">' + esc(name) + '</div>' +
      '<div class="cart">' + cardGlyphSVG(cid) + '</div>' +
      '<div class="rline ' + r + '">' + (tag ? '<span class="rtag">' + tag + '</span>' : '') + '</div>' +
      '<div class="cdesc">' + descHTML(desc) + '</div>';
  }

  function renderHand(deal) {
    $hand.innerHTML = '';
    var c = E.combat;
    if (!c) return;
    var n = c.hand.length, mid = (n - 1) / 2;
    var spread = n > 1 ? Math.min(4.2, 26 / n) : 0; // degrees between cards
    c.hand.forEach(function (card, i) {
      var info = E.cardInfo(card);
      var d = el('div', 'card type-' + info.type + rareClassOf(info.rarity) +
        (info.vtouch ? ' vtouched' : '') +
        (info.cost > c.energy && !info.unplayable ? ' unaffordable' : '') +
        (info.unplayable ? ' unplayable-curse' : '') +
        (deal ? ' deal' : '') +
        (i === selected ? ' selected' : ''));
      if (deal) d.style.setProperty('--d', (i * 55) + 'ms');
      // fan the hand into an arc so cards don't simply stack behind each other
      var off = i - mid;
      var rot = off * spread;
      var ty = Math.abs(off) * Math.abs(off) * 1.5;
      d.style.setProperty('--fan', 'rotate(' + rot.toFixed(2) + 'deg) translateY(' + ty.toFixed(1) + 'px)');
      d.innerHTML = cardInner(info.name, info.xcost ? 'X' : info.cost, info.type, info.rarity, info.desc, info.unplayable, card.id);
      d.addEventListener('pointerdown', function (ev) {

  /* ---- swipe-to-play -------------------------------------------------- */
  // Swipe a card up to play it; drag it onto an enemy to choose the target.
  // A short tap (no movement) selects the card for reading instead.
  var drag = null; // {el, idx, info, x0, y0, dx, dy, moved}

  function startCardDrag(el, i, ev) {
    if (locked || drag || !E.combat || E.combat.over) return;
    var card = E.combat.hand[i];
    if (!card) return;
    drag = { el: el, idx: i, info: E.cardInfo(card), x0: ev.clientX, y0: ev.clientY, dx: 0, dy: 0, moved: false };
    if (el.setPointerCapture && ev.pointerId !== undefined) {
      try { el.setPointerCapture(ev.pointerId); } catch (e) { /* not supported */ }
    }
  }

  function onDragMove(ev) {
    if (potionDrag) { onPotionMove(ev); return; }
    if (!drag) return;
    drag.dx = ev.clientX - drag.x0;
    drag.dy = ev.clientY - drag.y0;
    if (!drag.moved && Math.abs(drag.dx) + Math.abs(drag.dy) > 9) {
      drag.moved = true;
      drag.el.classList.add('dragging');
      if (selected >= 0) { selected = -1; var s = $hand.querySelector('.card.selected'); if (s) s.classList.remove('selected'); }
      var multi = E.aliveEnemies().length > 1;
      if (drag.info.needsTarget && multi && !drag.info.unplayable) setTargeting(true);
    }
    if (drag.moved) {
      var lift = Math.min(0, drag.dy);
      // the card lives inside the scaled #game frame, so divide the screen-space
      // drag offset by the scale to keep the card pinned under the finger
      drag.el.style.transform = 'translate(' + (drag.dx / uiScale) + 'px,' + (drag.dy / uiScale) + 'px) scale(' + (1 + Math.min(0.25, -lift / 400)) + ')';
      var armed = canDropPlay(ev);
      drag.el.classList.toggle('will-play', armed);
    }
  }

  function canDropPlay(ev) {
    if (!drag || !E.canPlay(drag.idx)) return false;
    var multi = E.aliveEnemies().length > 1;
    if (drag.info.needsTarget && multi) return enemyAtClient(ev) >= 0;
    return -drag.dy > B.feel.swipeThreshold || enemyAtClient(ev) >= 0;
  }

  function enemyAtClient(ev) {
    var rect = document.getElementById('battlefield').getBoundingClientRect();
    return R.enemyAt(ev.clientX - rect.left, ev.clientY - rect.top);
  }

  function onDragEnd(ev) {
    if (potionDrag) { onPotionEnd(ev); return; }
    if (!drag) return;
    var d = drag;
    drag = null;
    d.el.classList.remove('dragging');
    d.el.classList.remove('will-play');
    d.el.style.transform = '';

    if (!d.moved) { cardTapped(d.idx); return; }

    if (locked || !E.combat || E.combat.over) { setTargeting(false); return; }

    var info = d.info;
    if (info.unplayable) { setTargeting(false); toast('UNPLAYABLE — a curse weighs down your deck'); return; }
    if (!E.canPlay(d.idx)) { setTargeting(false); toast('NOT ENOUGH ENERGY'); return; }

    var multi = E.aliveEnemies().length > 1;
    var tgt = enemyAtClient(ev);
    if (info.needsTarget && multi) {
      if (tgt >= 0) playCardAt(d.idx, tgt);
      else {
        setTargeting(false);
        if (-d.dy > B.feel.swipeThreshold) toast('DROP THE CARD ON A TARGET');
      }
    } else {
      if (tgt >= 0 || -d.dy > B.feel.swipeThreshold) playCardAt(d.idx, tgt);
      else setTargeting(false);
    }
  }

  function onDragCancel() {
    if (potionDrag) { onPotionCancel(); return; }
    if (!drag) return;
