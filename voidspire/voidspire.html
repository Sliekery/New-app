<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#04080a">
<title>VOIDSPIRE</title>
<style>
/* =========================================================================
 * VOIDSPIRE — retro-futuristic vector CRT styling
 * ========================================================================= */
:root {
  --bg: #04080a;
  --panel: #0a1418;
  --panel2: #0e1c22;
  --green: #5dff88;
  --green-dim: #2a7a46;
  --cyan: #41d8ff;
  --amber: #ffb02e;
  --magenta: #c86bff;
  --red: #ff4a5e;
  --text: #b8e6c4;
  --text-dim: #5e8a6c;
  --glow-g: 0 0 6px rgba(93, 255, 136, 0.55);
  --glow-c: 0 0 6px rgba(65, 216, 255, 0.55);
  --glow-a: 0 0 6px rgba(255, 176, 46, 0.55);
}

* { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

html, body {
  height: 100%;
  overflow: hidden;
  background: var(--bg);
  font-family: ui-monospace, 'SF Mono', 'Cascadia Mono', Menlo, Consolas, monospace;
  color: var(--text);
  -webkit-user-select: none;
  user-select: none;
  -webkit-text-size-adjust: 100%;
  touch-action: manipulation;
  overscroll-behavior: none;
}

#game {
  position: fixed;
  inset: 0;
  max-width: 560px;
  margin: 0 auto;
  overflow: hidden;
}

#battlefield { position: absolute; inset: 0; width: 100%; height: 100%; }

/* ---- CRT overlay ---- */
#crt {
  position: fixed; inset: 0; pointer-events: none; z-index: 200;
  background:
    repeating-linear-gradient(0deg, rgba(0,0,0,0.16) 0px, rgba(0,0,0,0.16) 1px, transparent 1px, transparent 3px),
    radial-gradient(ellipse at center, transparent 55%, rgba(0,0,0,0.42) 100%);
}

/* ========================= HUD ========================= */
#hud {
  position: absolute; top: 0; left: 0; right: 0; z-index: 20;
  padding: calc(env(safe-area-inset-top, 0px) + 8px) 10px 6px;
  pointer-events: none;
}
#hud .row { display: flex; align-items: center; gap: 8px; }
#hud .hp-wrap { flex: 1; pointer-events: auto; }
#hud .hp-bar {
  position: relative; height: 18px;
  border: 1px solid var(--green-dim);
  background: rgba(10, 30, 18, 0.6);
  clip-path: polygon(0 0, calc(100% - 8px) 0, 100% 100%, 8px 100%);
}
#hud .hp-fill {
  position: absolute; inset: 1px; transform-origin: left;
  background: linear-gradient(90deg, #1e7a3c, var(--green));
  transition: transform 0.35s ease-out;
}
#hud .hp-text {
  position: absolute; inset: 0; text-align: center; font-size: 11px; line-height: 18px;
  color: #eaffe9; text-shadow: 0 0 4px #000, 0 0 4px #000; letter-spacing: 1px;
}
#hud .shield-chip {
  font-size: 12px; color: var(--cyan); text-shadow: var(--glow-c);
  border: 1px solid rgba(65,216,255,0.5); padding: 2px 6px; min-width: 38px; text-align: center;
  background: rgba(10, 25, 35, 0.7);
}
#hud .stat { font-size: 11px; color: var(--text-dim); letter-spacing: 1px; white-space: nowrap; }
#hud .stat b { color: var(--amber); text-shadow: var(--glow-a); font-weight: normal; }
#hud .row2 { margin-top: 4px; display: flex; align-items: center; gap: 6px; }
#hud .attr { font-size: 10px; letter-spacing: 1px; color: var(--text-dim); }
#hud .attr b { color: var(--text); font-weight: normal; }
#hud .spacer { flex: 1; }
#hud .icon-btn {
  pointer-events: auto; font-size: 10px; letter-spacing: 1px;
  border: 1px solid var(--green-dim); color: var(--text);
  background: rgba(10, 30, 18, 0.65); padding: 4px 8px; cursor: pointer;
}
#hud .artifact-row {
  margin-top: 4px; display: flex; flex-wrap: wrap; gap: 4px; pointer-events: auto;
}
#hud .artifact-chip {
  width: 22px; height: 22px; font-size: 10px; line-height: 20px; text-align: center;
  border: 1px solid var(--amber); color: var(--amber); text-shadow: var(--glow-a);
  background: rgba(35, 25, 5, 0.7); cursor: pointer;
}
#hud .status-row { margin-top: 4px; display: flex; gap: 4px; flex-wrap: wrap; }
.status-chip {
  font-size: 9px; letter-spacing: 1px; padding: 2px 5px;
  border: 1px solid var(--text-dim); color: var(--text);
  background: rgba(8, 18, 14, 0.8);
}
.status-chip.buff { border-color: var(--green-dim); color: var(--green); }
.status-chip.debuff { border-color: #804; color: var(--red); }

/* ========================= HAND ========================= */
#hand {
  position: absolute; left: 0; right: 0;
  bottom: calc(env(safe-area-inset-bottom, 0px) + 6px);
  height: 148px; z-index: 30;
  display: flex; justify-content: center; align-items: flex-end;
  padding: 0 6px; pointer-events: none;
}
.card {
  pointer-events: auto;
  touch-action: none;
  position: relative;
  width: 88px; min-width: 0; height: 124px;
  margin: 0 -7px;
  background: linear-gradient(160deg, var(--panel2), var(--panel));
  border: 1px solid var(--green-dim);
  transition: transform 0.16s ease-out, box-shadow 0.16s, border-color 0.16s;
  cursor: pointer;
  flex-shrink: 1;
  clip-path: polygon(0 6px, 6px 0, 100% 0, 100% calc(100% - 6px), calc(100% - 6px) 100%, 0 100%);
}
.card.type-attack { border-color: #9a5a20; }
.card.type-skill { border-color: #1f7a96; }
.card.type-power { border-color: #7a3f9a; }
.card.type-curse { border-color: #7a2030; }
.card .cost {
  position: absolute; top: 3px; left: 3px; width: 18px; height: 18px;
  font-size: 12px; line-height: 18px; text-align: center;
  color: var(--cyan); text-shadow: var(--glow-c);
  border: 1px solid rgba(65,216,255,0.6); background: rgba(5, 20, 28, 0.9);
}
/* faint circuit-etch watermark */
.card::after {
  content: ''; position: absolute; inset: 0; pointer-events: none;
  background:
    repeating-linear-gradient(115deg, transparent 0 6px, rgba(184, 230, 196, 0.022) 6px 7px),
    linear-gradient(to top, rgba(184, 230, 196, 0.03), transparent 35%);
}
.card .cicon { position: absolute; top: 4px; right: 4px; width: 13px; height: 13px; opacity: 0.85; }
.card .cicon svg { width: 100%; height: 100%; display: block; }
.card .cicon path, .card .cicon circle { fill: none; stroke: currentColor; stroke-width: 1.3; stroke-linejoin: round; }
.card.type-attack .cicon { color: var(--amber); }
.card.type-skill .cicon { color: var(--cyan); }
.card.type-power .cicon { color: var(--magenta); }
.card.type-curse .cicon { color: var(--red); }
.card .rline { height: 1px; margin: 0 5px 3px; background: rgba(94, 138, 108, 0.35); }
.card .rline.r2 { background: linear-gradient(90deg, rgba(65, 216, 255, 0.7), transparent); box-shadow: 0 0 4px rgba(65, 216, 255, 0.4); }
.card .rline.r3 { background: linear-gradient(90deg, rgba(255, 176, 46, 0.85), transparent); box-shadow: 0 0 4px rgba(255, 176, 46, 0.5); }
.card .cname {
  margin: 5px 18px 2px 24px; font-size: 9px; line-height: 1.15; letter-spacing: 0.5px;
  color: var(--text); text-transform: uppercase; min-height: 21px;
}
.card.type-attack .cname { color: var(--amber); }
.card.type-skill .cname { color: var(--cyan); }
.card.type-power .cname { color: var(--magenta); }
.card.type-curse .cname { color: var(--red); }
.card .ctype { font-size: 7px; letter-spacing: 2px; color: var(--text-dim); margin: 0 4px 3px; text-transform: uppercase; }
.card .cdesc { font-size: 8.5px; line-height: 1.3; color: var(--text); padding: 0 5px; }
.card.unaffordable { opacity: 0.45; }
.card.selected {
  transform: translateY(-64px) scale(1.5);
  z-index: 50;
  box-shadow: 0 0 18px rgba(93, 255, 136, 0.35), 0 8px 30px rgba(0,0,0,0.8);
  border-color: var(--green);
}
.card.unplayable-curse { filter: saturate(0.5) brightness(0.8); }
.card.dragging {
  transition: none;
  z-index: 60;
  box-shadow: 0 12px 30px rgba(0, 0, 0, 0.8);
}
.card.will-play {
  border-color: var(--green);
  box-shadow: 0 0 18px rgba(93, 255, 136, 0.55), 0 12px 30px rgba(0, 0, 0, 0.8);
}

/* ========================= COMBAT CONTROLS ========================= */
#combat-controls {
  position: absolute; right: 8px;
  bottom: calc(env(safe-area-inset-bottom, 0px) + 160px);
  z-index: 25; display: flex; flex-direction: column; gap: 8px; align-items: flex-end;
}
#energy-pip {
  position: absolute; left: 8px;
  bottom: calc(env(safe-area-inset-bottom, 0px) + 160px);
  z-index: 25;
  font-size: 17px; color: var(--cyan); text-shadow: var(--glow-c);
  border: 1px solid rgba(65,216,255,0.55);
  background: rgba(5, 20, 28, 0.85); padding: 7px 12px;
}
.btn {
  font-family: inherit;
  font-size: 13px; letter-spacing: 2px; text-transform: uppercase;
  color: var(--green); text-shadow: var(--glow-g);
  background: rgba(10, 30, 18, 0.85);
  border: 1px solid var(--green);
  padding: 12px 18px;
  cursor: pointer;
  transition: background 0.12s, transform 0.06s;
  clip-path: polygon(0 8px, 8px 0, 100% 0, 100% calc(100% - 8px), calc(100% - 8px) 100%, 0 100%);
}
.btn:active { background: rgba(40, 90, 55, 0.9); transform: scale(0.97); }
.btn.dim { color: var(--text-dim); border-color: var(--green-dim); text-shadow: none; }
.btn.amber { color: var(--amber); border-color: var(--amber); text-shadow: var(--glow-a); background: rgba(35,25,5,0.85); }
.btn.cyan { color: var(--cyan); border-color: var(--cyan); text-shadow: var(--glow-c); background: rgba(5,20,28,0.85); }
.btn.red { color: var(--red); border-color: var(--red); background: rgba(30,8,12,0.85); }
.btn.small { font-size: 11px; padding: 8px 12px; }
.btn:disabled { opacity: 0.35; pointer-events: none; }

#deck-counts {
  position: absolute; left: 8px;
  bottom: calc(env(safe-area-inset-bottom, 0px) + 8px);
  z-index: 31; font-size: 9px; color: var(--text-dim); letter-spacing: 1px;
  pointer-events: none;
}
#deck-counts span { margin-right: 8px; }

/* ========================= FLOATERS ========================= */
#floaters { position: absolute; inset: 0; z-index: 60; pointer-events: none; overflow: hidden; }
.floater {
  position: absolute; transform: translate(-50%, -50%);
  font-size: 20px; color: var(--red); text-shadow: 0 0 8px rgba(255,74,94,0.7), 0 1px 2px #000;
  animation: floatUp 0.9s ease-out forwards;
  white-space: nowrap;
}
.floater.heal { color: var(--green); text-shadow: 0 0 8px rgba(93,255,136,0.7); }
.floater.block { color: var(--cyan); text-shadow: 0 0 8px rgba(65,216,255,0.7); }
.floater.crit { font-size: 28px; color: var(--amber); text-shadow: 0 0 12px rgba(255,176,46,0.9); }
.floater.status { font-size: 13px; color: var(--magenta); }
.floater.roll { font-size: 12px; color: var(--text-dim); }
@keyframes floatUp {
  0% { opacity: 0; transform: translate(-50%, -30%) scale(0.6); }
  15% { opacity: 1; transform: translate(-50%, -50%) scale(1.1); }
  100% { opacity: 0; transform: translate(-50%, -160%) scale(1); }
}

/* ========================= OVERLAY SCREENS ========================= */
#overlay { position: absolute; inset: 0; z-index: 100; display: none; }
#overlay.active { display: block; }
.screen {
  position: absolute; inset: 0;
  background: rgba(3, 7, 9, 0.93);
  display: flex; flex-direction: column; align-items: center;
  padding: calc(env(safe-area-inset-top, 0px) + 26px) 18px calc(env(safe-area-inset-bottom, 0px) + 20px);
  overflow-y: auto;
  animation: screenIn 0.25s ease-out;
}
.screen.clear { background: rgba(3, 7, 9, 0.78); }
@keyframes screenIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }

.title-logo {
  font-size: 38px; letter-spacing: 8px; color: var(--green);
  text-shadow: 0 0 18px rgba(93,255,136,0.6); margin: 36px 0 4px; text-align: center;
}
.subtitle { font-size: 10px; letter-spacing: 4px; color: var(--text-dim); margin-bottom: 28px; text-align: center; }

h2.screen-title {
  font-size: 17px; letter-spacing: 4px; color: var(--green);
  text-shadow: var(--glow-g); margin-bottom: 4px; text-align: center; font-weight: normal;
  text-transform: uppercase;
}
.screen-sub { font-size: 10px; letter-spacing: 2px; color: var(--text-dim); margin-bottom: 18px; text-align: center; }

.panel-btn {
  width: 100%; max-width: 420px;
  background: linear-gradient(160deg, var(--panel2), var(--panel));
  border: 1px solid var(--green-dim);
  padding: 14px; margin-bottom: 12px; cursor: pointer;
  transition: border-color 0.12s, transform 0.08s;
  text-align: left;
  clip-path: polygon(0 8px, 8px 0, 100% 0, 100% calc(100% - 8px), calc(100% - 8px) 100%, 0 100%);
}
.panel-btn:active { transform: scale(0.985); border-color: var(--green); }
.panel-btn .pb-title { font-size: 13px; letter-spacing: 2px; color: var(--green); text-shadow: var(--glow-g); text-transform: uppercase; }
.panel-btn .pb-sub { font-size: 10px; color: var(--text-dim); margin-top: 4px; letter-spacing: 0.5px; }
.panel-btn .pb-desc { font-size: 10.5px; color: var(--text); margin-top: 6px; line-height: 1.45; }
.panel-btn.amber .pb-title { color: var(--amber); text-shadow: var(--glow-a); }
.panel-btn.cyan .pb-title { color: var(--cyan); text-shadow: var(--glow-c); }
.panel-btn.magenta .pb-title { color: var(--magenta); }
.panel-btn.disabled { opacity: 0.4; pointer-events: none; }

.event-text {
  max-width: 420px; font-size: 12.5px; line-height: 1.7; color: var(--text);
  margin-bottom: 20px; border-left: 2px solid var(--green-dim); padding-left: 12px;
}
.event-result-text { color: var(--cyan); }

.dice-box {
  font-size: 40px; color: var(--amber); text-shadow: 0 0 14px rgba(255,176,46,0.7);
  margin: 14px 0; letter-spacing: 2px; min-height: 52px; text-align: center;
}
.dice-box .dc { font-size: 12px; color: var(--text-dim); display: block; letter-spacing: 2px; }
.dice-box.pass { color: var(--green); text-shadow: 0 0 14px rgba(93,255,136,0.7); }
.dice-box.fail { color: var(--red); text-shadow: 0 0 14px rgba(255,74,94,0.7); }

.gain-list { margin: 10px 0 18px; text-align: center; }
.gain-list div { font-size: 12px; color: var(--amber); margin: 4px 0; letter-spacing: 1px; }

/* card grid for rewards / deck view */
.card-grid {
  display: flex; flex-wrap: wrap; justify-content: center; gap: 10px;
  max-width: 440px; margin-bottom: 16px;
}
.card-grid .card { margin: 0; pointer-events: auto; }
.card-grid .card.picked { border-color: var(--green); box-shadow: 0 0 14px rgba(93,255,136,0.4); }
.card-grid .card .price {
  position: absolute; bottom: 3px; right: 5px; font-size: 10px;
  color: var(--amber); text-shadow: var(--glow-a);
}
.card-grid .card.sold { opacity: 0.3; pointer-events: none; }

.shop-row { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; max-width: 440px; margin-bottom: 14px; }

.big-score { font-size: 34px; color: var(--amber); text-shadow: var(--glow-a); margin: 10px 0; letter-spacing: 3px; }

.sector-banner {
  font-size: 22px; letter-spacing: 6px; color: var(--green); text-shadow: 0 0 16px rgba(93,255,136,0.65);
  margin: 40px 0 8px; text-align: center;
}
.faction-tag { font-size: 11px; letter-spacing: 3px; margin-bottom: 30px; }

.footer-note { margin-top: auto; padding-top: 14px; font-size: 9px; letter-spacing: 2px; color: var(--text-dim); text-align: center; }

/* ========================= TOAST ========================= */
#toast {
  position: absolute; left: 50%; bottom: calc(env(safe-area-inset-bottom, 0px) + 170px);
  transform: translateX(-50%);
  z-index: 150; pointer-events: none;
  font-size: 11px; letter-spacing: 1px; color: var(--text);
  background: rgba(8, 18, 14, 0.95); border: 1px solid var(--green-dim);
  padding: 8px 14px; opacity: 0; transition: opacity 0.25s;
  max-width: 86%; text-align: center;
}
#toast.show { opacity: 1; }

/* targeting hint */
#target-hint {
  position: absolute; top: 38%; left: 50%; transform: translateX(-50%);
  z-index: 26; font-size: 12px; letter-spacing: 3px; color: var(--amber);
  text-shadow: var(--glow-a); pointer-events: none;
  animation: pulse 1s ease-in-out infinite;
}
@keyframes pulse { 0%, 100% { opacity: 0.5; } 50% { opacity: 1; } }

@media (max-height: 640px) {
  #hand { height: 128px; }
  .card { height: 110px; }
  #combat-controls { bottom: calc(env(safe-area-inset-bottom, 0px) + 140px); }
  #energy-pip { bottom: calc(env(safe-area-inset-bottom, 0px) + 140px); }
}

</style>
</head>
<body>
  <div id="game">
    <canvas id="battlefield"></canvas>
    <div id="hud"></div>
    <div id="hand"></div>
    <div id="combat-controls"></div>
    <div id="overlay"></div>
    <div id="floaters"></div>
    <div id="toast"></div>
  </div>
  <div id="crt"></div>
<script>

/* ===== js/balance.js ===== */
/* =========================================================================
 * VOIDSPIRE — balance.js
 * Every tunable number in the game lives here. Tweak freely.
 * ========================================================================= */
(function (ns) {
  'use strict';

  ns.BALANCE = {

    /* ---- Player ----------------------------------------------------- */
    player: {
      baseEnergy: 3,            // energy gained at the start of each turn
      drawPerTurn: 5,           // cards drawn at the start of each turn
      maxHand: 10,              // cards beyond this are not drawn
      startCredits: 30,
    },

    /* ---- Classes ---------------------------------------------------- */
    classes: {
      vanguard:  { hp: 80, might: 2, tech: 0, psi: 0 },
      technomancer: { hp: 68, might: 0, tech: 2, psi: 0 },
      voidadept: { hp: 75, might: 0, tech: 0, psi: 2 },
    },

    /* ---- Attribute scaling ------------------------------------------ */
    attrs: {
      mightDmgPerPoint: 1,      // bonus damage per MIGHT on might-scaling attacks
      techBlockPerPoint: 1,     // bonus block per TECH on tech-scaling skills
      psiDmgPerPoint: 1,        // bonus damage per PSI on psi-scaling attacks
      eventCheckBonusDiv: 1,    // event check bonus = attr / this (rounded down)
    },

    /* ---- d20 / crits ------------------------------------------------ */
    dice: {
      critThreshold: 20,        // natural roll >= (threshold - critBonus) crits
      critMult: 2.0,            // crit damage multiplier
    },

    /* ---- Status effects ---------------------------------------------- */
    status: {
      vulnMult: 1.5,            // damage taken multiplier while Vulnerable
      weakMult: 0.75,           // damage dealt multiplier while Weakened
      burnTick: 1,              // burn stacks lost per turn (damage = stacks)
    },

    /* ---- Enemy scaling per sector (s = sector, 1-based) -------------- */
    scaling: {
      hpMul:  function (s) { return 1 + 0.30 * (s - 1) + 0.045 * (s - 1) * (s - 1); },
      dmgMul: function (s) { return 1 + 0.20 * (s - 1) + 0.030 * (s - 1) * (s - 1); },
      // extra flat strength enemies gain every N sectors (late-game pressure)
      strEverySectors: 3,
    },

    /* ---- Sector / node structure ------------------------------------ */
    sector: {
      // node script per sector; 'choice' = player picks one of two random nodes
      script: ['fight', 'choice', 'fight', 'choice', 'elite', 'choice', 'choice', 'boss'],
      // weighted pool used for 'choice' slots (two distinct options are offered)
      choiceWeights: { fight: 38, event: 30, shop: 12, rest: 20 },
      eliteChance2Enemies: 0.35, // chance an elite brings a minion (sector 3+)
    },

    /* ---- Rewards ------------------------------------------------------ */
    rewards: {
      creditsFight: [18, 30],   // [min, max] credits from a normal fight
      creditsElite: [40, 60],
      creditsBoss:  [70, 95],
      creditsPerSectorMul: 0.10, // +10% credits per sector beyond the first
      cardChoices: 3,            // cards offered after a fight
      rareChance: 0.08,          // chance an offered card is rare
      uncommonChance: 0.32,      // chance an offered card is uncommon (else common)
      eliteRareChance: 0.25,     // rarity boost for elite rewards
      bossHealPct: 0.28,         // heal option after beating a boss
      restHealPct: 0.30,         // heal at a rest node
    },

    /* ---- Level up (after each boss) ----------------------------------- */
    levelUp: {
      attrGain: 1,               // points gained when picking an attribute
      maxHpGain: 9,              // option: +max HP (also heals this much)
    },

    /* ---- Shop ---------------------------------------------------------- */
    shop: {
      cardCost:     { 1: 35, 2: 55, 3: 90 },  // by rarity
      artifactCost: 80,
      removeCost: 40,            // remove a card from the deck
      removeCostInc: 15,         // increase per purchase this run
      healCost: 30,
      healAmount: 18,
    },

    /* ---- Combat feel (UI timings, ms) ---------------------------------- */
    feel: {
      enemyActDelay: 520,        // stagger between enemy actions
      cardPlayDelay: 260,        // pause after playing a card
      floaterLife: 900,
      shakeMag: 7,
      swipeThreshold: 64,        // px of upward drag needed to play a card
    },

    /* ---- Score ---------------------------------------------------------- */
    score: {
      perSector: 100,
      perNode: 12,
      perKill: 4,
    },
  };

})(typeof window !== 'undefined' ? (window.VS = window.VS || {}) : (global.VS = global.VS || {}));

/* ===== js/cards.js ===== */
/* =========================================================================
 * VOIDSPIRE — cards.js
 * Card definitions. Effects are declarative; descriptions auto-generate.
 *
 * fx ops:
 *   {k:'dmg', v, hits?, scale?:'might'|'tech'|'psi', scaleMul?, all?, random?}
 *   {k:'block', v, scale?:'tech'}
 *   {k:'heal', v} {k:'hploss', v} {k:'draw', v} {k:'energy', v}
 *   {k:'status', s, v, who:'self'|'target'|'allEnemies'}

    c.energy = maxEnergy();
    if (c.turn === 1) c.energy += art('energyTurn1');
    var draws = B.player.drawPerTurn + (c.turn === 1 ? art('drawStart') : 0);
    drawCards(draws);
    emit('turnStart', { turn: c.turn });
    if (aoe > 0) {
      c.enemies.forEach(function (en, i) {
        if (en.alive) dealToEnemy(en, i, aoe, { noCrit: true, src: 'Singularity' });
      });
      checkWin();
    }
  }

  function drawCards(n) {
    var c = E.combat;
    for (var i = 0; i < n; i++) {
      if (c.hand.length >= B.player.maxHand) return;
      if (c.drawPile.length === 0) {
        if (c.discard.length === 0) return;
        c.drawPile = shuffle(c.discard);
        c.discard = [];
      }
      c.hand.push(c.drawPile.pop());
    }
  }

  function chooseIntent(en) {
    var def = en.def, mv;
    if (def.ai === 'cycle') {
      mv = def.moves[en.moveIdx % def.moves.length];
      en.moveIdx++;
    } else {
      var pool = [];
      def.moves.forEach(function (m, i) {
        if (i === en.lastMove && def.moves.length > 1) return;
        for (var w = 0; w < (m.w || 1); w++) pool.push(i);
      });
      var idx = pick(pool);
      en.lastMove = idx;
      mv = def.moves[idx];
    }
    en.intent = mv;
  }

  /* Scaled intent values for display */
  E.intentInfo = function (en) {
    var m = en.intent, s = E.run.sector;
    if (!m) return { icon: '?', label: '' };
    if (m.t === 'attack') {
      var d = scaledDmg(m.d, s) + statN(en, 'str');
      if (statN(en, 'weak')) d = Math.floor(d * B.status.weakMult);
      return { icon: 'atk', label: m.hits ? d + '×' + m.hits : '' + d };
    }
    if (m.t === 'drain') {
      var dd = scaledDmg(m.d, s) + statN(en, 'str');
      if (statN(en, 'weak')) dd = Math.floor(dd * B.status.weakMult);
      return { icon: 'drain', label: '' + dd };
    }
    if (m.t === 'block') return { icon: 'block', label: '' + scaledDmg(m.b, s) };
    if (m.t === 'buff') return { icon: 'buff', label: '' };
    if (m.t === 'debuff') return { icon: 'debuff', label: '' };
    if (m.t === 'curse') return { icon: 'curse', label: '' };
    return { icon: '?', label: '' };
  };

  /* ---------------- Combat: playing cards ------------------------------- */
  E.cardInfo = function (card) {
    var def = ns.CARDS[card.id];
    return {
      def: def,
      name: def.name + (card.up ? '+' : ''),
      cost: ns.cardCost(def, card.up),
      desc: ns.cardDesc(def, card.up, liveCtx()),
      type: def.type,
      needsTarget: ns.cardNeedsTarget(def, card.up),
      unplayable: !!def.unplayable,
      rarity: def.rarity,
    };
  };

  function liveCtx() {
    return {
      attrs: { might: attr('might'), tech: attr('tech'), psi: attr('psi') },
      statuses: E.combat ? E.combat.player.statuses : null,
    };
  }

  function attackBonus(f) {
    var p = E.combat.player;
    var v = statN(p, 'str') + art('flatDmg');
    if (f.scale === 'might') v += attr('might') * B.attrs.mightDmgPerPoint;
    if (f.scale === 'tech') v += attr('tech');
    if (f.scale === 'psi') v += attr('psi') * B.attrs.psiDmgPerPoint * (f.scaleMul || 1) + statN(p, 'psiPow');
    return v;
  }

  function dealToEnemy(en, idx, amount, opts) {
    opts = opts || {};
    var c = E.combat;
    if (statN(c.player, 'weak') && !opts.noWeak) amount = Math.floor(amount * B.status.weakMult);
    if (statN(en, 'vuln')) amount = Math.floor(amount * B.status.vulnMult);
    if (opts.execute && en.hp <= en.maxHp * 0.30) amount *= 2;
    if (opts.crit) amount = Math.floor(amount * B.dice.critMult);
    var blocked = Math.min(en.block, amount);
    en.block -= blocked;
    var hpDmg = amount - blocked;
    en.hp -= hpDmg;
    emit('dmg', { who: 'enemy', idx: idx, amount: amount, hpDmg: hpDmg, crit: !!opts.crit, roll: opts.roll, hpAfter: Math.max(0, en.hp), blockAfter: en.block });
    if (en.hp <= 0 && en.alive) {
      en.alive = false;
      E.run.kills++;
      emit('die', { idx: idx });
    }
    return hpDmg;
  }

  function heal(n) {
    var r = E.run;
    var before = r.hp;
    r.hp = Math.min(r.maxHp, r.hp + n);
    if (r.hp !== before) emit('heal', { who: 'player', amount: r.hp - before, hpAfter: r.hp });
  }
  E.heal = heal;

  function hurtPlayer(amount, opts) {
    opts = opts || {};
    var c = E.combat, r = E.run;
    var p = c ? c.player : null;
    if (p && statN(p, 'vuln') && !opts.pure) amount = Math.floor(amount * B.status.vulnMult);
    var blocked = 0;
    if (p && !opts.pure) {
      blocked = Math.min(p.block, amount);
      p.block -= blocked;
    }
    var hpDmg = amount - blocked;
    r.hp -= hpDmg;
    emit('dmg', { who: 'player', amount: amount, hpDmg: hpDmg, hpAfter: Math.max(0, r.hp), blockAfter: p ? p.block : 0 });
    if (r.hp <= 0) playerDied();
    return hpDmg;
  }

  function playerDied() {
    var r = E.run;
    if (r.phase === 'dead') return;
    r.phase = 'dead';
    if (E.combat) E.combat.over = true;
    E.recordBest();
    E.clearSave();
    emit('lose', {});
  }

  function aliveEnemies() { return E.combat.enemies.filter(function (e) { return e.alive; }); }
  E.aliveEnemies = aliveEnemies;

  function checkWin() {
    var c = E.combat;
    if (c.over) return false;
    if (aliveEnemies().length === 0) {
      c.over = true;
      winCombat();
      return true;
    }
    return false;
  }

  E.canPlay = function (handIdx) {
    var c = E.combat;
    if (!c || c.over) return false;
    var card = c.hand[handIdx];
    if (!card) return false;
    var info = E.cardInfo(card);
    return !info.unplayable && info.cost <= c.energy;
  };

  E.playCard = function (handIdx, targetIdx) {
    var c = E.combat, r = E.run;
    if (!E.canPlay(handIdx)) return false;
    var card = c.hand[handIdx];
    var def = ns.CARDS[card.id];
    var fx = ns.cardFx(def, card.up);
    var cost = ns.cardCost(def, card.up);

    // resolve target (default: first living enemy)
    var tgt = c.enemies[targetIdx];
    if (!tgt || !tgt.alive) {
      targetIdx = c.enemies.findIndex(function (e) { return e.alive; });
      tgt = c.enemies[targetIdx];
    }

    c.energy -= cost;
    c.hand.splice(handIdx, 1);

    var flags = {};
    fx.forEach(function (f) { if (f.k === 'special') flags[f.id] = true; });

    // one d20 per card play; only attacks can crit
    var roll = null, crit = false;
    if (def.type === 'attack') {
      roll = d20();
      crit = roll >= B.dice.critThreshold - art('critBonus');
    }

    var totalDealt = 0;

    fx.forEach(function (f) {
      if (c.over && f.k === 'dmg') return;
      switch (f.k) {
        case 'dmg': {
          var base = f.v + attackBonus(f);
          var hits = f.hits || 1;
          for (var h = 0; h < hits; h++) {
            var pool = aliveEnemies();
            if (pool.length === 0) break;
            var en, idx;
            if (f.all) {
              c.enemies.forEach(function (e, i) {
                if (e.alive) totalDealt += dealToEnemy(e, i, base, { crit: crit, roll: roll, execute: flags.execute });
              });
              continue;
            } else if (f.random) {
              en = pick(pool); idx = c.enemies.indexOf(en);
            } else {
              en = (tgt && tgt.alive) ? tgt : pool[0];
              idx = c.enemies.indexOf(en);
            }
            totalDealt += dealToEnemy(en, idx, base, { crit: crit, roll: roll, execute: flags.execute });
          }
          break;
        }
        case 'block': {
          var b = f.v + (f.scale === 'tech' ? attr('tech') * B.attrs.techBlockPerPoint : 0);
          c.player.block += b;
          emit('block', { who: 'player', amount: b, blockAfter: c.player.block });
          break;
        }
        case 'heal': heal(f.v); break;
        case 'hploss': hurtPlayer(f.v, { pure: true }); break;
        case 'draw': drawCards(f.v); break;
        case 'energy': c.energy += f.v; break;
        case 'status': {
          if (f.who === 'self') {
            addStatus(c.player, f.s, f.v);
            emit('status', { who: 'player', s: f.s, v: f.v });
          } else if (f.who === 'allEnemies') {
            c.enemies.forEach(function (e, i) {
              if (e.alive) { addStatus(e, f.s, f.v); emit('status', { who: 'enemy', idx: i, s: f.s, v: f.v }); }
            });
          } else {
            var st = (tgt && tgt.alive) ? tgt : aliveEnemies()[0];
            if (st) { addStatus(st, f.s, f.v); emit('status', { who: 'enemy', idx: c.enemies.indexOf(st), s: f.s, v: f.v }); }
          }
          break;
        }
        case 'special': {
          if (f.id === 'shieldSlam' || f.id === 'shieldSlam15') {
            var dmg = Math.floor(c.player.block * (f.id === 'shieldSlam15' ? 1.5 : 1)) + statN(c.player, 'str') + art('flatDmg');
            var sEn = (tgt && tgt.alive) ? tgt : aliveEnemies()[0];
            if (sEn && dmg > 0) totalDealt += dealToEnemy(sEn, c.enemies.indexOf(sEn), dmg, { crit: crit, roll: roll });
          }
          break;
        }
      }
    });

    if (flags.leech && totalDealt > 0) {
      c.player.block += totalDealt;
      emit('block', { who: 'player', amount: totalDealt, blockAfter: c.player.block });
    }
    if (flags.drain && totalDealt > 0) heal(Math.ceil(totalDealt / 2));

    if (def.exhaust) c.exhaust.push(card);
    else c.discard.push(card);

    emit('cardPlayed', { id: card.id, crit: crit, roll: roll });
    checkWin();
    return true;
  };

  /* ---------------- Combat: enemy turn ----------------------------------- */
  E.endTurn = function () {
    var c = E.combat, r = E.run, p = c.player;
    if (!c || c.over) return;

    // end-of-turn: shrapnel curses in hand
    c.hand.forEach(function (card) {
      if (card.id === 'shrapnel') hurtPlayer(2, { pure: true });
    });
    if (r.phase === 'dead') return;

    // discard hand
    c.discard = c.discard.concat(c.hand);
    c.hand = [];

    // turret + entropy
    var tv = statN(p, 'turret');
    if (tv > 0 && !c.over) {
      var pool = aliveEnemies();
      if (pool.length) {
        var en = pick(pool);
        dealToEnemy(en, c.enemies.indexOf(en), tv + attr('tech'), { noCrit: true, noWeak: true });
      }
    }
    var ev = statN(p, 'entropy');
    if (ev > 0) {
      c.enemies.forEach(function (e, i) {
        if (e.alive) { addStatus(e, 'burn', ev); emit('status', { who: 'enemy', idx: i, s: 'burn', v: ev }); }
      });
    }
    if (checkWin()) return;

    // player status ticks
    if (statN(p, 'burn')) { hurtPlayer(statN(p, 'burn'), { pure: true }); addStatus(p, 'burn', -B.status.burnTick); }
    if (r.phase === 'dead') return;
    if (statN(p, 'regen')) { heal(statN(p, 'regen')); addStatus(p, 'regen', -1); }
    if (statN(p, 'vuln')) addStatus(p, 'vuln', -1);
    if (statN(p, 'weak')) addStatus(p, 'weak', -1);

    // enemies act
    var s = r.sector;
    c.enemies.forEach(function (en, idx) {
      if (!en.alive || c.over || r.phase === 'dead') return;
      // burn ticks before acting
      if (statN(en, 'burn')) {
        var bd = statN(en, 'burn');
        en.hp -= bd;
        emit('dmg', { who: 'enemy', idx: idx, amount: bd, hpDmg: bd, burn: true, hpAfter: Math.max(0, en.hp), blockAfter: en.block });
        addStatus(en, 'burn', -B.status.burnTick);
        if (en.hp <= 0) {
          en.alive = false; r.kills++;
          emit('die', { idx: idx });
          return;
        }
      }
      en.block = 0;
      var m = en.intent;
      emit('enemyMove', { idx: idx, move: m });
      if (m.t === 'attack' || m.t === 'drain') {
        var dmg = scaledDmg(m.d, s) + statN(en, 'str');
        if (statN(en, 'weak')) dmg = Math.floor(dmg * B.status.weakMult);
        var hits = m.hits || 1;
        var totalToPlayer = 0;
        for (var h = 0; h < hits; h++) {
          if (r.phase === 'dead') break;
          totalToPlayer += hurtPlayer(dmg);
          var th = statN(p, 'thorns') + art('thorns');
          if (th > 0 && en.alive) {
            dealToEnemy(en, idx, th, { noCrit: true, noWeak: true });
            if (!en.alive) break;
          }
        }
        if (m.t === 'drain' && en.alive) {
          en.hp = Math.min(en.maxHp, en.hp + dmg);
          emit('heal', { who: 'enemy', idx: idx, amount: dmg, hpAfter: en.hp });
        }
      } else if (m.t === 'block') {
        en.block += scaledDmg(m.b, s);
        emit('block', { who: 'enemy', idx: idx, amount: en.block, blockAfter: en.block });
      } else if (m.t === 'buff') {
        addStatus(en, m.s, m.v);
        emit('status', { who: 'enemy', idx: idx, s: m.s, v: m.v });
      } else if (m.t === 'debuff') {
        addStatus(p, m.s, m.v);
        emit('status', { who: 'player', s: m.s, v: m.v });
      } else if (m.t === 'curse') {
        c.discard.push(mkCard(m.card, false));
        emit('curse', { idx: idx, card: m.card });
      }
      // enemy debuff ticks after acting
      if (statN(en, 'vuln')) addStatus(en, 'vuln', -1);
      if (statN(en, 'weak')) addStatus(en, 'weak', -1);
    });

    if (r.phase === 'dead') return;
    if (checkWin()) return;

    c.enemies.forEach(function (en) { if (en.alive) chooseIntent(en); });
    startPlayerTurn();
  };

  /* ---------------- Combat: victory & rewards ---------------------------- */
  function creditRange(kind) {
    var r = (kind === 'boss') ? B.rewards.creditsBoss : (kind === 'elite') ? B.rewards.creditsElite : B.rewards.creditsFight;
    var v = ri(r[0], r[1]);
    v = Math.round(v * (1 + (E.run.sector - 1) * B.rewards.creditsPerSectorMul));
    v = Math.round(v * (1 + art('creditsMul')));
    return v;
  }

  function rollRewardCard(rareBoost) {
    var roll = rnd();
    var rar = 1;
    if (roll < B.rewards.rareChance + (rareBoost || 0)) rar = 3;
    else if (roll < B.rewards.rareChance + (rareBoost || 0) + B.rewards.uncommonChance) rar = 2;
    var pool = Object.keys(ns.CARDS).filter(function (k) {
      var c = ns.CARDS[k];
      return c.rarity === rar && (c.cls === E.run.cls || c.cls === 'any');
    });
    if (pool.length === 0) pool = Object.keys(ns.CARDS).filter(function (k) {
      var c = ns.CARDS[k];
      return c.rarity === 1 && (c.cls === E.run.cls || c.cls === 'any');
    });
    return pick(pool);
  }
  E.rollRewardCard = rollRewardCard;

  function randomArtifact(tier) {
    var pool = Object.keys(ns.ARTIFACTS).filter(function (k) {
      return ns.ARTIFACTS[k].tier === tier && E.run.artifacts.indexOf(k) < 0;
    });
    if (pool.length === 0) return null;
    return pick(pool);
  }
  E.randomArtifact = randomArtifact;

  function addArtifact(id) {
    var r = E.run;
    r.artifacts.push(id);
    var a = ns.ARTIFACTS[id];
    if (a.k === 'maxHp') { r.maxHp += a.v; r.hp += a.v; }
    emit('artifact', { id: id });
  }
  E.addArtifact = addArtifact;

  function winCombat() {
    var r = E.run, kind = E.combat.kind;
    var credits = creditRange(kind);
    r.credits += credits;
    var hb = art('healAfterCombat');
    if (hb > 0) heal(hb);
    var rareBoost = (kind === 'elite' || kind === 'boss') ? B.rewards.eliteRareChance : 0;
    var cards = [], seen = {};
    for (var i = 0; i < B.rewards.cardChoices; i++) {
      var cid = rollRewardCard(rareBoost), guard = 0;
      while (seen[cid] && guard++ < 20) cid = rollRewardCard(rareBoost);
      seen[cid] = true;
      cards.push(cid);
    }
    var artifactDrop = (kind === 'elite') ? randomArtifact(1) : null;
    if (artifactDrop) addArtifact(artifactDrop);
    r.reward = { credits: credits, cards: cards, artifact: artifactDrop, cardTaken: false, kind: kind };
    r.phase = 'reward';
    emit('win', { kind: kind, credits: credits });
    E.save();
  }

  E.takeRewardCard = function (i) {
    var r = E.run;
    if (!r.reward || r.reward.cardTaken) return;
    var id = r.reward.cards[i];
    if (!id) return;
    r.deck.push(mkCard(id, false));
    r.reward.cardTaken = true;
  };

  E.finishReward = function () {
    var r = E.run;
    r.reward = null;
    E.combat = null;
    nodeComplete();
  };

  /* ---------------- Events ------------------------------------------------ */
  function startEvent() {
    var r = E.run;
    var pool = ns.EVENTS.filter(function (ev) { return r.usedEvents.indexOf(ev.id) < 0; });
    if (pool.length === 0) { r.usedEvents = []; pool = ns.EVENTS.slice(); }
    var ev = pick(pool);
    r.usedEvents.push(ev.id);
    r.currentEvent = ev.id;
    r.eventResult = null;
    r.phase = 'event';
  }

  E.getEvent = function () {
    var r = E.run;
    for (var i = 0; i < ns.EVENTS.length; i++) if (ns.EVENTS[i].id === r.currentEvent) return ns.EVENTS[i];
    return null;
  };

  E.eventChoose = function (ci) {
    var r = E.run;
    var ev = E.getEvent();
    var ch = ev.choices[ci];
    if (!ch) return null;
    if (ch.cost && r.credits < ch.cost) return null;

    var res = { roll: null, pass: null, dc: null, bonus: 0 };
    var out;
    if (ch.check) {
      var roll = d20();
      var bonus = Math.floor(attr(ch.check.attr) / B.attrs.eventCheckBonusDiv) + art('checkBonus');
      var pass = (roll + bonus >= ch.check.dc) || roll === 20;
      if (roll === 1) pass = false;
      res.roll = roll; res.bonus = bonus; res.dc = ch.check.dc; res.pass = pass;
      res.attr = ch.check.attr;
      out = pass ? ch.success : ch.fail;
    } else {
      out = ch.outcome;
    }
    res.text = out.text;
    res.gained = applyOutcome(out.fx || {});
    r.eventResult = res;
    if (r.phase !== 'dead') r.phase = 'event-result';
    E.save();
    return res;
  };

  function applyOutcome(fx) {
    var r = E.run, gained = [];
    if (fx.credits) {
      r.credits = Math.max(0, r.credits + fx.credits);
      gained.push((fx.credits > 0 ? '+' : '') + fx.credits + ' credits');
    }
    if (fx.maxhp) {
      r.maxHp += fx.maxhp; r.hp += fx.maxhp;
      gained.push('+' + fx.maxhp + ' Max HP');
    }
    if (fx.healPct) {
      var h = Math.round(r.maxHp * fx.healPct);
      heal(h);
      gained.push('+' + h + ' HP');
    }
    if (fx.hp) {
      if (fx.hp < 0) {
        r.hp += fx.hp;
        gained.push(fx.hp + ' HP');
        if (r.hp <= 0) { playerDied(); return gained; }
      } else { heal(fx.hp); gained.push('+' + fx.hp + ' HP'); }
    }
    if (fx.attr) {
      var a = fx.attr === 'random' ? pick(['might', 'tech', 'psi']) : fx.attr;
      r.attrs[a] += 1;
      gained.push('+1 ' + a.toUpperCase());
    }
    if (fx.card) {
      var cid;
      if (fx.card === 'random') cid = rollRewardCard(0);
      else if (fx.card === 'rare') {
        var rares = Object.keys(ns.CARDS).filter(function (k) {
          var c = ns.CARDS[k];
          return c.rarity === 3 && (c.cls === r.cls || c.cls === 'any');
        });
        cid = rares.length ? pick(rares) : rollRewardCard(0);
      } else cid = fx.card;
      r.deck.push(mkCard(cid, false));
      gained.push('Card: ' + ns.CARDS[cid].name);
    }
    if (fx.artifact) {
      var aid = randomArtifact(1);
      if (aid) { addArtifact(aid); gained.push('Relic: ' + ns.ARTIFACTS[aid].name); }
      else { r.credits += 40; gained.push('+40 credits'); }
    }
    if (fx.curse) {
      r.deck.push(mkCard(fx.curse, false));
      gained.push('CURSE: ' + ns.CARDS[fx.curse].name);
    }
    if (fx.pick) {
      r.pendingPick = fx.pick;
      gained.push(fx.pick === 'remove' ? 'Choose a card to remove' : fx.pick === 'upgrade' ? 'Choose a card to upgrade' : 'Choose a card to duplicate');
    }
    return gained;
  }

  E.finishEvent = function () {
    var r = E.run;
    if (r.pendingPick) return; // must resolve pick first
    r.eventResult = null;
    r.currentEvent = null;
    nodeComplete();
  };

  /* Resolve a pending deck pick (remove / upgrade / dupe). deckIdx into run.deck */
  E.applyPick = function (deckIdx) {
    var r = E.run;
    var t = r.pendingPick;
    if (!t) return false;
    var card = r.deck[deckIdx];
    if (!card) return false;
    if (t === 'remove') r.deck.splice(deckIdx, 1);
    else if (t === 'upgrade') card.up = true;
    else if (t === 'dupe') r.deck.push(mkCard(card.id, card.up));
    r.pendingPick = null;
    E.save();
    return true;
  };

  E.cancelPick = function () { E.run.pendingPick = null; };

  /* ---------------- Shop --------------------------------------------------- */
  function buildShop() {
    var r = E.run;
    var cards = [], seen = {};
    for (var i = 0; i < 3; i++) {
      var cid = rollRewardCard(0.06), guard = 0;
      while (seen[cid] && guard++ < 20) cid = rollRewardCard(0.06);
      seen[cid] = true;
      cards.push({ id: cid, cost: B.shop.cardCost[ns.CARDS[cid].rarity] || 35, sold: false });

    skill: '<svg viewBox="0 0 14 14"><path d="M7 1 L12 4 L12 9 L7 13 L2 9 L2 4 Z"/><path d="M7 4 L7 10"/></svg>',

  function renderHand() {
    $hand.innerHTML = '';

    if (!c) return;
    c.hand.forEach(function (card, i) {
      var info = E.cardInfo(card);
      var d = el('div', 'card type-' + info.type +
        (info.cost > c.energy && !info.unplayable ? ' unaffordable' : '') +
        (info.unplayable ? ' unplayable-curse' : '') +

      d.innerHTML = cardInner(info.name, info.cost, info.type, info.rarity, info.desc, info.unplayable);

  /* ---- swipe-to-play -------------------------------------------------- */
  // Swipe a card up to play it; drag it onto an enemy to choose the target.
  // A short tap (no movement) selects the card for reading instead.
  var drag = null; // {el, idx, info, x0, y0, dx, dy, moved}

  function startCardDrag(el, i, ev) {
    if (locked || drag || !E.combat || E.combat.over) return;
    var card = E.combat.hand[i];
    if (!card) return;
    drag = { el: el, idx: i, info: E.cardInfo(card), x0: ev.clientX, y0: ev.clientY, dx: 0, dy: 0, moved: false };
    if (el.setPointerCapture && ev.pointerId !== undefined) {
      try { el.setPointerCapture(ev.pointerId); } catch (e) { /* not supported */ }
    }
  }

  function onDragMove(ev) {
    if (!drag) return;
    drag.dx = ev.clientX - drag.x0;
    drag.dy = ev.clientY - drag.y0;
    if (!drag.moved && Math.abs(drag.dx) + Math.abs(drag.dy) > 9) {
      drag.moved = true;
      drag.el.classList.add('dragging');
      if (selected >= 0) { selected = -1; var s = $hand.querySelector('.card.selected'); if (s) s.classList.remove('selected'); }
      var multi = E.aliveEnemies().length > 1;
      if (drag.info.needsTarget && multi && !drag.info.unplayable) setTargeting(true);
    }
    if (drag.moved) {
      var lift = Math.min(0, drag.dy);
      drag.el.style.transform = 'translate(' + drag.dx + 'px,' + drag.dy + 'px) scale(' + (1 + Math.min(0.25, -lift / 400)) + ')';
      var armed = canDropPlay(ev);
      drag.el.classList.toggle('will-play', armed);
    }
  }

  function canDropPlay(ev) {
    if (!drag || !E.canPlay(drag.idx)) return false;
    var multi = E.aliveEnemies().length > 1;
    if (drag.info.needsTarget && multi) return enemyAtClient(ev) >= 0;
    return -drag.dy > B.feel.swipeThreshold || enemyAtClient(ev) >= 0;
  }

  function enemyAtClient(ev) {
    var rect = document.getElementById('battlefield').getBoundingClientRect();
    return R.enemyAt(ev.clientX - rect.left, ev.clientY - rect.top);
  }

  function onDragEnd(ev) {
    if (!drag) return;
    var d = drag;
    drag = null;
    d.el.classList.remove('dragging');
    d.el.classList.remove('will-play');
    d.el.style.transform = '';

    if (!d.moved) { cardTapped(d.idx); return; }

    if (locked || !E.combat || E.combat.over) { setTargeting(false); return; }

    var info = d.info;
    if (info.unplayable) { setTargeting(false); toast('UNPLAYABLE — a curse weighs down your deck'); return; }
    if (!E.canPlay(d.idx)) { setTargeting(false); toast('NOT ENOUGH ENERGY'); return; }

    var multi = E.aliveEnemies().length > 1;
    var tgt = enemyAtClient(ev);
    if (info.needsTarget && multi) {
      if (tgt >= 0) playCardAt(d.idx, tgt);
      else {
        setTargeting(false);
        if (-d.dy > B.feel.swipeThreshold) toast('DROP THE CARD ON A TARGET');
      }
    } else {
      if (tgt >= 0 || -d.dy > B.feel.swipeThreshold) playCardAt(d.idx, tgt);
      else setTargeting(false);
    }
  }

  function onDragCancel() {
    if (!drag) return;
    drag.el.classList.remove('dragging');
    drag.el.classList.remove('will-play');
    drag.el.style.transform = '';
    drag = null;
    setTargeting(false);
  }

  // tap = read the card (and arm it for tap-an-enemy targeting)
  function cardTapped(i) {
    if (locked || !E.combat || E.combat.over) return;
    var card = E.combat.hand[i];
    if (!card) return;
    var info = E.cardInfo(card);
    if (i === selected) { selected = -1; setTargeting(false); renderHand(); return; }
    SFX.tap();
    if (info.unplayable) toast('UNPLAYABLE — a curse weighs down your deck');
    selected = i;
    var multi = E.aliveEnemies().length > 1;
    setTargeting(!info.unplayable && info.cost <= E.combat.energy && info.needsTarget && multi);
    renderHand();
  }

  function setTargeting(on) {
    targeting = on;
    R.targeting = on;
    $hint.style.display = on ? 'block' : 'none';
  }

  function onFieldTap(ev) {
    if (locked) return;
    if (!E.combat || E.run.phase !== 'combat') return;
    var rect = ev.currentTarget.getBoundingClientRect();
    var x = ev.clientX - rect.left, y = ev.clientY - rect.top;
    var idx = R.enemyAt(x, y);
    if (selected >= 0) {
      var si = selected;
      if (idx >= 0 && E.canPlay(si)) { selected = -1; playCardAt(si, idx); }
      else { selected = -1; setTargeting(false); renderHand(); }
    } else if (idx >= 0) {
      // inspect enemy
      var en = E.combat.enemies[idx];
      var ii = E.intentInfo(en);
      var what = { atk: 'attacking for ' + ii.label, drain: 'draining ' + ii.label + ' HP', block: 'shielding ' + ii.label, buff: 'powering up', debuff: 'hexing you', curse: 'corrupting your deck' }[ii.icon] || '...';
      toast(en.def.name + ' — intends: ' + what, 1800);
    }
  }

  function playCardAt(i, targetIdx) {
    setTargeting(false);
    if (i < 0 || !E.canPlay(i)) { renderHand(); return; }
    E.events.length = 0;
    var ok = E.playCard(i, targetIdx);
    if (!ok) { renderHand(); return; }
    SFX.play();
    var evts = E.events.slice();
    E.events.length = 0;
    lock(true);
    playTimeline(evts, 70, function () {
      lock(false);
      afterAction();
    });
    // hand & energy update immediately — feels snappy
    renderHand();
    updateEnergy();
    updateCounts();
    updateHUD();
  }

  function doEndTurn() {
    E.events.length = 0;
    E.endTurn();
    var evts = E.events.slice();
    E.events.length = 0;
    lock(true);
    $hand.innerHTML = '';
    playTimeline(evts, B.feel.enemyActDelay, function () {
      lock(false);
      R.refreshIntents();
      afterAction();
    });
  }

  function afterAction() {
    var r = E.run;
    if (r.phase === 'dead') {
      SFX.lose();
      setTimeout(U.refresh, 700);
    } else if (r.phase === 'reward') {
      SFX.win();
      setTimeout(U.refresh, 650);
    } else if (r.phase === 'combat') {
      renderHand();
      updateEnergy();
      updateCounts();
      updateHUD();
    } else {
      U.refresh();
    }
  }

  function lock(on) { locked = on; }

  /* ---- action timeline: replay engine events with cosmetic stagger ---- */
  function playTimeline(evts, stepDelay, done) {
    var delay = 0;
    var pp = R.playerXY();
    evts.forEach(function (e) {
      switch (e.type) {
        case 'enemyMove':
          delay += stepDelay;
          break;
        case 'dmg':
          (function (e, d) {
            setTimeout(function () {
              if (e.who === 'enemy') {
                R.hitEnemy(e.idx);
                R.setEnemyView(e.idx, e.hpAfter, e.blockAfter);
                var pos = R.enemyPos(e.idx);
                var txt = e.hpDmg > 0 ? '-' + e.hpDmg : 'BLOCKED';
                if (e.burn) txt = '-' + e.hpDmg + ' BURN';
                floater(pos.x, pos.y - 20, txt, e.crit ? 'crit' : '');
                if (e.crit) SFX.crit(); else SFX.hit();
              } else {
                R.hitPlayer();
                R.setPlayerView(e.hpAfter, e.blockAfter);
                floater(pp.x + 30, pp.y - 30, e.hpDmg > 0 ? '-' + e.hpDmg : 'BLOCKED', '');
                SFX.hurt();
                updateHUD();
              }
            }, d);
          })(e, delay);
          delay += 90;
          break;
        case 'die':
          (function (e, d) {
            setTimeout(function () {
              R.setEnemyView(e.idx, 0, 0, false);
            }, d);
          })(e, delay);
          delay += 140;
          break;
        case 'block':
          (function (e, d) {
            setTimeout(function () {
              SFX.block();
              if (e.who === 'player') {
                R.setPlayerView(null, e.blockAfter);
                floater(pp.x + 26, pp.y - 24, '+' + e.amount + '⬡', 'block');
                updateHUD();
              } else {
                var v = R.views[e.idx];
                if (v) v.block = e.blockAfter;
                var pos = R.enemyPos(e.idx);
                floater(pos.x, pos.y - 18, '⬡', 'block');
              }
            }, d);
          })(e, delay);
          delay += 60;
          break;
        case 'heal':
          (function (e, d) {
            setTimeout(function () {
              SFX.heal();
              if (e.who === 'player') {
                R.setPlayerView(e.hpAfter, null);
                floater(pp.x + 26, pp.y - 24, '+' + e.amount, 'heal');
                updateHUD();
              } else {
                R.setEnemyView(e.idx, e.hpAfter);
                var pos = R.enemyPos(e.idx);
                floater(pos.x, pos.y - 18, '+' + e.amount, 'heal');
              }
            }, d);
          })(e, delay);
          delay += 60;
          break;
        case 'status':
          (function (e, d) {
            setTimeout(function () {
              var name = (ns.STATUS_NAMES[e.s] || e.s).toUpperCase();
              if (e.who === 'player') {
                floater(pp.x + 30, pp.y - 36, name + ' ' + e.v, 'status');
                updateHUD();
              } else {
                var pos = R.enemyPos(e.idx);
                floater(pos.x, pos.y - 26, name + ' ' + e.v, 'status');
              }
            }, d);
          })(e, delay);
          delay += 60;
          break;
        case 'curse':
          (function (e, d) {
            setTimeout(function () {
              toast('CURSE JAMS YOUR SYSTEMS THIS COMBAT: ' + ns.CARDS[e.card].name.toUpperCase(), 2000);
              floater(pp.x + 30, pp.y - 40, '✕ CURSED', 'status');
            }, d);
          })(e, delay);
          delay += 100;
          break;
        case 'cardPlayed':
          if (e.roll !== null && e.roll !== undefined) {
            (function (e, d) {
              setTimeout(function () {
                if (e.crit) floater(pp.x + 60, pp.y - 56, 'd20: ' + e.roll + ' CRIT!', 'crit');
                else floater(pp.x + 54, pp.y - 50, 'd20: ' + e.roll, 'roll');
              }, d);
            })(e, 0);
          }
          break;
        case 'win':
          delay += 250;
          break;
      }
    });
    setTimeout(done, delay + 220);
  }

  function showEventResult(animate) {
    updateHUD();
    var r = E.run;
    var res = r.eventResult;
    if (!res) { U.refresh(); return; }
    var s = overlayScreen();
    var ev = E.getEvent();
    s.appendChild(el('h2', 'screen-title', esc(ev ? ev.title : 'OUTCOME')));

    var diceBox = null;
    if (res.roll !== null) {
      diceBox = el('div', 'dice-box', '');
      diceBox.innerHTML = '<span class="dc">' + (res.attr || '').toUpperCase() + ' CHECK · DC ' + res.dc + ' (+' + res.bonus + ')</span><span class="roll">—</span>';
      s.appendChild(diceBox);
    }

    var body = el('div', '', '');
    body.style.opacity = animate && diceBox ? '0' : '1';
    body.style.transition = 'opacity 0.3s';
    body.appendChild(el('div', 'event-text event-result-text', esc(res.text)));
    if (res.gained && res.gained.length) {
      var gl = el('div', 'gain-list');
      res.gained.forEach(function (g) { gl.appendChild(el('div', '', esc(g))); });
      body.appendChild(gl);
    }
    var btn = el('button', 'btn', 'CONTINUE');
    btn.addEventListener('pointerdown', function () {
      SFX.tap();
      if (r.pendingPick) {
        showPickModal(r.pendingPick, function () { E.finishEvent(); U.refresh(); });
      } else {
        E.finishEvent();
        U.refresh();
      }
    });
    body.appendChild(btn);
    s.appendChild(body);

    if (diceBox && animate) {
      var rollSpan = diceBox.querySelector('.roll');
      var ticks = 0, max = 13;
      var iv = setInterval(function () {
        ticks++;
        SFX.dice();
        rollSpan.textContent = '' + (1 + Math.floor(Math.random() * 20));
        if (ticks >= max) {
          clearInterval(iv);
          rollSpan.textContent = res.roll + (res.bonus ? ' +' + res.bonus : '');
          diceBox.classList.add(res.pass ? 'pass' : 'fail');
          rollSpan.textContent += res.pass ? '  ✓' : '  ✗';
          if (res.pass) SFX.win(); else SFX.lose();
          body.style.opacity = '1';
        }
      }, 55);
    } else if (diceBox) {
      var rs = diceBox.querySelector('.roll');
      rs.textContent = res.roll + (res.bonus ? ' +' + res.bonus : '') + (res.pass ? '  ✓' : '  ✗');
      diceBox.classList.add(res.pass ? 'pass' : 'fail');
    }
  }

  /* ====================== PICK MODAL (remove/upgrade/dupe) ====================== */
  function showPickModal(type, onDone) {
    var r = E.run;
    var s = overlayScreen();
    var titles = { remove: 'Remove a Card', upgrade: 'Upgrade a Card', dupe: 'Duplicate a Card' };
    s.appendChild(el('h2', 'screen-title', titles[type] || 'Choose a Card'));
    s.appendChild(el('div', 'screen-sub', 'TAP A CARD'));
    var grid = el('div', 'card-grid');
    r.deck.forEach(function (card, i) {
      var def = ns.CARDS[card.id];
      if (type === 'upgrade' && (card.up || def.type === 'curse')) return;
      if (type === 'dupe' && def.type === 'curse') return;
      var d = cardEl(card.id, card.up);
      d.addEventListener('pointerdown', function () {
        SFX.coin();
        E.applyPick(i);
        onDone();
      });
      grid.appendChild(d);
    });
    s.appendChild(grid);
    if (!grid.children.length) {
      E.cancelPick();
      s.appendChild(el('div', 'screen-sub', 'NO VALID CARDS'));
      var btn = el('button', 'btn dim', 'BACK');
      btn.addEventListener('pointerdown', function () { onDone(); });
      s.appendChild(btn);
    }
  }

  /* ====================== SHOP ====================== */
  function showShop() {
    updateHUD();
    var r = E.run;
    var sh = r.shop;
    var s = overlayScreen(true);
    s.appendChild(el('h2', 'screen-title', 'Free Trader'));
    s.appendChild(el('div', 'screen-sub', '“EVERYTHING IS FOR SALE.” · ¢' + r.credits));

    var grid = el('div', 'card-grid');
    sh.cards.forEach(function (it, i) {
      var d = cardEl(it.id, false);
      if (it.sold) d.classList.add('sold');
      d.appendChild(el('div', 'price', '¢' + it.cost));
      d.addEventListener('pointerdown', function () {
        if (it.sold) return;
        if (E.shopBuyCard(i)) { SFX.coin(); showShop(); }
        else toast('NOT ENOUGH CREDITS');
      });
      grid.appendChild(d);
    });
    s.appendChild(grid);

    var row = el('div', 'shop-row');
    if (sh.artifact) {
      var a = ns.ARTIFACTS[sh.artifact.id];
      var ab = el('div', 'panel-btn amber' + (sh.artifact.sold ? ' disabled' : ''),
        '<div class="pb-title">◆ ' + esc(a.name) + ' — ¢' + sh.artifact.cost + '</div>' +
        '<div class="pb-desc">' + esc(a.desc) + '</div>');
      ab.addEventListener('pointerdown', function () {
        if (sh.artifact.sold) return;
        if (E.shopBuyArtifact()) { SFX.coin(); showShop(); }
        else toast('NOT ENOUGH CREDITS');
      });
      s.appendChild(ab);
    }

    var hb = el('button', 'btn cyan small' + (sh.healUsed || r.hp >= r.maxHp ? ' dim' : ''), 'REPAIR +' + B.shop.healAmount + ' HP · ¢' + B.shop.healCost);
    hb.addEventListener('pointerdown', function () {
      if (E.shopBuyHeal()) { SFX.heal(); showShop(); }
      else toast(r.hp >= r.maxHp ? 'HULL ALREADY INTACT' : sh.healUsed ? 'SOLD OUT' : 'NOT ENOUGH CREDITS');
    });
    row.appendChild(hb);

    var rb = el('button', 'btn red small' + (sh.removeUsed ? ' dim' : ''), 'PURGE A CARD · ¢' + r.removeCost);
    rb.addEventListener('pointerdown', function () {
      if (sh.removeUsed) { toast('SERVICE USED'); return; }
      if (E.shopBuyRemove()) {
        SFX.tap();
        showPickModal('remove', function () { showShop(); });
      } else toast('NOT ENOUGH CREDITS');
    });
    row.appendChild(rb);
    s.appendChild(row);

    var leave = el('button', 'btn', 'DEPART');
    leave.addEventListener('pointerdown', function () { SFX.tap(); E.leaveShop(); U.refresh(); });
    s.appendChild(leave);
  }

  /* ====================== REST ====================== */
  function showRest() {
    updateHUD();
    var r = E.run;
    var s = overlayScreen(true);
    s.appendChild(el('h2', 'screen-title', 'Field Camp'));
    s.appendChild(el('div', 'screen-sub', 'THE GUNS GO QUIET FOR A WHILE'));
    var healAmt = Math.round(r.maxHp * B.rewards.restHealPct);
    var h = el('div', 'panel-btn cyan',
      '<div class="pb-title">+ PATCH WOUNDS</div><div class="pb-desc">Heal ' + healAmt + ' HP (' + r.hp + ' → ' + Math.min(r.maxHp, r.hp + healAmt) + ')</div>');
    h.addEventListener('pointerdown', function () { SFX.heal(); E.restHeal(); U.refresh(); });
    s.appendChild(h);
    var u = el('div', 'panel-btn amber',
      '<div class="pb-title">▲ REFINE A CARD</div><div class="pb-desc">Permanently upgrade one card in your deck.</div>');
    u.addEventListener('pointerdown', function () {
      SFX.tap();
      E.restUpgrade();
      showPickModal('upgrade', function () {
        if (E.run.pendingPick) { E.cancelPick(); showRest(); return; }
        E.nodeComplete();
        U.refresh();
      });
    });
    s.appendChild(u);
  }

  /* ====================== LEVEL UP / BOSS ARTIFACT ====================== */
  function showLevelUp() {
    updateHUD();
    var s = overlayScreen(true);
    s.appendChild(el('h2', 'screen-title', 'Level Up'));
    s.appendChild(el('div', 'screen-sub', 'THE DESCENT HARDENS YOU · CHOOSE ONE'));
    E.levelUpOptions().forEach(function (opt) {
      var btn = el('div', 'panel-btn',
        '<div class="pb-title">' + esc(opt.label) + '</div><div class="pb-desc">' + esc(opt.desc) + '</div>');
      btn.addEventListener('pointerdown', function () {
        SFX.win();
        E.levelUp(opt.id);
        U.refresh();
      });
      s.appendChild(btn);
    });
  }

  function showBossArtifact() {
    updateHUD();
    var r = E.run;
    var s = overlayScreen(true);
    s.appendChild(el('h2', 'screen-title', 'Spoils of War'));
    s.appendChild(el('div', 'screen-sub', 'CLAIM ONE RELIC'));
    (r.bossArtifacts || []).forEach(function (id, i) {
      var a = ns.ARTIFACTS[id];
      var btn = el('div', 'panel-btn amber',
        '<div class="pb-title">◆ ' + esc(a.name) + '</div><div class="pb-desc">' + esc(a.desc) + '</div>');
      btn.addEventListener('pointerdown', function () {
        SFX.coin();
        E.takeBossArtifact(i);
        U.refresh();
      });
      s.appendChild(btn);
    });
    if (!r.bossArtifacts || !r.bossArtifacts.length) {
      var btn2 = el('button', 'btn', 'CONTINUE');
      btn2.addEventListener('pointerdown', function () { E.takeBossArtifact(-1); U.refresh(); });
      s.appendChild(btn2);
    }
  }

  function showSectorIntro() {
    updateHUD();
    var r = E.run;
    var fac = ns.FACTIONS[r.faction];
    var s = overlayScreen();
    s.appendChild(el('div', 'sector-banner', 'SECTOR ' + r.sector));
    var ft = el('div', 'faction-tag', esc(fac.name.toUpperCase()) + ' TERRITORY — ' + esc(fac.desc.toUpperCase()));
    ft.style.color = fac.color;
    s.appendChild(ft);
    s.appendChild(el('div', 'screen-sub', 'ENEMIES GROW STRONGER. SO DO YOU.'));
    var btn = el('button', 'btn', 'DESCEND');
    btn.addEventListener('pointerdown', function () { SFX.play(); E.beginSector(); U.refresh(); });
    s.appendChild(btn);
  }

  /* ====================== GAME OVER ====================== */
  function showGameOver() {
    combatChrome(false);
    var r = E.run;
    var s = overlayScreen();
    s.appendChild(el('h2', 'screen-title', 'Signal Lost'));
    s.appendChild(el('div', 'screen-sub', 'YOUR DESCENT ENDS IN SECTOR ' + r.sector));
    s.appendChild(el('div', 'big-score', E.score() + ' PTS'));
    var best = E.getBest();
    var lines = [
      'SECTOR REACHED: ' + r.sector,
      'NODES CLEARED: ' + r.nodesCleared,
      'KILLS: ' + r.kills,
      'RELICS: ' + r.artifacts.length,
    ];
    if (best) lines.push('', 'BEST: ' + best.score + ' PTS (SECTOR ' + best.sector + ')');
    var gl = el('div', 'gain-list');
    lines.forEach(function (l) { gl.appendChild(el('div', '', esc(l))); });
    s.appendChild(gl);
    var btn = el('button', 'btn', 'NEW DESCENT');
    btn.addEventListener('pointerdown', function () {
      SFX.tap();
      E.abandonRun();
      U.refresh();
    });
    s.appendChild(btn);
  }

  /* ====================== DECK & MENU MODALS ====================== */
  function showDeckModal() {
    var r = E.run;
    if (!r) return;
    var wasCombat = (r.phase === 'combat');
    var s = overlayScreen();
    s.appendChild(el('h2', 'screen-title', 'Your Deck (' + r.deck.length + ')'));
    var grid = el('div', 'card-grid');
    r.deck.slice().sort(function (a, b) {
      return ns.CARDS[a.id].cost - ns.CARDS[b.id].cost;
    }).forEach(function (card) {
      grid.appendChild(cardEl(card.id, card.up));
    });
    s.appendChild(grid);
    var btn = el('button', 'btn', 'CLOSE');
    btn.addEventListener('pointerdown', function () {
      SFX.tap();
      if (wasCombat) showCombat(); else U.refresh();
    });
    s.appendChild(btn);
  }

  function showMenu() {
    var r = E.run;
    var wasCombat = r && r.phase === 'combat';
    var s = overlayScreen();
    s.appendChild(el('h2', 'screen-title', 'VOIDSPIRE'));
    s.appendChild(el('div', 'screen-sub', 'SYSTEM MENU'));

    var resume = el('div', 'panel-btn', '<div class="pb-title">▶ RESUME</div>');
    resume.addEventListener('pointerdown', function () { SFX.tap(); if (wasCombat) showCombat(); else U.refresh(); });
    s.appendChild(resume);

    var mute = el('div', 'panel-btn cyan', '<div class="pb-title">' + (muted ? '◇ SOUND: OFF' : '◆ SOUND: ON') + '</div>');
    mute.addEventListener('pointerdown', function () { muted = !muted; showMenu(); });
    s.appendChild(mute);

    var help = el('div', 'panel-btn magenta', '<div class="pb-title">? FIELD MANUAL</div>');
    help.addEventListener('pointerdown', function () { SFX.tap(); showHelp(wasCombat); });
    s.appendChild(help);

    var abandon = el('div', 'panel-btn', '<div class="pb-title" style="color:var(--red)">✕ ABANDON RUN</div><div class="pb-sub">Progress will be lost</div>');
    var confirming = false;
    abandon.addEventListener('pointerdown', function () {
      if (!confirming) {
        confirming = true;
        abandon.querySelector('.pb-title').textContent = '✕ TAP AGAIN TO CONFIRM';
        return;
      }
      E.abandonRun();
      U.refresh();
    });
    s.appendChild(abandon);
  }

  function showHelp(wasCombat) {
    var s = overlayScreen();
    s.appendChild(el('h2', 'screen-title', 'Field Manual'));
    var txt =
      'SWIPE a card up to play it — or drag it onto an enemy to choose your target. TAP a card to read it first.\n\n' +
      'ENERGY (⚡) limits your plays each turn. Unspent SHIELD (⬡) blocks damage but expires.\n\n' +
      'd20: every attack rolls a die. A high roll is a CRIT for double damage.\n\n' +
      'MIGHT boosts weapons, TECH boosts shields & tech, PSI boosts psionics. Attributes also decide skill checks at events.\n\n' +
      'Beat a sector boss to LEVEL UP and claim a relic. The descent is endless — how deep can you go?';
    var p = el('div', 'event-text', '');
    p.style.whiteSpace = 'pre-line';
    p.textContent = txt;
    s.appendChild(p);
    var btn = el('button', 'btn', 'CLOSE');
    btn.addEventListener('pointerdown', function () { SFX.tap(); if (wasCombat) showCombat(); else showMenu(); });
    s.appendChild(btn);
  }

})(typeof window !== 'undefined' ? (window.VS = window.VS || {}) : (global.VS = global.VS || {}));

/* ===== js/main.js ===== */
/* =========================================================================
 * VOIDSPIRE — main.js
 * Boot, resize handling, render loop.
 * ========================================================================= */
(function (ns) {
  'use strict';

  function boot() {
    var canvas = document.getElementById('battlefield');
    ns.render.init(canvas);
    ns.ui.init();

    window.addEventListener('resize', function () {
      ns.render.resize();
      if (ns.engine.combat) ns.render.syncCombat();
    });

    // prevent rubber-band scrolling on iOS, but allow overlay screens to scroll
    document.addEventListener('touchmove', function (e) {
      if (e.target && e.target.closest && e.target.closest('.screen')) return;
      e.preventDefault();
    }, { passive: false });
    document.addEventListener('gesturestart', function (e) { e.preventDefault(); });

    var last = performance.now();
    function loop(now) {
      var dt = Math.min(0.05, (now - last) / 1000);
      last = now;
      ns.render.frame(dt);
      requestAnimationFrame(loop);
    }
    requestAnimationFrame(loop);
  }

  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot);
  else boot();

})(window.VS = window.VS || {});

</script>
