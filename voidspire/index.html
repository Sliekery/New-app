<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<!-- GitHub Pages serves index.html with a long cache, and a single-file game
     means one stale document hides every change at once. Three separate "this
     feature is missing" reports turned out to be exactly that. Ask the browser
     to revalidate; the build stamp on the title screen is the backstop when it
     does not. -->
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<!-- Inline, as a data URI, because the bundled single file is served with
     nothing beside it — itch.io unzips it on its own — so a <link> to an icon
     file would point at nothing. -->
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%230b0e14'/%3E%3Cg fill='none' stroke='%2360e8ff' stroke-width='2.5' stroke-linecap='round'%3E%3Cpath d='M16 4 L26 16 L16 28 L6 16 Z'/%3E%3Ccircle cx='16' cy='16' r='3.5'/%3E%3C/g%3E%3C/svg%3E">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#04080a">
<title>VOIDSPIRE</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="game">
    <canvas id="battlefield"></canvas>
    <div id="hud"></div>
    <div id="hand"></div>
    <div id="combat-controls"></div>
    <div id="overlay"></div>
    <div id="floaters"></div>
    <div id="chain"><div id="chain-combo"></div><div id="chain-ledger"></div></div>
    <div id="toast"></div>
  </div>
  <div id="crt"></div>

  <script src="js/balance.js"></script>
  <script src="js/cards.js"></script>
  <script src="js/cardart.js"></script>
  <script src="js/artifacts.js"></script>
  <script src="js/uiart.js"></script>
  <script src="js/samples.js"></script>
  <script src="js/dice.js"></script>
  <script src="js/dieview.js"></script>
  <script src="js/reforge.js"></script>
  <script src="js/chassis.js"></script>
  <script src="js/potions.js"></script>
  <script src="js/echoes.js"></script>
  <script src="js/playerart.js"></script>
  <script src="js/enemies.js"></script>
  <script src="js/events.js"></script>
  <script src="js/story.js"></script>
  <script src="js/engine.js"></script>
  <script src="js/render.js"></script>
  <script src="js/music.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/main.js"></script>
  <!-- the dev console: inert unless the url says ?dev=1 -->
  <script src="js/dev.js"></script>
</body>
</html>
